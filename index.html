<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MRET</title>
<meta name="description" content="Real estate, agent training, tech support and the tools Uhuru Matlhaji builds for agents and families.">
<meta name="theme-color" content="#031413">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Syncopate:wght@700&display=swap">
<style>[hidden] { display: none !important; }
:root {
  --bg: #061512; --bg-2: #092c29; --sand: #dcc7a7; --aqua: #a6fff0; --white: #f7fffc;
  --ink: #f7fffc; --ink-2: rgba(226, 244, 240, .8); --ink-3: rgba(196, 226, 220, .58);
  --line: rgba(255, 255, 255, .04); --line-2: rgba(255, 255, 255, .04);
  --glass: rgba(14, 44, 42, .38); --glass-2: rgba(14, 44, 42, .6); --edge: rgba(255, 255, 255, .04);
  --blue: #37e3ce; --blue-2: #a6fff0; --cyan: #a6fff0; --blue-ink: #04201c; --mint: #37e3ce;
  --grad: linear-gradient(100deg, #a6fff0 0%, #37e3ce 55%, #1fc4b0 100%);
  --chrome: linear-gradient(180deg, #f7fffc 0%, #dffff8 45%, #37e3ce 100%);
  --shadow: 0 1px 0 rgba(255, 255, 255, .04) inset, 0 30px 70px -30px rgba(0, 0, 0, .7), 0 2px 10px rgba(0, 0, 0, .2);
  --r: 24px; --r-s: 16px;
  --display: 'Syncopate', 'Manrope', system-ui, sans-serif; --sans: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --wrap: 1240px; --gut: clamp(16px, 3.4vw, 40px); --ease: cubic-bezier(.2, .7, .2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { margin: 0; color: var(--ink); font: 400 16.5px/1.6 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; background: var(--bg); }
.scene { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; background: #020b0a; --mx: 0; --my: 0; }
.scene .ly { position: absolute; inset: -3%; width: 106%; height: 106%; display: block; transition: transform 1.2s cubic-bezier(.2, .7, .2, 1); will-change: transform; }
.scene .l1 { transform: translate3d(calc(var(--mx) * -10px), calc(var(--my) * -6px), 0); }
.scene .l2 { transform: translate3d(calc(var(--mx) * -22px), calc(var(--my) * -10px), 0); }
.scene .l3 { transform: translate3d(calc(var(--mx) * -38px), calc(var(--my) * -14px), 0); }
.scene .tw { animation: twinkle 6s ease-in-out infinite alternate; }
.scene .halo { animation: breathe 9s ease-in-out infinite alternate; transform-origin: 250px 300px; }
.scene .shim { animation: shimmer 7s ease-in-out infinite alternate; }
@keyframes twinkle { from { opacity: .35; } to { opacity: 1; } }
@keyframes breathe { from { opacity: .55; transform: scale(.98); } to { opacity: 1; transform: scale(1.03); } }
@keyframes shimmer { from { transform: translateX(-24px); opacity: .5; } to { transform: translateX(24px); opacity: 1; } }
.scene .beam { position: absolute; inset: 0; background: radial-gradient(60% 50% at 78% 8%, rgba(166, 255, 240, .12), transparent 60%), linear-gradient(115deg, transparent 40%, rgba(166, 255, 240, .05) 50%, transparent 60%); mix-blend-mode: screen; }
.scene .vig { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(2, 10, 9, .55)), linear-gradient(180deg, rgba(2, 10, 9, .25), rgba(2, 10, 9, 0) 30%, rgba(2, 10, 9, .3)); }
body.leaving #app { opacity: 0; transform: scale(.99); filter: blur(4px); }
#app { transition: opacity .22s ease, transform .22s ease, filter .22s ease; }

img { display: block; max-width: 100%; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 6px; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 100; background: var(--mint); color: var(--blue-ink); padding: 10px 14px; font-weight: 700; text-decoration: none; border-radius: 10px; }
.skip:focus { top: 12px; }
.wrap { width: 100%; max-width: var(--wrap); margin: 0 auto; padding: 0 var(--gut); }

/* glass surface */
.glass { position: relative; background: linear-gradient(160deg, rgba(60, 120, 112, .26), rgba(8, 30, 28, .34)); border: 1px solid var(--edge); border-radius: var(--r); box-shadow: var(--shadow); backdrop-filter: blur(18px) saturate(130%); -webkit-backdrop-filter: blur(18px) saturate(130%); }
.glass::before { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(140deg, rgba(255, 255, 255, .14), rgba(255, 255, 255, 0) 36%, rgba(255, 255, 255, 0) 72%, rgba(55, 227, 206, .06)); }

.eyebrow { display: inline-flex; align-items: center; gap: 10px; font: 700 11px/1 var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-2); }
.eyebrow::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--grad); box-shadow: 0 0 0 4px rgba(55, 227, 206, .15); }
h1, h2, h3 { font-weight: 700; margin: 0; letter-spacing: -.02em; }
.display, .hero-h { font: 600 clamp(22px, 2.2vw, 30px)/1.25 var(--sans); letter-spacing: -.01em; color: var(--ink); }
.h2 em, .gate-panel h1 em { font-style: normal; color: var(--mint); }
.h2 { font: 700 clamp(28px, 3.4vw, 44px)/1.08 var(--sans); letter-spacing: -.025em; text-wrap: balance; }
.lede { color: var(--ink-2); font-size: clamp(15.5px, 1.2vw, 17.5px); max-width: 38em; }
.btn { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 22px; border-radius: 999px; border: 1px solid var(--line-2); background: rgba(255, 255, 255, .10); color: var(--ink); text-decoration: none; font: 700 13px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; transition: transform .25s var(--ease), box-shadow .25s, background .25s, border-color .25s; backdrop-filter: blur(8px); }
.btn:hover { border-color: var(--ink-3); background: rgba(255, 255, 255, .15); transform: translateY(-1px); }
.btn.gold { background: var(--grad); border-color: transparent; color: var(--blue-ink); box-shadow: 0 10px 24px -10px rgba(55, 227, 206, .65), 0 1px 0 rgba(255, 255, 255, .09) inset; }
.btn.gold:hover { box-shadow: 0 14px 30px -10px rgba(55, 227, 206, .8), 0 1px 0 rgba(255, 255, 255, .09) inset; }
.btn .arr { transition: transform .25s var(--ease); }
.btn:hover .arr { transform: translateX(3px); }
.actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
.pill { display: inline-flex; align-items: center; gap: 9px; height: 32px; padding: 0 14px; border-radius: 999px; background: rgba(255, 255, 255, .12); border: 1px solid var(--edge); font: 700 10.5px/1 var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--ink-2); box-shadow: 0 4px 14px -8px rgba(0, 0, 0, .3); }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 4px rgba(55, 227, 206, .2), 0 0 12px var(--mint); }

/* header */
.hdr { position: fixed; inset: 0 0 auto; z-index: 50; padding-top: 14px; transition: padding .3s var(--ease); }
.hdr .wrap { display: flex; align-items: center; gap: 22px; }
.hdr .bar { display: flex; align-items: center; gap: 22px; width: 100%; height: 64px; padding: 0 12px 0 14px; border-radius: 20px; border: 1px solid transparent; transition: background .35s, border-color .35s, box-shadow .35s; }
.hdr.solid .bar { background: rgba(255, 255, 255, .11); border-color: var(--edge); box-shadow: var(--shadow); backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%); }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; margin-right: auto; min-width: 0; }
.brand .logo { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: linear-gradient(145deg, rgba(255, 255, 255, .16), rgba(55, 227, 206, .08)); border: 1px solid var(--edge); box-shadow: 0 6px 16px -8px rgba(0, 0, 0, .45); flex: none; }
.brand .logo b { font: 700 15px/1 var(--display); background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand > b { font: 700 15px/1 var(--display); letter-spacing: .14em; }
.brand > span:not(.logo) { font: 600 10.5px/1.2 var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
.nav { display: flex; gap: 4px; }
.nav a { text-decoration: none; font: 600 13.5px/1 var(--sans); color: var(--ink-2); padding: 10px 12px; border-radius: 999px; transition: color .2s, background .2s; white-space: nowrap; }
.nav a:hover, .nav a[aria-current="true"] { color: var(--ink); background: rgba(255, 255, 255, .14); box-shadow: 0 2px 10px -6px rgba(0, 0, 0, .4); }
.menu-btn { display: none; background: rgba(255, 255, 255, .12); border: 1px solid var(--edge); color: var(--ink); height: 42px; padding: 0 16px; border-radius: 999px; font: 700 12px var(--sans); letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
.sheet { position: fixed; inset: 0; z-index: 60; background: rgba(3, 22, 20, .88); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); display: flex; flex-direction: column; padding: 18px var(--gut) 32px; transform: translateY(-100%); visibility: hidden; transition: transform .45s var(--ease), visibility 0s .45s; }
.sheet.open { transform: none; visibility: visible; transition: transform .45s var(--ease); }
.sheet .top { display: flex; justify-content: space-between; align-items: center; height: 54px; }
.sheet nav { display: flex; flex-direction: column; margin-top: 28px; gap: 8px; }
.sheet nav a { font: 700 22px/1.1 var(--sans); letter-spacing: -.01em; text-decoration: none; padding: 18px 20px; border-radius: 18px; background: var(--glass-2); border: 1px solid var(--edge); display: flex; justify-content: space-between; align-items: center; }
.sheet nav a small { font: 700 11px var(--sans); color: var(--ink-3); letter-spacing: .14em; text-transform: uppercase; }

/* universe: entry and portals */
.universe { padding: 116px 0 18px; min-height: 100svh; display: flex; flex-direction: column; justify-content: center; }
.u-intro { text-align: center; display: flex; flex-direction: column; align-items: center; }
.u-title { margin: 22px 0 0; font: 700 clamp(30px, 5.4vw, 76px)/1.02 var(--display); letter-spacing: .02em; text-transform: uppercase; text-wrap: balance; max-width: 15em; color: var(--white); text-shadow: 0 6px 40px rgba(0, 0, 0, .45); }
.u-title span { background: var(--chrome); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 22px rgba(55, 227, 206, .35)); }
.u-sub { margin: 18px 0 0; color: var(--ink-2); font-size: clamp(15.5px, 1.4vw, 19px); max-width: 34em; text-shadow: 0 2px 18px rgba(0, 0, 0, .5); }
.u-stage { margin-top: clamp(30px, 5vh, 56px); perspective: 1400px; }
.portals { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px; }
.portals li { animation: rise .9s var(--ease) both; animation-delay: calc(var(--d) * 70ms + 150ms); }
.portals li:nth-child(4n+2) { transform: translateY(26px); } .portals li:nth-child(4n+3) { transform: translateY(-8px); } .portals li:nth-child(4n) { transform: translateY(18px); }
@keyframes rise { from { opacity: 0; translate: 0 30px; } to { opacity: 1; translate: 0 0; } }
.portal { --rx: 0deg; --ry: 0deg; --gx: 50%; --gy: 0%; position: relative; display: flex; flex-direction: column; gap: 8px; height: 100%; min-height: 220px; padding: 20px 20px 18px; border-radius: 22px; text-decoration: none; color: var(--ink); overflow: hidden; isolation: isolate;
  background: linear-gradient(160deg, rgba(70, 140, 130, .26), rgba(6, 26, 24, .5)); border: 1px solid rgba(255, 255, 255, .16); box-shadow: 0 1px 0 rgba(255, 255, 255, .14) inset, 0 30px 60px -30px rgba(0, 0, 0, .8);
  backdrop-filter: blur(16px) saturate(130%); -webkit-backdrop-filter: blur(16px) saturate(130%); transform: rotateX(var(--rx)) rotateY(var(--ry)); transform-style: preserve-3d; transition: transform .45s var(--ease), border-color .3s, box-shadow .3s; animation: drift 8s ease-in-out infinite alternate; animation-delay: calc(var(--d) * -1.3s); }
@keyframes drift { from { translate: 0 0; } to { translate: 0 -6px; } }
.portal::before { content: ''; position: absolute; inset: 0; z-index: -1; background: radial-gradient(220px 160px at var(--gx) var(--gy), color-mix(in srgb, var(--acc) 26%, transparent), transparent 70%); opacity: .7; transition: opacity .3s; }
.portal .p-glow { position: absolute; left: 18px; right: 18px; bottom: -1px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--acc), transparent); opacity: .55; box-shadow: 0 0 18px var(--acc); animation: glow 4s ease-in-out infinite alternate; animation-delay: calc(var(--d) * -.7s); }
@keyframes glow { from { opacity: .3; } to { opacity: .85; } }
.portal:hover, .portal:focus-visible { border-color: color-mix(in srgb, var(--acc) 55%, transparent); box-shadow: 0 1px 0 rgba(255, 255, 255, .18) inset, 0 34px 70px -30px rgba(0, 0, 0, .85), 0 0 40px -12px var(--acc); }
.portal:hover::before { opacity: 1; }
.p-top { display: flex; justify-content: space-between; align-items: flex-start; }
.p-ic { width: 52px; height: 52px; border-radius: 15px; display: grid; place-items: center; color: var(--acc); background: linear-gradient(145deg, rgba(255, 255, 255, .14), rgba(255, 255, 255, .02)); border: 1px solid rgba(255, 255, 255, .16); box-shadow: 0 0 24px -8px var(--acc), 0 1px 0 rgba(255, 255, 255, .2) inset; transform: translateZ(30px); }
.p-acc { font: 700 10px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); padding: 7px 9px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .12); background: rgba(0, 0, 0, .18); }
.p-t { margin-top: 14px; font: 700 19px/1.2 var(--sans); letter-spacing: -.01em; transform: translateZ(20px); }
.p-d { color: var(--ink-2); font-size: 13.5px; line-height: 1.5; flex: 1; }
.p-go { display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; font: 700 11.5px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--acc); }
.p-go .arr { transition: transform .3s var(--ease); }
.portal:hover .p-go .arr { transform: translateX(4px); }
.u-hint { display: none; }

/* hero */
.hero { padding: 22px 0 0; }
.hero-card { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, .92fr); min-height: min(640px, calc(100svh - 150px)); overflow: hidden; }
.hero-txt { container-type: inline-size; padding: clamp(28px, 4.4vw, 60px); display: flex; flex-direction: column; justify-content: center; position: relative; z-index: 2; }
.mark { font: 700 clamp(44px, 9.6vw, 148px)/.9 var(--display); font-size: clamp(44px, 20cqi, 148px); white-space: nowrap; letter-spacing: .02em; margin: 26px 0 22px; background: var(--chrome); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 28px rgba(55, 227, 206, .25)); }
.hero-h { max-width: 22em; text-wrap: balance; }
.hero .lede { margin: 14px 0 0; }
.hero-txt .pill { align-self: flex-start; }
.hero-media { position: relative; min-height: 360px; overflow: hidden; border-left: 1px solid rgba(255, 255, 255, .10); }
.hero-media > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; animation: settle 2.2s var(--ease) both; }
.hero-media::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(4, 24, 22, .45), rgba(4, 24, 22, 0) 35%), linear-gradient(0deg, rgba(4, 24, 22, .45), transparent 30%); }
@keyframes settle { from { transform: scale(1.05); opacity: .4; } to { transform: none; opacity: 1; } }
.orbit { position: absolute; right: 22px; bottom: 22px; width: 118px; height: 118px; z-index: 3; border-radius: 50%; background: rgba(255, 255, 255, .06); border: 1px solid var(--edge); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: grid; place-items: center; }
.orbit svg { position: absolute; inset: 0; width: 100%; height: 100%; animation: spin 26s linear infinite; }
.orbit text { font: 700 8.2px var(--sans); letter-spacing: .1em; fill: var(--ink-2); text-transform: uppercase; }
.orbit i { width: 12px; height: 12px; background: var(--grad); transform: rotate(45deg); border-radius: 2px; box-shadow: 0 0 18px rgba(55, 227, 206, .9); }
@keyframes spin { to { transform: rotate(360deg); } }

/* crystal and art (used until a photograph is chosen) */
.crystal { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(60% 55% at 55% 45%, rgba(55, 227, 206, .18), transparent 75%); }
.crystal svg { width: min(78%, 440px); height: auto; filter: drop-shadow(0 30px 50px rgba(55, 227, 206, .35)); animation: float 7s ease-in-out infinite; }
.crystal .ring { position: absolute; width: min(86%, 500px); aspect-ratio: 1; border-radius: 50%; border: 1px solid rgba(55, 227, 206, .18); }
.crystal .ring.r2 { width: min(62%, 360px); border-style: dashed; border-color: rgba(55, 227, 206, .22); animation: spin 60s linear infinite; }
@keyframes float { 50% { transform: translateY(-12px) rotate(-2deg); } }
.art { position: relative; overflow: hidden; background: radial-gradient(120% 90% at var(--ax, 70%) var(--ay, 20%), #1c6a61 0%, #0b3a36 45%, #041b19 100%); }
.art .crystal { background: none; }
.art .crystal svg { width: min(54%, 300px); }
.art::after { content: ''; position: absolute; inset: 0; background: radial-gradient(50% 40% at var(--ax, 70%) var(--ay, 20%), rgba(55, 227, 206, .22), transparent 70%); }

/* stats strip */
.stats { margin-top: 18px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) minmax(0, 1.4fr); }
.stat { padding: 24px 26px; display: grid; gap: 4px; align-content: start; }
.stat + .stat { border-left: 1px solid var(--line); }
.stat .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: rgba(255, 255, 255, .14); border: 1px solid var(--edge); color: var(--blue); margin-bottom: 10px; }
.stat b { font: 700 clamp(28px, 2.8vw, 38px)/1 var(--sans); letter-spacing: -.03em; }
.stat span { font-size: 13px; color: var(--ink-3); font-weight: 600; }
.stat.quote { font-size: 14.5px; color: var(--ink-2); align-content: center; line-height: 1.55; }
.stat.quote small { display: block; margin-top: 8px; font: 700 11px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); }

/* sections */
section.blk { padding: clamp(18px, 2vw, 22px) 0; position: relative; }
section.blk:first-child { padding-top: 22px; }
.panel { padding: clamp(24px, 3.6vw, 48px); }
.blk-head { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 18px clamp(24px, 5vw, 72px); align-items: end; margin-bottom: clamp(24px, 3.4vw, 40px); }
.blk-head .h2 { margin-top: 14px; }
.blk-head .lede { margin: 0; }

/* featured: case cards */
.cases { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 228px), 1fr)); gap: 16px; }
.case { display: flex; flex-direction: column; height: 100%; text-decoration: none; padding: 12px 12px 18px; border-radius: 20px; background: rgba(255, 255, 255, .10); border: 1px solid var(--edge); box-shadow: 0 14px 34px -24px rgba(0, 0, 0, .5); transition: transform .35s var(--ease), box-shadow .35s, background .35s; }
.case:hover { transform: translateY(-4px); background: rgba(255, 255, 255, .14); box-shadow: 0 26px 50px -26px rgba(0, 0, 0, .6); }
.case .shot { position: relative; aspect-ratio: 16 / 10; border-radius: 14px; overflow: hidden; background: #0a2f2c; }
.case .shot img, .case .shot .art { width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s var(--ease); }
.case:hover .shot img { transform: scale(1.04); }
.case .num { position: absolute; left: 10px; top: 10px; z-index: 2; font: 700 11px/1 var(--sans); letter-spacing: .1em; padding: 6px 8px; border-radius: 8px; background: rgba(255, 255, 255, .13); backdrop-filter: blur(6px); color: var(--ink); }
.case .t { font: 700 18px/1.2 var(--sans); letter-spacing: -.01em; margin: 16px 6px 6px; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.case .t .arr { color: var(--blue); flex: none; transition: transform .3s var(--ease); }
.case:hover .t .arr { transform: translateX(3px); }
.case .d { color: var(--ink-2); font-size: 14px; margin: 0 6px; flex: 1; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 6px 0; }
.tag { font: 700 10.5px/1 var(--sans); letter-spacing: .06em; padding: 7px 10px; border-radius: 999px; background: rgba(255, 255, 255, .14); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }

/* pillars */
.pillar { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: clamp(22px, 4vw, 56px); align-items: center; padding: clamp(14px, 1.6vw, 18px); }
.pillar.flip { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); }
.pillar.flip .pm { order: 2; }
.pm { position: relative; aspect-ratio: 5 / 4; overflow: hidden; border-radius: 18px; background: #0a2f2c; }
.pm img, .pm .art { width: 100%; height: 100%; object-fit: cover; transition: transform 1.4s var(--ease); }
.pillar:hover .pm img { transform: scale(1.025); }
.pt { padding: clamp(10px, 2vw, 28px) clamp(10px, 2vw, 28px) clamp(10px, 2vw, 28px) 0; }
.pillar.flip .pt { padding-left: clamp(10px, 2vw, 28px); padding-right: 0; }
.pt .h2 { margin: 14px 0 14px; }
.svc { list-style: none; margin: 24px 0 0; padding: 0; display: grid; gap: 8px; }

<div id="app"><noscript><p style="padding:24px">MRET needs JavaScript to sign you in.</p></noscript></div>
<script>/* MRET site content: default content, validation and helpers.
 * The same file runs in the Apps Script server, the public site and the admin dashboard. */
var CMSX = (function () {
  var STATUS = ['live', 'beta', 'soon'];
  var ACCESS = ['public', 'members', 'owner'];

    c.meta = c.meta || {}; c.brand = c.brand || {}; c.hero = c.hero || {}; c.contact = c.contact || {}; c.footer = c.footer || {};

    t('Brand name', c.brand.name, 40, true); t('Tagline', c.brand.tagline, LIMITS.short);
    t('Hero eyebrow', c.hero.eyebrow, 60); t('Hero heading', c.hero.heading, 140, true); t('Hero text', c.hero.text, LIMITS.text);
    if (!imgOk(c.hero.image)) e.push('Hero image is invalid.');
    link('Hero primary button', c.hero.primary); link('Hero secondary button', c.hero.secondary);
    if (!Array.isArray(c.categories) || !c.categories.length) e.push('Add at least one category.');
    else if (c.categories.length > LIMITS.categories) e.push('Too many categories.');
    var cats = {};

        var p = 'Service "' + (s.title || i + 1) + '"';
        if (!idOk(s.id)) e.push(p + ' has an invalid id.'); else if (sids[s.id]) e.push(p + ': id "' + s.id + '" is used twice.'); sids[s.id] = 1;
        t(p + ' title', s.title, 80, true); t(p + ' description', s.desc, 300);
        if (!cats[s.cat]) e.push(p + ' is in a category that does not exist.');
        if (STATUS.indexOf(s.status) < 0) e.push(p + ' needs an availability.');
        if (ACCESS.indexOf(s.access) < 0) e.push(p + ' needs an access level.');
        if (!urlOk(s.url)) e.push(p + ' link is not valid.');
        if (strict && s.status !== 'soon' && !s.url) e.push(p + ' is marked available but has no link.');
        if (!imgOk(s.image)) e.push(p + ' image is invalid.');

    }

      var secIds = {};

        if (SECTION_TYPES.indexOf(s.type) < 0) e.push(p + ' has an unknown type.');
        t(p + ' eyebrow', s.eyebrow, 60); t(p + ' heading', s.heading, 140, true); t(p + ' text', s.text, LIMITS.text);
        if (s.type === 'pillar' && s.cat && !cats[s.cat]) e.push(p + ' points to a category that does not exist.');
        if (!imgOk(s.image)) e.push(p + ' image is invalid.');

    if (c.contact.email && !/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(c.contact.email)) e.push('Contact email is not a valid address.');
    if (c.contact.phone && !/^\+?[0-9 ()-]{6,20}$/.test(c.contact.phone)) e.push('Contact phone may only hold digits, spaces, brackets, dashes and a leading +.');
    if (c.contact.whatsapp && !/^\+?[0-9 ]{6,20}$/.test(c.contact.whatsapp)) e.push('WhatsApp number may only hold digits, spaces and a leading +.');
    if (!Array.isArray(c.social)) c.social = [];
    if (c.social.length > LIMITS.social) e.push('Too many social links.');
    c.social.forEach(function (s, i) { t('Social link ' + (i + 1) + ' label', s.label, 30, true); if (!s.url || !/^https:\/\//.test(s.url) || !urlOk(s.url)) e.push('Social link ' + (i + 1) + ' must start with https://.'); });

  }

  function forViewer(content, type) {
