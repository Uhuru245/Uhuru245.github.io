<style>[hidden] { display: none !important; }
:root {
  --bg: #07080b; --bg-2: #0a0f1a; --navy: #0d1626; --navy-2: #121d31;
  --ink: #f3f1ec; --ink-2: #b9bdc6; --ink-3: #868c98; --line: rgba(243, 241, 236, .12); --line-2: rgba(243, 241, 236, .22);
  --gold: #c9a55c; --gold-2: #e2c88f; --gold-ink: #1a1408;
  --serif: 'Instrument Serif', 'Times New Roman', serif; --sans: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --wrap: 1240px; --gut: clamp(16px, 4vw, 48px); --ease: cubic-bezier(.2, .7, .2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 17px/1.6 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
img { display: block; max-width: 100%; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 2px; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 100; background: var(--gold); color: var(--gold-ink); padding: 10px 14px; font-weight: 600; text-decoration: none; }
.skip:focus { top: 12px; }
.wrap { width: 100%; max-width: var(--wrap); margin: 0 auto; padding: 0 var(--gut); }
.eyebrow { display: inline-flex; align-items: center; gap: 12px; font: 600 12px/1 var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
.eyebrow::before { content: ''; width: 28px; height: 1px; background: currentColor; opacity: .7; }
h1, h2, h3 { font-weight: 400; margin: 0; letter-spacing: -.01em; }
.display { font: 400 clamp(44px, 7.2vw, 104px)/.98 var(--serif); letter-spacing: -.02em; text-wrap: balance; }
.h2 { font: 400 clamp(34px, 4.6vw, 64px)/1.02 var(--serif); text-wrap: balance; }
.lede { color: var(--ink-2); font-size: clamp(17px, 1.4vw, 20px); max-width: 38em; }
.btn { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 22px; border: 1px solid var(--line-2); color: var(--ink); text-decoration: none; font: 600 15px/1 var(--sans); letter-spacing: .01em; transition: background .25s var(--ease), border-color .25s, color .25s; }
.btn:hover { border-color: var(--ink); }
.btn.gold { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.btn.gold:hover { background: var(--gold-2); border-color: var(--gold-2); }
.btn .arr { transition: transform .25s var(--ease); }
.btn:hover .arr { transform: translateX(3px); }
.actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }

/* header */
.hdr { position: fixed; inset: 0 0 auto; z-index: 50; transition: background .35s, border-color .35s, backdrop-filter .35s; border-bottom: 1px solid transparent; }
.hdr.solid { background: rgba(7, 8, 11, .82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom-color: var(--line); }
.hdr .wrap { display: flex; align-items: center; gap: 28px; height: 72px; }
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; margin-right: auto; }
.brand b { font: 400 28px/1 var(--serif); letter-spacing: .02em; }
.brand span { font-size: 12px; color: var(--ink-3); letter-spacing: .08em; text-transform: uppercase; }
.nav { display: flex; gap: 26px; }
.nav a { text-decoration: none; font-size: 14.5px; color: var(--ink-2); padding: 6px 0; border-bottom: 1px solid transparent; transition: color .2s, border-color .2s; }
.nav a:hover, .nav a[aria-current="true"] { color: var(--ink); border-bottom-color: var(--gold); }
.menu-btn { display: none; background: none; border: 1px solid var(--line-2); color: var(--ink); height: 42px; padding: 0 14px; font: 600 14px var(--sans); cursor: pointer; }
.sheet { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; flex-direction: column; padding: 18px var(--gut) 32px; transform: translateY(-100%); visibility: hidden; transition: transform .45s var(--ease), visibility 0s .45s; }
.sheet.open { transform: none; visibility: visible; transition: transform .45s var(--ease); }
.sheet .top { display: flex; justify-content: space-between; align-items: center; height: 54px; }
.sheet nav { display: flex; flex-direction: column; margin-top: 28px; border-top: 1px solid var(--line); }
.sheet nav a { font: 400 34px/1.1 var(--serif); text-decoration: none; padding: 16px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
.sheet nav a small { font: 500 12px var(--sans); color: var(--ink-3); letter-spacing: .12em; text-transform: uppercase; }

/* hero */
.hero { position: relative; min-height: 100svh; display: flex; align-items: flex-end; isolation: isolate; overflow: hidden; }
.hero .media { position: absolute; inset: 0; z-index: -2; }
.hero .media img, .hero .media .art { width: 100%; height: 100%; object-fit: cover; }
.hero .media img { animation: settle 2.4s var(--ease) both; }
@keyframes settle { from { transform: scale(1.06); opacity: .4; } to { transform: none; opacity: 1; } }
.hero::after { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(7, 8, 11, .55) 0%, rgba(7, 8, 11, .05) 32%, rgba(7, 8, 11, .35) 62%, rgba(7, 8, 11, .96) 100%), linear-gradient(90deg, rgba(7, 8, 11, .7), rgba(7, 8, 11, 0) 65%); }
.hero .wrap { padding-top: 140px; padding-bottom: clamp(48px, 9vh, 96px); }
.hero .display { max-width: 12.5em; margin-top: 22px; }
.hero .lede { margin-top: 26px; }
.hero-foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
.scroll-cue { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); display: flex; align-items: center; gap: 10px; text-decoration: none; }
.scroll-cue i { width: 1px; height: 40px; background: linear-gradient(var(--gold), transparent); display: block; }

/* art fallback (no photograph chosen yet) */
.art { position: relative; background: radial-gradient(120% 90% at var(--ax, 70%) var(--ay, 20%), #1b2a45 0%, #0d1626 45%, #07080b 100%); overflow: hidden; }
.art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.art::after { content: ''; position: absolute; inset: 0; background: radial-gradient(60% 40% at var(--ax, 70%) var(--ay, 20%), rgba(201, 165, 92, .16), transparent 70%); }

/* sections */
section.blk { padding: clamp(80px, 12vw, 160px) 0; position: relative; }
section.blk + section.blk { border-top: 1px solid var(--line); }
.blk-head { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 32px clamp(24px, 6vw, 96px); align-items: end; margin-bottom: clamp(40px, 6vw, 72px); }
.blk-head .h2 { margin-top: 18px; }
.blk-head .lede { margin: 0; }

/* featured: interactive panel */
.feat { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: clamp(24px, 5vw, 72px); align-items: stretch; }
.feat-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); counter-reset: f; }
.feat-list li { border-bottom: 1px solid var(--line); }
.feat-list a { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 4px 18px; align-items: baseline; padding: 26px 4px; text-decoration: none; transition: padding .35s var(--ease), background .35s; }
.feat-list a::before { counter-increment: f; content: counter(f, decimal-leading-zero); font: 500 12px var(--sans); color: var(--ink-3); letter-spacing: .1em; grid-row: span 2; padding-top: 10px; }
.feat-list .t { font: 400 clamp(26px, 2.6vw, 36px)/1.1 var(--serif); }
.feat-list .d { grid-column: 2; color: var(--ink-3); font-size: 15px; max-width: 34em; transition: color .3s; }
.feat-list .go { grid-row: span 2; align-self: center; color: var(--ink-3); transition: color .3s, transform .35s var(--ease); }
.feat-list a:hover, .feat-list a.on { padding-left: 14px; background: linear-gradient(90deg, rgba(201, 165, 92, .07), transparent 70%); }
.feat-list a:hover .d, .feat-list a.on .d { color: var(--ink-2); }
.feat-list a:hover .go, .feat-list a.on .go { color: var(--gold); transform: translateX(4px); }
.feat-stage { position: relative; min-height: 460px; overflow: hidden; background: var(--navy); }
.feat-stage > figure { position: absolute; inset: 0; margin: 0; opacity: 0; transition: opacity .7s var(--ease); }
.feat-stage > figure.on { opacity: 1; }
.feat-stage img, .feat-stage .art { width: 100%; height: 100%; object-fit: cover; }
.feat-stage figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 24px; background: linear-gradient(transparent, rgba(7, 8, 11, .85)); font-size: 13px; color: var(--ink-2); letter-spacing: .04em; }

/* pillars */
.pillar { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: clamp(28px, 6vw, 88px); align-items: center; }
.pillar.flip { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); }
.pillar.flip .pm { order: 2; }
.pm { position: relative; aspect-ratio: 4 / 5; overflow: hidden; background: var(--navy); }
.pm img, .pm .art { width: 100%; height: 100%; object-fit: cover; transition: transform 1.4s var(--ease); }
.pillar:hover .pm img { transform: scale(1.025); }
.pm .tagline { position: absolute; left: 20px; top: 20px; font: 500 11px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); background: rgba(7, 8, 11, .55); padding: 7px 10px; backdrop-filter: blur(6px); }
.pt .h2 { margin: 18px 0 22px; }
.svc { list-style: none; margin: 30px 0 0; padding: 0; border-top: 1px solid var(--line); }
.svc li { border-bottom: 1px solid var(--line); }
.svc a, .svc .soon-row { display: flex; justify-content: space-between; gap: 16px; padding: 15px 0; text-decoration: none; align-items: baseline; }
.svc a:hover .n { color: var(--gold-2); }
.svc .n { font-weight: 600; transition: color .2s; }
.svc .m { font-size: 13px; color: var(--ink-3); white-space: nowrap; }
.svc-soon { margin-top: 18px; font-size: 14px; color: var(--ink-3); }
.svc-soon b { color: var(--ink-2); font-weight: 600; }
.st { font: 600 11px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; padding: 5px 8px; border: 1px solid var(--line-2); color: var(--ink-2); white-space: nowrap; }
.st.live { border-color: rgba(201, 165, 92, .55); color: var(--gold-2); }
.st.soon { color: var(--ink-3); border-style: dashed; }

/* directory */
.dir-tools { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; margin-bottom: 28px; }
.search { position: relative; }
.search input { width: 100%; height: 60px; background: transparent; border: 0; border-bottom: 1px solid var(--line-2); color: var(--ink); font: 400 clamp(22px, 2.4vw, 30px) var(--serif); padding: 0 40px 0 0; }
.search input::placeholder { color: var(--ink-3); }
.search input:focus { outline: none; border-bottom-color: var(--gold); }
.search svg { position: absolute; right: 4px; top: 20px; color: var(--ink-3); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: none; border: 1px solid var(--line); color: var(--ink-2); height: 38px; padding: 0 14px; font: 500 14px var(--sans); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: border-color .2s, color .2s, background .2s; }
.chip:hover { border-color: var(--line-2); color: var(--ink); }
.chip[aria-pressed="true"] { border-color: var(--gold); color: var(--ink); background: rgba(201, 165, 92, .08); }
.chip .c { font-size: 12px; color: var(--ink-3); }
.chip[aria-pressed="true"] .c { color: var(--gold-2); }
.dir-sum { font-size: 14px; color: var(--ink-3); margin: 6px 0 0; }
.dir { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.dir li { border-bottom: 1px solid var(--line); }
.dir .row { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 5fr) 150px 110px; gap: 20px; padding: 20px 0; align-items: center; text-decoration: none; }
.dir a.row:hover .tt { color: var(--gold-2); }
.dir .tt { font: 400 24px/1.15 var(--serif); transition: color .2s; }
.dir .cat { display: block; font: 500 12px var(--sans); color: var(--ink-3); letter-spacing: .1em; text-transform: uppercase; margin-top: 6px; }
.dir .dd { color: var(--ink-2); font-size: 15px; }
.dir .acc { font-size: 13px; color: var(--ink-3); }
.dir .row > :last-child { justify-self: end; }
.dir .soon { opacity: .72; }
.dir-empty { padding: 40px 0; color: var(--ink-2); border-bottom: 1px solid var(--line); }

/* contact */
.contact { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: clamp(28px, 6vw, 88px); align-items: end; }
.contact .big { font: 400 clamp(28px, 4vw, 54px)/1.1 var(--serif); text-decoration: none; border-bottom: 1px solid var(--gold); word-break: break-word; }
.contact .big:hover { color: var(--gold-2); }
.cdl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 14px 24px; font-size: 16px; border-top: 1px solid var(--line); padding-top: 22px; }
.cdl dt { color: var(--ink-3); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; padding-top: 2px; }
.cdl dd { margin: 0; }
.cdl a { text-decoration: none; border-bottom: 1px solid var(--line-2); }
.cdl a:hover { border-color: var(--gold); }

/* footer */
.ftr { border-top: 1px solid var(--line); padding: 64px 0 40px; background: linear-gradient(180deg, var(--bg), var(--bg-2)); }
.ftr .cols { display: grid; grid-template-columns: minmax(0, 4fr) repeat(2, minmax(0, 3fr)); gap: 40px; }
.ftr h2 { font: 600 12px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 16px; }
.ftr ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.ftr a { text-decoration: none; color: var(--ink-2); }
.ftr a:hover { color: var(--ink); }
.ftr .note { color: var(--ink-3); font-size: 14px; max-width: 30em; }
.ftr .legal { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; font-size: 13px; color: var(--ink-3); }
.pv-bar { position: fixed; z-index: 70; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--gold); color: var(--gold-ink); font: 600 13px var(--sans); padding: 10px 16px; letter-spacing: .04em; box-shadow: 0 10px 30px rgba(0, 0, 0, .4); }

/* reveal */
.rv { opacity: 0; transform: translateY(18px); transition: opacity .9s var(--ease), transform .9s var(--ease); }
.rv.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .rv { opacity: 1; transform: none; }
}

/* tablet */
@media (max-width: 1080px) {
  .nav { gap: 18px; } .nav a { font-size: 14px; }
  .dir .row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; }
  .dir .acc { display: none; }
}
@media (max-width: 920px) {
  .nav { display: none; } .menu-btn { display: inline-flex; align-items: center; }
  .blk-head, .feat, .pillar, .pillar.flip, .contact { grid-template-columns: minmax(0, 1fr); }
  .pillar.flip .pm { order: 0; }
  .pm { aspect-ratio: 16 / 11; }
  .feat-stage { min-height: 0; aspect-ratio: 16 / 10; order: -1; }
  .ftr .cols { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .ftr .cols > :first-child { grid-column: 1 / -1; }
}
/* phone */
@media (max-width: 600px) {
  body { font-size: 16px; }
  .brand span { display: none; }
  .hero .wrap { padding-top: 110px; }
  .hero .btn { flex: 1 1 100%; justify-content: center; }
  .scroll-cue { display: none; }
  .feat-list a { grid-template-columns: 30px minmax(0, 1fr) auto; padding: 20px 0; }
  .feat-list a:hover, .feat-list a.on { padding-left: 0; }
  .dir .row { grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; }
  .dir .dd { grid-column: 1 / -1; grid-row: 2; font-size: 14.5px; }
  .dir .row > :last-child { grid-column: 2; grid-row: 1; align-self: start; }
  .cdl { grid-template-columns: minmax(0, 1fr); gap: 4px; } .cdl dd { margin-bottom: 12px; }
  .ftr .cols { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>

const ORDER = { live: 0, beta: 1, soon: 2 }, ACC_ORDER = { public: 0, members: 1, owner: 2 };
function drawDirectory() {
  const box = $('#dir'); if (!box) return;
  const all = live(), hit = all.filter(x => matches(x, view.q)), cats = (C.categories || []).filter(c => all.some(x => x.cat === c.id));

  $('#chips').innerHTML = chip('', 'All', hit.length) + cats.map(c => chip(c.id, c.name, hit.filter(x => x.cat === c.id).length)).join('');
  const shown = hit.filter(x => !view.cat || x.cat === view.cat).sort((a, b) => (ORDER[a.status] - ORDER[b.status]) || (ACC_ORDER[a.access] - ACC_ORDER[b.access]));

function renderContact(s) {

  if (k.office) rows.push(['Office', esc(k.office)]);
  if (k.hours) rows.push(['Hours', esc(k.hours)]);
  (C.social || []).forEach(x => { if (safeUrl(x.url)) rows.push([x.label, '<a href="' + esc(x.url) + '" rel="noopener">' + esc(x.url.replace(/^https:\/\/(www\.)?/, '').replace(/\/$/, '')) + '</a>']); });
  if (!k.email && !rows.length) return '';

const NAV_TYPES = { pillar: 1, directory: 1 };
function renderHeader(secs) {

function renderFooter(secs) {

function render(content) {
  C = content;

  let n = 0;
  secs.forEach(s => {

/* ---------- behaviour ---------- */
let io;
function wire() {
  const hdr = $('#hdr'), onScroll = () => hdr.classList.toggle('solid', window.scrollY > 40); onScroll(); window.onscroll = onScroll;
  const sheet = $('#sheet'), mb = $('#menuBtn');
  const close = () => { sheet.classList.remove('open'); mb.setAttribute('aria-expanded', 'false'); document.body.style.overflow = ''; mb.focus(); };
  mb.onclick = () => { sheet.classList.add('open'); mb.setAttribute('aria-expanded', 'true'); document.body.style.overflow = 'hidden'; setTimeout(() => $('#menuClose').focus(), 50); };
  $('#menuClose').onclick = close;
  sheet.querySelectorAll('nav a').forEach(a => a.addEventListener('click', () => { sheet.classList.remove('open'); mb.setAttribute('aria-expanded', 'false'); document.body.style.overflow = ''; }));
  sheet.onkeydown = e => {
    if (e.key === 'Escape') close();
    if (e.key === 'Tab') { const f = [...sheet.querySelectorAll('a,button')], first = f[0], last = f[f.length - 1]; if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } }
  };
  // featured panel
  document.querySelectorAll('.feat-list a').forEach(a => { const on = () => { document.querySelectorAll('.feat-list a').forEach(x => x.classList.toggle('on', x === a)); document.querySelectorAll('.feat-stage figure').forEach(f => { const m = f.dataset.i === a.dataset.i; f.classList.toggle('on', m); f.setAttribute('aria-hidden', String(!m)); }); }; a.addEventListener('mouseenter', on); a.addEventListener('focus', on); });
  // directory
  const q = $('#q'); if (q) { q.value = view.q; q.oninput = () => { view.q = q.value.trim(); drawDirectory(); }; drawDirectory(); }
  // section highlight in nav
  const navLinks = [...document.querySelectorAll('.nav a')];
  if (io) io.disconnect();
  if ('IntersectionObserver' in window) {
    io = new IntersectionObserver(es => es.forEach(e => {
      if (e.target.classList.contains('rv') && e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
      if (e.target.tagName === 'SECTION' && e.isIntersecting) navLinks.forEach(a => a.setAttribute('aria-current', String(a.getAttribute('href') === '#' + e.target.id)));
    }), { rootMargin: '0px 0px -12% 0px', threshold: .12 });
    document.querySelectorAll('.rv:not(.in), main section').forEach(el => io.observe(el));
  } else document.querySelectorAll('.rv').forEach(el => el.classList.add('in'));

}

const store = { get() { try { return JSON.parse(localStorage.getItem('mret.pub')); } catch (e) { return null; } }, set(v) { try { localStorage.setItem('mret.pub', JSON.stringify(v)); } catch (e) {} } };

  let shown = cached && cached.content ? cached : baked && baked.content ? baked : { no: 0, content: CMSX.clone(CMSX.DEFAULT) };
