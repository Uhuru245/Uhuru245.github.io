<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MRET</title>
<meta name="description" content="Real estate, agent training, tech support and the tools Uhuru Matlhaji builds for agents and families.">
<meta name="theme-color" content="#e9eff6">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Syncopate:wght@700&display=swap">
<style>[hidden] { display: none !important; }
:root {
  --bg: #e9eff6; --bg-2: #dfe7f1;
  --ink: #0e1b2e; --ink-2: #44536a; --ink-3: #78869a;
  --line: rgba(14, 27, 46, .09); --line-2: rgba(14, 27, 46, .16);
  --glass: rgba(255, 255, 255, .52); --glass-2: rgba(255, 255, 255, .72); --edge: rgba(255, 255, 255, .85);
  --blue: #2f6fe4; --blue-2: #6fb6ff; --cyan: #9fe3ff; --blue-ink: #ffffff;
  --grad: linear-gradient(120deg, #2f6fe4 0%, #4f9bff 55%, #8fd6ff 100%);
  --chrome: linear-gradient(180deg, #ffffff 0%, #c9d3df 30%, #8e9aab 48%, #f4f7fb 62%, #a7b3c3 82%, #e8edf3 100%);
  --shadow: 0 1px 0 rgba(255, 255, 255, .9) inset, 0 24px 60px -28px rgba(30, 60, 110, .35), 0 2px 8px rgba(30, 60, 110, .06);
  --r: 24px; --r-s: 16px;
  --display: 'Syncopate', 'Manrope', system-ui, sans-serif; --sans: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --wrap: 1240px; --gut: clamp(16px, 3.4vw, 40px); --ease: cubic-bezier(.2, .7, .2, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { margin: 0; color: var(--ink); font: 400 16.5px/1.6 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; background: var(--bg);
  background-image: radial-gradient(60vw 50vw at 85% -10%, rgba(143, 214, 255, .55), transparent 60%), radial-gradient(55vw 45vw at -10% 30%, rgba(196, 210, 255, .6), transparent 60%), radial-gradient(50vw 40vw at 100% 75%, rgba(170, 225, 255, .45), transparent 60%), linear-gradient(180deg, #f2f6fb 0%, var(--bg) 40%, var(--bg-2) 100%);
  background-attachment: fixed; }
img { display: block; max-width: 100%; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 6px; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 100; background: var(--ink); color: #fff; padding: 10px 14px; font-weight: 700; text-decoration: none; border-radius: 10px; }
.skip:focus { top: 12px; }
.wrap { width: 100%; max-width: var(--wrap); margin: 0 auto; padding: 0 var(--gut); }

/* glass surface */
.glass { position: relative; background: var(--glass); border: 1px solid var(--edge); border-radius: var(--r); box-shadow: var(--shadow); backdrop-filter: blur(22px) saturate(140%); -webkit-backdrop-filter: blur(22px) saturate(140%); }
.glass::before { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(135deg, rgba(255, 255, 255, .7), rgba(255, 255, 255, 0) 38%, rgba(255, 255, 255, 0) 70%, rgba(255, 255, 255, .35)); mix-blend-mode: soft-light; }

.eyebrow { display: inline-flex; align-items: center; gap: 10px; font: 700 11px/1 var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-2); }
.eyebrow::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--grad); box-shadow: 0 0 0 4px rgba(79, 155, 255, .15); }
h1, h2, h3 { font-weight: 700; margin: 0; letter-spacing: -.02em; }
.display, .hero-h { font: 600 clamp(22px, 2.2vw, 30px)/1.25 var(--sans); letter-spacing: -.01em; color: var(--ink); }
.h2 { font: 700 clamp(28px, 3.4vw, 44px)/1.08 var(--sans); letter-spacing: -.025em; text-wrap: balance; }
.lede { color: var(--ink-2); font-size: clamp(15.5px, 1.2vw, 17.5px); max-width: 38em; }
.btn { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 22px; border-radius: 999px; border: 1px solid var(--line-2); background: rgba(255, 255, 255, .6); color: var(--ink); text-decoration: none; font: 700 13px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; transition: transform .25s var(--ease), box-shadow .25s, background .25s, border-color .25s; backdrop-filter: blur(8px); }
.btn:hover { border-color: var(--ink-3); background: #fff; transform: translateY(-1px); }
.btn.gold { background: var(--grad); border-color: transparent; color: var(--blue-ink); box-shadow: 0 10px 24px -10px rgba(47, 111, 228, .65), 0 1px 0 rgba(255, 255, 255, .5) inset; }
.btn.gold:hover { box-shadow: 0 14px 30px -10px rgba(47, 111, 228, .8), 0 1px 0 rgba(255, 255, 255, .5) inset; }
.btn .arr { transition: transform .25s var(--ease); }
.btn:hover .arr { transform: translateX(3px); }
.actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
.pill { display: inline-flex; align-items: center; gap: 9px; height: 32px; padding: 0 14px; border-radius: 999px; background: rgba(255, 255, 255, .7); border: 1px solid var(--edge); font: 700 10.5px/1 var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--ink-2); box-shadow: 0 4px 14px -8px rgba(30, 60, 110, .3); }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: #35c98a; box-shadow: 0 0 0 4px rgba(53, 201, 138, .18); }

/* header */
.hdr { position: fixed; inset: 0 0 auto; z-index: 50; padding-top: 14px; transition: padding .3s var(--ease); }
.hdr .wrap { display: flex; align-items: center; gap: 22px; }
.hdr .bar { display: flex; align-items: center; gap: 22px; width: 100%; height: 64px; padding: 0 12px 0 14px; border-radius: 20px; border: 1px solid transparent; transition: background .35s, border-color .35s, box-shadow .35s; }
.hdr.solid .bar { background: rgba(255, 255, 255, .62); border-color: var(--edge); box-shadow: var(--shadow); backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%); }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; margin-right: auto; min-width: 0; }
.brand .logo { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: linear-gradient(145deg, rgba(255, 255, 255, .95), rgba(214, 228, 245, .7)); border: 1px solid var(--edge); box-shadow: 0 6px 16px -8px rgba(30, 60, 110, .45); flex: none; }
.brand .logo b { font: 700 15px/1 var(--display); background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand > b { font: 700 15px/1 var(--display); letter-spacing: .14em; }
.brand > span { font: 600 10.5px/1.2 var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
.nav { display: flex; gap: 4px; }
.nav a { text-decoration: none; font: 600 13.5px/1 var(--sans); color: var(--ink-2); padding: 10px 12px; border-radius: 999px; transition: color .2s, background .2s; white-space: nowrap; }
.nav a:hover, .nav a[aria-current="true"] { color: var(--ink); background: rgba(255, 255, 255, .8); box-shadow: 0 2px 10px -6px rgba(30, 60, 110, .4); }
.menu-btn { display: none; background: rgba(255, 255, 255, .7); border: 1px solid var(--edge); color: var(--ink); height: 42px; padding: 0 16px; border-radius: 999px; font: 700 12px var(--sans); letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
.sheet { position: fixed; inset: 0; z-index: 60; background: rgba(236, 242, 249, .9); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); display: flex; flex-direction: column; padding: 18px var(--gut) 32px; transform: translateY(-100%); visibility: hidden; transition: transform .45s var(--ease), visibility 0s .45s; }
.sheet.open { transform: none; visibility: visible; transition: transform .45s var(--ease); }
.sheet .top { display: flex; justify-content: space-between; align-items: center; height: 54px; }
.sheet nav { display: flex; flex-direction: column; margin-top: 28px; gap: 8px; }
.sheet nav a { font: 700 22px/1.1 var(--sans); letter-spacing: -.01em; text-decoration: none; padding: 18px 20px; border-radius: 18px; background: var(--glass-2); border: 1px solid var(--edge); display: flex; justify-content: space-between; align-items: center; }
.sheet nav a small { font: 700 11px var(--sans); color: var(--ink-3); letter-spacing: .14em; text-transform: uppercase; }

/* hero */
.hero { padding: 104px 0 0; }
.hero-card { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, .92fr); min-height: min(640px, calc(100svh - 150px)); overflow: hidden; }
.hero-txt { padding: clamp(28px, 4.4vw, 60px); display: flex; flex-direction: column; justify-content: center; position: relative; z-index: 2; }
.mark { font: 700 clamp(54px, 9.6vw, 148px)/.9 var(--display); letter-spacing: .02em; margin: 26px 0 22px; background: var(--chrome); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 1.2px rgba(70, 86, 110, .55); filter: drop-shadow(0 10px 18px rgba(30, 60, 110, .18)); }
.hero-h { max-width: 22em; text-wrap: balance; }
.hero .lede { margin: 14px 0 0; }
.hero-txt .pill { align-self: flex-start; }
.hero-media { position: relative; min-height: 360px; overflow: hidden; border-left: 1px solid rgba(255, 255, 255, .6); }
.hero-media > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; animation: settle 2.2s var(--ease) both; }
.hero-media::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(233, 239, 246, .55), rgba(233, 239, 246, 0) 35%), linear-gradient(0deg, rgba(233, 239, 246, .5), transparent 30%); }
@keyframes settle { from { transform: scale(1.05); opacity: .4; } to { transform: none; opacity: 1; } }
.orbit { position: absolute; right: 22px; bottom: 22px; width: 118px; height: 118px; z-index: 3; border-radius: 50%; background: rgba(255, 255, 255, .35); border: 1px solid var(--edge); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: grid; place-items: center; }
.orbit svg { position: absolute; inset: 0; width: 100%; height: 100%; animation: spin 26s linear infinite; }
.orbit text { font: 700 8.6px var(--sans); letter-spacing: .32em; fill: var(--ink-2); text-transform: uppercase; }
.orbit i { width: 12px; height: 12px; background: var(--grad); transform: rotate(45deg); border-radius: 2px; box-shadow: 0 0 18px rgba(79, 155, 255, .9); }
@keyframes spin { to { transform: rotate(360deg); } }

/* crystal and art (used until a photograph is chosen) */
.crystal { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(70% 60% at 60% 40%, rgba(255, 255, 255, .9), rgba(214, 230, 248, .4) 55%, transparent 80%); }
.crystal svg { width: min(78%, 440px); height: auto; filter: drop-shadow(0 30px 50px rgba(47, 111, 228, .35)); animation: float 7s ease-in-out infinite; }
.crystal .ring { position: absolute; width: min(86%, 500px); aspect-ratio: 1; border-radius: 50%; border: 1px solid rgba(47, 111, 228, .18); }
.crystal .ring.r2 { width: min(62%, 360px); border-style: dashed; border-color: rgba(47, 111, 228, .22); animation: spin 60s linear infinite; }
@keyframes float { 50% { transform: translateY(-12px) rotate(-2deg); } }
.art { position: relative; overflow: hidden; background: radial-gradient(120% 90% at var(--ax, 70%) var(--ay, 20%), #ffffff 0%, #dbe7f5 45%, #c4d4e8 100%); }
.art .crystal { background: none; }
.art .crystal svg { width: min(54%, 300px); }
.art::after { content: ''; position: absolute; inset: 0; background: radial-gradient(50% 40% at var(--ax, 70%) var(--ay, 20%), rgba(143, 214, 255, .55), transparent 70%); }

/* stats strip */
.stats { margin-top: 18px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) minmax(0, 1.4fr); }
.stat { padding: 24px 26px; display: grid; gap: 4px; align-content: start; }
.stat + .stat { border-left: 1px solid var(--line); }
.stat .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: rgba(255, 255, 255, .8); border: 1px solid var(--edge); color: var(--blue); margin-bottom: 10px; }
.stat b { font: 700 clamp(28px, 2.8vw, 38px)/1 var(--sans); letter-spacing: -.03em; }
.stat span { font-size: 13px; color: var(--ink-3); font-weight: 600; }
.stat.quote { font-size: 14.5px; color: var(--ink-2); align-content: center; line-height: 1.55; }
.stat.quote small { display: block; margin-top: 8px; font: 700 11px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); }

/* sections */
section.blk { padding: clamp(18px, 2vw, 22px) 0; position: relative; }
section.blk:first-child { padding-top: 22px; }
.panel { padding: clamp(24px, 3.6vw, 48px); }
.blk-head { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 18px clamp(24px, 5vw, 72px); align-items: end; margin-bottom: clamp(24px, 3.4vw, 40px); }
.blk-head .h2 { margin-top: 14px; }
.blk-head .lede { margin: 0; }

/* featured: case cards */
.cases { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 228px), 1fr)); gap: 16px; }
.case { display: flex; flex-direction: column; height: 100%; text-decoration: none; padding: 12px 12px 18px; border-radius: 20px; background: rgba(255, 255, 255, .6); border: 1px solid var(--edge); box-shadow: 0 14px 34px -24px rgba(30, 60, 110, .5); transition: transform .35s var(--ease), box-shadow .35s, background .35s; }
.case:hover { transform: translateY(-4px); background: rgba(255, 255, 255, .85); box-shadow: 0 26px 50px -26px rgba(30, 60, 110, .6); }
.case .shot { position: relative; aspect-ratio: 16 / 10; border-radius: 14px; overflow: hidden; background: #cfdcec; }
.case .shot img, .case .shot .art { width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s var(--ease); }
.case:hover .shot img { transform: scale(1.04); }
.case .num { position: absolute; left: 10px; top: 10px; z-index: 2; font: 700 11px/1 var(--sans); letter-spacing: .1em; padding: 6px 8px; border-radius: 8px; background: rgba(255, 255, 255, .78); backdrop-filter: blur(6px); color: var(--ink); }
.case .t { font: 700 18px/1.2 var(--sans); letter-spacing: -.01em; margin: 16px 6px 6px; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.case .t .arr { color: var(--blue); flex: none; transition: transform .3s var(--ease); }
.case:hover .t .arr { transform: translateX(3px); }
.case .d { color: var(--ink-2); font-size: 14px; margin: 0 6px; flex: 1; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 6px 0; }
.tag { font: 700 10.5px/1 var(--sans); letter-spacing: .06em; padding: 7px 10px; border-radius: 999px; background: rgba(255, 255, 255, .8); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }

/* pillars */
.pillar { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: clamp(22px, 4vw, 56px); align-items: center; padding: clamp(14px, 1.6vw, 18px); }
.pillar.flip { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); }
.pillar.flip .pm { order: 2; }
.pm { position: relative; aspect-ratio: 5 / 4; overflow: hidden; border-radius: 18px; background: #cfdcec; }
.pm img, .pm .art { width: 100%; height: 100%; object-fit: cover; transition: transform 1.4s var(--ease); }
.pillar:hover .pm img { transform: scale(1.025); }
.pt { padding: clamp(10px, 2vw, 28px) clamp(10px, 2vw, 28px) clamp(10px, 2vw, 28px) 0; }
.pillar.flip .pt { padding-left: clamp(10px, 2vw, 28px); padding-right: 0; }
.pt .h2 { margin: 14px 0 14px; }
.svc { list-style: none; margin: 24px 0 0; padding: 0; display: grid; gap: 8px; }
.svc a { display: flex; justify-content: space-between; gap: 16px; padding: 14px 16px; text-decoration: none; align-items: center; border-radius: 14px; background: rgba(255, 255, 255, .62); border: 1px solid var(--edge); transition: background .2s, transform .25s var(--ease); }
.svc a:hover { background: #fff; transform: translateX(3px); }
.svc .n { font-weight: 700; font-size: 15px; }
.svc .m { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; font-weight: 600; }
.svc-soon { margin-top: 16px; font-size: 14px; color: var(--ink-3); }
.svc-soon b { color: var(--ink-2); font-weight: 700; }
.st { font: 700 10px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; padding: 6px 9px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--ink-2); white-space: nowrap; background: rgba(255, 255, 255, .7); }
.st.live { border-color: rgba(53, 201, 138, .45); color: #13865a; background: rgba(53, 201, 138, .1); }
.st.beta { border-color: rgba(47, 111, 228, .35); color: var(--blue); background: rgba(47, 111, 228, .08); }
.st.soon { color: var(--ink-3); border-style: dashed; }

/* directory */
.dir-tools { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; margin-bottom: 20px; }
.search { position: relative; }
.search input { width: 100%; height: 56px; border-radius: 999px; background: rgba(255, 255, 255, .75); border: 1px solid var(--edge); box-shadow: 0 8px 22px -16px rgba(30, 60, 110, .5) inset, 0 1px 0 #fff; color: var(--ink); font: 600 16px var(--sans); padding: 0 54px 0 22px; }
.search input::placeholder { color: var(--ink-3); font-weight: 500; }
.search input:focus { outline: none; border-color: var(--blue-2); box-shadow: 0 0 0 4px rgba(111, 182, 255, .25); }
.search svg { position: absolute; right: 20px; top: 17px; color: var(--ink-3); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: rgba(255, 255, 255, .6); border: 1px solid var(--edge); color: var(--ink-2); height: 38px; padding: 0 15px; border-radius: 999px; font: 700 13px var(--sans); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: background .2s, color .2s, box-shadow .2s; }
.chip:hover { background: #fff; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; box-shadow: 0 8px 18px -10px rgba(14, 27, 46, .6); }
.chip .c { font-size: 11.5px; color: var(--ink-3); }
.chip[aria-pressed="true"] .c { color: var(--cyan); }
.dir-sum { font-size: 13.5px; color: var(--ink-3); margin: 4px 0 0; font-weight: 600; }
.dir { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.dir .row { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 5fr) 150px 110px; gap: 20px; padding: 16px 20px; align-items: center; text-decoration: none; border-radius: 16px; background: rgba(255, 255, 255, .58); border: 1px solid var(--edge); transition: background .2s, transform .25s var(--ease); }
.dir a.row:hover { background: #fff; transform: translateY(-1px); }
.dir .tt { font: 700 16.5px/1.25 var(--sans); }
.dir .cat { display: block; font: 700 10.5px var(--sans); color: var(--ink-3); letter-spacing: .14em; text-transform: uppercase; margin-top: 5px; }
.dir .dd { color: var(--ink-2); font-size: 14px; }
.dir .acc { font-size: 12.5px; color: var(--ink-3); font-weight: 600; }
.dir .row > :last-child { justify-self: end; }
.dir .soon { opacity: .7; }
.dir-empty { padding: 30px 20px; color: var(--ink-2); border-radius: 16px; background: rgba(255, 255, 255, .5); }

/* contact */
.contact { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: clamp(22px, 4vw, 56px); align-items: center; overflow: hidden; }
.contact .h2 { text-transform: uppercase; letter-spacing: .01em; font-size: clamp(28px, 3.2vw, 42px); line-height: 1.05; }
.contact .big { display: inline-block; margin-top: 4px; font: 700 clamp(17px, 1.8vw, 22px)/1.3 var(--sans); text-decoration: none; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; word-break: break-word; }
.cbox { position: relative; padding: 22px 24px; border-radius: 20px; background: rgba(255, 255, 255, .62); border: 1px solid var(--edge); }
.cbox h3 { font: 700 11px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 14px; }
.cdl { margin: 0; display: grid; gap: 12px; list-style: none; padding: 0; }
.cdl li { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; align-items: center; font-size: 15px; }
.cdl .ic { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: #fff; border: 1px solid var(--line); color: var(--blue); }
.cdl small { display: block; font: 700 10px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); }
.cdl a { text-decoration: none; font-weight: 600; word-break: break-word; }
.cdl a:hover { color: var(--blue); }
.contact .gem { position: absolute; right: -40px; bottom: -60px; width: 260px; opacity: .55; pointer-events: none; }

/* footer */
.ftr { padding: 22px 0 28px; }
.ftr .panel { padding: clamp(24px, 3vw, 36px); }
.ftr .cols { display: grid; grid-template-columns: minmax(0, 4fr) repeat(2, minmax(0, 3fr)); gap: 32px; }
.ftr h2 { font: 700 11px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 14px; }
.ftr ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.ftr a { text-decoration: none; color: var(--ink-2); font-weight: 600; font-size: 14.5px; }
.ftr a:hover { color: var(--blue); }
.ftr .brand { margin: 0 0 12px; }
.ftr .note { color: var(--ink-3); font-size: 14px; max-width: 30em; }
.ftr .legal { margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; font-size: 12.5px; color: var(--ink-3); }
