<style>[hidden] { display: none !important; }
:root {
  --bg: #f6f6f4; --card: #fff; --ink: #1d1f22; --ink-2: #4b4f56; --ink-3: #80858d; --line: #e4e4e0; --line-2: #d2d2cc;
  --char: #1f2125; --char-2: #2b2e33; --red: #b3121d; --red-2: #d61f2c; --red-bg: #fbeaea; --ok: #1d6b45; --ok-bg: #e5f2ea; --warn: #8a5a00; --warn-bg: #fbf0d9; --blue: #24507a; --blue-bg: #e8f0f8;
  --r: 10px; --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; --race: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; line-height: 1.2; letter-spacing: -.01em; }
h1 { font: 700 26px/1.1 var(--race); letter-spacing: .01em; text-transform: uppercase; }
h2 { font-size: 17px; } h3 { font-size: 15px; }
a { color: var(--red); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--red-2); outline-offset: 2px; border-radius: 4px; }
.muted { color: var(--ink-3); } .small { font-size: 13px; } .num { font-variant-numeric: tabular-nums; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line-2); background: #fff; font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn.red { background: var(--red); border-color: var(--red); color: #fff; } .btn.red:hover { background: var(--red-2); }
.btn.dark { background: var(--char); border-color: var(--char); color: #fff; }
.btn.sm { min-height: 32px; padding: 0 11px; font-size: 13px; }
.btn.big { min-height: 54px; font: 700 18px var(--race); letter-spacing: .06em; text-transform: uppercase; width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.link { border: 0; background: none; color: var(--red); padding: 0; min-height: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; margin-bottom: 14px; }
.card > h2 { margin-bottom: 10px; }
.row { display: flex; align-items: center; gap: 10px; }
.grid { display: grid; gap: 12px; } .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.kpi .l { font-size: 12px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.kpi .v { font: 700 30px/1.1 var(--race); margin-top: 4px; }
.kpi .s { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; padding: 3px 8px; border-radius: 99px; background: #eee; color: var(--ink-2); white-space: nowrap; text-transform: uppercase; letter-spacing: .04em; }
.tag.not_started { background: #eef0f2; } .tag.in_progress { background: var(--blue-bg); color: var(--blue); } .tag.submitted { background: var(--warn-bg); color: var(--warn); }
.tag.needs_improvement, .tag.overdue { background: var(--red-bg); color: var(--red); } .tag.verified { background: var(--ok-bg); color: var(--ok); } .tag.locked { background: #f1f1ee; color: var(--ink-3); }
.alert { border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; font-size: 14px; }
.alert.ok { background: var(--ok-bg); color: var(--ok); } .alert.bad { background: var(--red-bg); color: var(--red); } .alert.warn { background: var(--warn-bg); color: var(--warn); } .alert.info { background: var(--blue-bg); color: var(--blue); }
label.f { display: grid; gap: 5px; font-weight: 600; font-size: 13.5px; }
label.f .hint { font-weight: 400; color: var(--ink-3); font-size: 12.5px; }
input[type=text], input[type=email], input[type=password], input[type=tel], input[type=date], input[type=number], input[type=url], select, textarea { width: 100%; min-height: 44px; border: 1px solid var(--line-2); border-radius: 8px; padding: 9px 12px; background: #fff; font-weight: 400; }
textarea { min-height: 96px; resize: vertical; }
.check { display: flex; gap: 10px; align-items: flex-start; font-weight: 500; cursor: pointer; }
.check input { width: 20px; height: 20px; margin-top: 1px; accent-color: var(--red); flex: none; }
.form { display: grid; gap: 14px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 700; }
tr.click { cursor: pointer; } tr.click:hover td { background: #fafaf8; }
.tablebox { overflow-x: auto; }
.empty { padding: 26px; text-align: center; color: var(--ink-3); }

/* sign-in */
.auth { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.auth-side { background: var(--char); color: #fff; padding: 48px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
.auth-side::after { content: ''; position: absolute; right: -60px; bottom: -60px; width: 320px; height: 320px; background: repeating-conic-gradient(rgba(255,255,255,.06) 0 25%, transparent 0 50%) 0 0 / 40px 40px; transform: rotate(12deg); opacity: .8; }
.brand { font: 800 30px/1 var(--race); letter-spacing: .03em; text-transform: uppercase; }
.brand i { color: var(--red-2); font-style: normal; }
.tagline { font: 600 22px/1.25 var(--race); text-transform: uppercase; letter-spacing: .05em; color: #d8d8d4; max-width: 18ch; }
.auth-main { display: grid; place-items: center; padding: 32px 18px; }
.auth-box { width: 100%; max-width: 400px; }
.auth-box h1 { margin-bottom: 6px; }
.tabs { display: flex; gap: 18px; border-bottom: 1px solid var(--line); margin: 18px 0; }
.tabs button { background: none; border: 0; padding: 10px 0; font-weight: 600; color: var(--ink-3); border-bottom: 3px solid transparent; cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--red); }

/* shell */
.top { position: sticky; top: 0; z-index: 30; background: var(--char); color: #fff; display: flex; align-items: center; gap: 14px; padding: 0 18px; height: 58px; }
.top .brand { font-size: 22px; margin-right: auto; color: #fff; text-decoration: none; }
.top .bell { position: relative; background: none; border: 0; color: #fff; cursor: pointer; padding: 6px; }
.top .bell b { position: absolute; top: 0; right: -2px; background: var(--red-2); color: #fff; font-size: 10.5px; min-width: 17px; height: 17px; border-radius: 9px; display: grid; place-items: center; }
.top .who { font-size: 13px; color: #c9c9c4; }
.shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: calc(100vh - 58px); }
.side { background: #fff; border-right: 1px solid var(--line); padding: 14px 10px; }
.side button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-weight: 500; color: var(--ink-2); }
.side button[aria-current="page"] { background: var(--red-bg); color: var(--red); font-weight: 700; }
.side .sep { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-3); padding: 16px 12px 6px; font-weight: 700; }
.main { padding: 22px clamp(14px, 3vw, 34px) 100px; max-width: 1180px; width: 100%; }
.ph { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.ph p { margin: 4px 0 0; color: var(--ink-2); }
.bottom { display: none; }

/* agent dashboard */
.hero { background: var(--char); color: #fff; border-radius: 14px; padding: 22px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 22px; align-items: center; position: relative; overflow: hidden; margin-bottom: 14px; }
.hero::after { content: ''; position: absolute; right: -40px; top: -40px; width: 200px; height: 200px; background: repeating-conic-gradient(rgba(255,255,255,.05) 0 25%, transparent 0 50%) 0 0 / 28px 28px; transform: rotate(14deg); }
.hero h1 { color: #fff; font-size: 30px; }
.hero .lvl { display: inline-flex; gap: 8px; align-items: center; margin-top: 8px; font-size: 13px; color: #d8d8d4; }
.hero .lvl b { background: var(--red); color: #fff; padding: 3px 9px; border-radius: 99px; font: 700 12px var(--sans); letter-spacing: .06em; text-transform: uppercase; }
.ring { width: 118px; height: 118px; position: relative; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .c { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ring .c b { font: 800 30px/1 var(--race); display: block; }
.ring .c span { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #c9c9c4; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.next { border: 2px solid var(--red); border-radius: 14px; background: #fff; padding: 18px; margin-bottom: 14px; }
.next .k { font: 700 13px var(--race); color: var(--red); letter-spacing: .14em; text-transform: uppercase; }
.next h2 { font-size: 20px; margin: 4px 0 6px; }
/* milestone path */
.path { list-style: none; margin: 0; padding: 0; position: relative; }
.path::before { content: ''; position: absolute; left: 19px; top: 18px; bottom: 18px; width: 3px; background: repeating-linear-gradient(var(--line-2) 0 8px, transparent 8px 14px); }
.path li { position: relative; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; cursor: pointer; }
.path .dot { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font: 800 16px var(--race); background: #fff; border: 3px solid var(--line-2); color: var(--ink-3); z-index: 1; }
.path li.verified .dot { background: var(--ok); border-color: var(--ok); color: #fff; }
.path li.submitted .dot { background: #fff; border-color: var(--warn); color: var(--warn); }
.path li.in_progress .dot, .path li.needs_improvement .dot, .path li.overdue .dot { border-color: var(--red); color: var(--red); }
.path li.locked { cursor: default; opacity: .62; }
.path .t { font-weight: 700; } .path .d { font-size: 12.5px; color: var(--ink-3); }
.badges { display: flex; flex-wrap: wrap; gap: 10px; }
.badge { display: flex; gap: 10px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 200px; flex: 1 1 200px; }
.badge .ic { width: 40px; height: 40px; border-radius: 50%; background: var(--char); color: #fff; display: grid; place-items: center; font: 800 15px var(--race); flex: none; }
.badge.off { opacity: .45; } .badge.off .ic { background: var(--line-2); }
.bar { height: 8px; background: #eceae4; border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--red); border-radius: 99px; }
/* challenge */
.steps { margin: 0; padding-left: 20px; } .steps li { margin: 4px 0; }
.lesson { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; background: #fff; }
.lesson summary { padding: 12px 14px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; align-items: center; font-weight: 600; list-style: none; }
.lesson summary::-webkit-details-marker { display: none; }
.lesson .in { padding: 0 14px 14px; }
.q { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
.q .opts { display: grid; gap: 6px; margin-top: 8px; }
.q.right { border-color: var(--ok); } .q.wrong { border-color: var(--red); }
/* leaderboard */
.seg { display: inline-flex; background: #ecebe6; border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.lb { list-style: none; margin: 0; padding: 0; }
.lb li { display: grid; grid-template-columns: 48px 42px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 6px; border-bottom: 1px solid var(--line); cursor: pointer; }
.lb li.me { background: var(--red-bg); border-radius: 8px; }
.lb .rk { font: 800 24px var(--race); text-align: center; }
.lb li:nth-child(1) .rk { color: var(--red); }
.av { width: 42px; height: 42px; border-radius: 50%; background: var(--char); color: #fff; display: grid; place-items: center; font-weight: 700; overflow: hidden; }
.av img { width: 100%; height: 100%; object-fit: cover; }
.lb .xp { font: 800 22px var(--race); text-align: right; }
.podium { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
dialog { border: 0; border-radius: 14px; padding: 0; width: min(640px, calc(100vw - 20px)); max-height: calc(100vh - 30px); box-shadow: 0 30px 80px rgba(0,0,0,.3); }
dialog::backdrop { background: rgba(20, 20, 22, .55); }
dialog .dh { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; z-index: 2; }
dialog .db { padding: 18px; } dialog .df { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: #fff; }
.toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--char); color: #fff; padding: 11px 16px; border-radius: 10px; z-index: 90; font-size: 14px; max-width: calc(100vw - 30px); box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; } .filters select, .filters input { width: auto; min-height: 38px; }
.trail { list-style: none; margin: 0; padding: 0; } .trail li { padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; } .trail b { display: inline-block; min-width: 120px; }
@media print { .top, .side, .bottom, .no-print { display: none !important; } .shell { display: block; } .main { padding: 0; } }
@media (max-width: 900px) {
  .auth { grid-template-columns: minmax(0, 1fr); } .auth-side { padding: 26px 20px; min-height: 0; } .auth-side .tagline { margin-top: 10px; } .auth-side::after { width: 160px; height: 160px; }
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .bottom { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: #fff; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .bottom button { background: none; border: 0; padding: 8px 2px 9px; display: grid; justify-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--ink-3); cursor: pointer; }
  .bottom button svg { width: 22px; height: 22px; }
  .bottom button[aria-current="page"] { color: var(--red); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3, .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hero { grid-template-columns: minmax(0, 1fr); } .ring { margin: 0 auto; }
  .lb li { grid-template-columns: 36px 38px minmax(0, 1fr) auto; gap: 8px; }
  .top .who { display: none; }
}
@media (max-width: 520px) { .g2 { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<body>
<div id="app"><noscript><p style="padding:24px">KW Edge Tech Race needs JavaScript.</p></noscript></div>
<dialog id="dlg" aria-labelledby="dlgT"><div class="dh"><h2 id="dlgT"></h2><button class="btn sm" id="dlgX" aria-label="Close">Close</button></div><div class="db" id="dlgB"></div><div class="df" id="dlgF"></div></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script>'use strict';
/* KW EDGE TECH RACE · Your Tech. Your Growth. Your Race.
 * Every permission is checked by the server; this page only shows what the signed-in role may use. */
const API = 'https://script.google.com/macros/s/AKfycbwAl-VwvhZy4Xypi4VYfplZOOi4Sbu5tJXkmmvEsj9gqsvMwqLLPx-L1zVolXlVzyuXyg/exec';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} } };
const S = { token: store.get('tr.token'), me: null, data: null, view: 'home', arg: null, board: 'week', ov: null, filters: {} };
const STATUS = { not_started: 'Not started', in_progress: 'In progress', submitted: 'Submitted', needs_improvement: 'Needs improvement', verified: 'Verified', overdue: 'Overdue', locked: 'Opens later' };
const has = r => S.me && S.me.roles.includes(r);
const isAdmin = () => has('mctt') || has('platform');
const isAgent = () => has('agent');
async function api(a, x) {
  let j;
  try { const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ a, token: S.token }, x || {})) }); j = await r.json(); }
  catch (e) { throw new Error('Could not reach the Tech Race. Check your connection and try again.'); }
  if (j.error === 'signin') { signOut('Your session ended. Please sign in again.'); const e = new Error('Please sign in again.'); e.code = 'signin'; throw e; }
  if (!j.ok) { const e = new Error(j.message || 'Something went wrong.'); e.code = j.error; throw e; }
  return j;
}
let toastT; function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 4000); }
const fmtD = d => d ? new Date(d.length === 10 ? d + 'T12:00:00+02:00' : d).toLocaleDateString('en-ZA', { day: 'numeric', month: 'short', timeZone: 'Africa/Johannesburg' }) : '';
const fmtDT = d => d ? new Date(d).toLocaleString('en-ZA', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Africa/Johannesburg' }) : '';
const initials = n => String(n || '?').split(/\s+/).map(x => x[0]).slice(0, 2).join('').toUpperCase();
const tag = st => '<span class="tag ' + st + '">' + esc(STATUS[st] || st) + '</span>';
const empty = m => '<div class="empty">' + esc(m) + '</div>';
const ICON = {
  home: '<path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>', learn: '<path d="M4 5h7a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5h-5a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h5z"/>',
  race: '<path d="M5 21V4M5 4h12l-2 4 2 4H5"/>', book: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>', me: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>'
};
const svg = k => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[k] + '</svg>';

/* ---------- sign-in, invitation, verification, reset ---------- */
function authShell(inner) {
  $('app').innerHTML = '<div class="auth"><div class="auth-side"><div><div class="brand">KW Edge <i>Tech Race</i></div><div class="tagline" style="margin-top:26px">Your Tech. Your Growth. Your Race.</div></div><p class="small" style="color:#a9a9a4;max-width:36ch;position:relative;z-index:1">Technology onboarding and development for Keller Williams Edge agents, run by your Market Centre Technology Trainer.</p></div><div class="auth-main"><div class="auth-box">' + inner + '</div></div></div>';
}
function showAuth(mode, msg, kind) {
  mode = mode || 'signin';
  const tabs = '<div class="tabs" role="tablist"><button role="tab" data-mode="signin" aria-selected="' + (mode === 'signin') + '">Sign in</button><button role="tab" data-mode="request" aria-selected="' + (mode === 'request') + '">Request access</button></div>';
  const m = msg ? '<div class="alert ' + (kind || 'info') + '" role="status">' + esc(msg) + '</div>' : '';
  let body = '';
  if (mode === 'signin') body = '<form class="form" id="fAuth"><label class="f">Email<input type="email" id="aEmail" autocomplete="email" required></label><label class="f">Password<input type="password" id="aPw" autocomplete="current-password" required></label><button class="btn red big">Start your engine</button><button type="button" class="btn link" id="aForgot">Forgot your password?</button></form>';

    $('asGo').onclick = async () => { try { await api('trAssign', { op: 'assign', user, challenge: $('asC').value, start: $('asS').value, due: $('asD').value, remedial: $('asR').checked, note: $('asN').value }); $('dlg').close(); toast('Assigned and the agent notified.'); render(); } catch (e) { $('asErr').hidden = false; $('asErr').textContent = e.message; } };

function datesDlg(id) {
  dlg('Change dates', '<form class="form"><label class="f">New due date (extend the deadline)<input type="date" id="dD"></label><label class="f">Reason or note<input type="text" id="dN" maxlength="300"></label><p class="small muted">Or move when it opens (changes the order):</p><label class="f">New opening date<input type="date" id="dS"></label><p class="alert bad" id="dErr" hidden></p></form>', '<button class="btn" data-close>Cancel</button><button class="btn red" id="dGo">Save</button>', () => {
    $('dGo').onclick = async () => { try { if ($('dS').value) await api('trAssign', { op: 'reschedule', id, start: $('dS').value }); if ($('dD').value) await api('trAssign', { op: 'extend', id, due: $('dD').value, note: $('dN').value }); $('dlg').close(); toast('Dates updated. Nothing was reset.'); render(); } catch (e) { $('dErr').hidden = false; $('dErr').textContent = e.message; } };
  });
}
function adjustDlg(user) {
  dlg('Adjust points', '<form class="form"><label class="f">Points <span class="hint">negative to deduct, up to 500</span><input type="number" id="adP" step="1"></label><label class="f">Documented reason<textarea id="adR" maxlength="300"></textarea></label><p class="small muted">A platform administrator must approve every manual adjustment before it counts.</p><p class="alert bad" id="adErr" hidden></p></form>', '<button class="btn" data-close>Cancel</button><button class="btn red" id="adGo">Request adjustment</button>', () => {
    $('adGo').onclick = async () => { try { await api('trAdjust', { user, points: +$('adP').value, reason: $('adR').value }); $('dlg').close(); toast('Adjustment sent for approval.'); } catch (e) { $('adErr').hidden = false; $('adErr').textContent = e.message; } };

VIEWS.reviews = async () => {
  const q = await api('trQueue'); S.queue = q.items;
  return '<div class="ph"><div><h1>Reviews</h1><p>' + q.items.length + ' submission' + (q.items.length === 1 ? '' : 's') + ' waiting, oldest first.</p></div></div>' + (q.items.length ? q.items.map((s, i) => '<div class="card"><div class="row" style="justify-content:space-between;flex-wrap:wrap"><div><h2>' + esc(s.challenge.title) + '</h2><div class="small muted">' + esc(s.agent.name) + ' · ' + fmtDT(s.created_at) + (s.late ? ' · <b style="color:var(--red)">late</b>' : ' · on time') + ' · knowledge check ' + (s.check_passed ? 'passed (' + s.check_score + '%)' : 'not passed') + ' · ' + s.activities_done + '/' + s.challenge.activities.length + ' activities ticked</div></div>' + (s.demo ? '<span class="tag submitted">live demo requested</span>' : '') + '</div>'
    + '<p class="small"><b>Asked for:</b> ' + esc(s.challenge.evidence) + '</p>' + (s.text ? '<div class="alert info" style="white-space:pre-wrap">' + esc(s.text) + '</div>' : '') + (s.link ? '<p><a href="' + esc(s.link) + '" target="_blank" rel="noopener noreferrer">' + esc(s.link) + '</a></p>' : '') + (s.file ? '<button class="btn sm" data-file="' + s.id + '">Open ' + esc(s.file.name) + '</button>' : '')
    + (s.history.length ? '<p class="small muted">Earlier: ' + s.history.map(h => esc(h.decision.replace('_', ' ')) + ' (' + fmtD(h.at) + ')').join(', ') + '</p>' : '')
    + '<div class="form" style="margin-top:12px"><label class="f">Feedback to the agent<textarea id="fb' + i + '" maxlength="2000"></textarea></label><label class="f">Competency<select id="cp' + i + '"><option value="competent">Competent</option><option value="advanced">Advanced</option><option value="developing">Developing</option><option value="not_yet">Not yet</option></select></label><div class="row" style="flex-wrap:wrap"><button class="btn red" data-rv="' + i + '" data-dec="verified">Verify competency</button><button class="btn" data-rv="' + i + '" data-dec="needs_improvement">Needs improvement</button></div></div></div>').join('') : '<div class="card">' + empty('Nothing to review. Well done.') + '</div>');
};
VIEWS.reviews.after = () => {
  document.querySelectorAll('[data-file]').forEach(b => b.onclick = () => openFile(b.dataset.file));
  document.querySelectorAll('[data-rv]').forEach(b => b.onclick = async () => { const i = +b.dataset.rv, s = S.queue[i]; b.disabled = true; try { const j = await api('trReview', { submission: s.id, decision: b.dataset.dec, feedback: $('fb' + i).value, competency: $('cp' + i).value }); toast(b.dataset.dec === 'verified' ? 'Verified. ' + s.agent.name + ' earned ' + j.xp + ' XP' + (j.badges.length ? ' and the ' + j.badges.join(', ') + ' badge' : '') + '.' : 'Changes requested.'); render(); } catch (e) { toast(e.message); b.disabled = false; } });
};
VIEWS.challenges = async () => {
  const o = S.ov || await getOv();
  return '<div class="ph"><div><h1>Challenges</h1><p>The six-week journey and the ongoing weekly race. Assign a challenge from an agent\'s record, or to several agents here.</p></div></div><div class="card"><div class="tablebox"><table><thead><tr><th>Week</th><th>Challenge</th><th>Difficulty</th><th>Points</th><th></th></tr></thead><tbody>' + o.challenges.map(c => '<tr><td>' + (c.week || 'race') + '</td><td><b>' + esc(c.title) + '</b></td><td>' + esc(c.difficulty) + '</td><td>' + c.points + '</td><td><button class="btn sm" data-bulk="' + c.id + '">Assign to agents</button></td></tr>').join('') + '</tbody></table></div><p class="small muted">Edit wording, activities and knowledge checks under Learning content.</p></div>';
};
VIEWS.challenges.after = () => document.querySelectorAll('[data-bulk]').forEach(b => b.onclick = () => {
  const ag = S.ov.agents.filter(a => a.status === 'active'), today = new Date().toLocaleDateString('en-CA', { timeZone: 'Africa/Johannesburg' });
  dlg('Assign to agents', '<form class="form"><div class="grid g2"><label class="f">Opens<input type="date" id="bS" value="' + today + '"></label><label class="f">Due <span class="hint">empty = 7 days</span><input type="date" id="bD"></label></div><div style="max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:10px">' + ag.map(a => '<label class="check"><input type="checkbox" value="' + a.id + '" name="bA"> ' + esc(a.name) + '</label>').join('') + '</div><p class="alert bad" id="bErr" hidden></p></form>', '<button class="btn" data-close>Cancel</button><button class="btn red" id="bGo">Assign</button>', () => {
    $('bGo').onclick = async () => { const ids = [...document.querySelectorAll('input[name="bA"]:checked')].map(x => x.value); if (!ids.length) return; let n = 0, errs = []; for (const id of ids) { try { await api('trAssign', { op: 'assign', user: id, challenge: b.dataset.bulk, start: $('bS').value, due: $('bD').value }); n++; } catch (e) { errs.push(e.message); } } $('dlg').close(); toast(n + ' assigned' + (errs.length ? '; ' + errs.length + ' skipped (' + errs[0] + ')' : '')); };
  });
});
VIEWS.content = async () => {
  const c = await api('trContent'); S.content = c;
  const lessonRow = l => '<tr><td>' + esc(l.title) + '<div class="small muted">' + esc((c.modules.find(m => m.id === l.module_id) || {}).title || '') + '</div></td><td class="small">' + (l.updated_at ? fmtD(l.updated_at) : '') + '</td><td><button class="btn sm" data-edit="lessons:' + l.id + '">Edit</button></td></tr>';
  return '<div class="ph"><div><h1>Learning content</h1><p>Update instructions when MAPP, Loom or Command change. Edits apply immediately; nobody\'s progress is lost.</p></div><div class="row"><button class="btn" data-new="lessons">New lesson</button><button class="btn" data-new="challenges">New challenge</button><button class="btn" data-new="questions">New question</button></div></div>'
    + '<div class="card"><h2>Challenges</h2><table><tbody>' + c.challenges.map(x => '<tr><td>' + esc(x.title) + '</td><td>' + (x.week || 'race') + '</td><td><button class="btn sm" data-edit="challenges:' + x.id + '">Edit</button></td></tr>').join('') + '</tbody></table></div>'
    + '<div class="card"><h2>Knowledge check questions</h2><table><tbody>' + c.questions.map(q => '<tr><td>' + esc(q.question) + '<div class="small muted">' + esc(q.challenge_id) + '</div></td><td><button class="btn sm" data-edit="questions:' + q.id + '">Edit</button></td></tr>').join('') + '</tbody></table></div>'
    + '<div class="card"><h2>Lessons</h2><div class="tablebox"><table><thead><tr><th>Lesson</th><th>Updated</th><th></th></tr></thead><tbody>' + c.lessons.slice().sort((a, b) => a.order - b.order).map(lessonRow).join('') + '</tbody></table></div></div>';
};
const FORMS = {
  lessons: [['id', 'Short id', 'text'], ['module_id', 'Module', 'module'], ['title', 'Title', 'text'], ['summary', 'Summary', 'area'], ['steps', 'Steps, one per line', 'lines'], ['order', 'Order', 'num']],
  challenges: [['id', 'Short id', 'text'], ['title', 'Title', 'text'], ['week', 'Onboarding week (empty = ongoing race)', 'num'], ['track_id', 'Track', 'track'], ['difficulty', 'Difficulty (core or advanced)', 'text'], ['points', 'Verification points', 'num'], ['required', 'Required for onboarding (1 or 0)', 'num'], ['badge_id', 'Badge id (optional)', 'text'], ['objective', 'Learning objective', 'area'], ['activities', 'Required activities, one per line', 'lines'], ['assignment', 'Practical assignment', 'area'], ['evidence', 'Evidence required', 'area'], ['lessons', 'Lesson ids, comma separated', 'text'], ['resources', 'Learning resources, one per line', 'lines'], ['active', 'Active (1 or 0)', 'num']],
  questions: [['id', 'Short id', 'text'], ['challenge_id', 'Challenge id', 'text'], ['question', 'Question', 'area'], ['options', 'Answer options, one per line', 'lines'], ['answer', 'Number of the correct option (first = 0)', 'num'], ['explanation', 'Explanation shown after answering', 'area']]
};
function editDlg(table, rec) {
  const c = S.content, isNew = !rec; rec = rec || {};
  const field = ([k, l, t]) => { const v = rec[k] == null ? '' : rec[k]; if (t === 'module') return '<label class="f">' + l + '<select id="ed_' + k + '">' + c.modules.map(m => '<option value="' + m.id + '"' + (m.id === v ? ' selected' : '') + '>' + esc(m.title) + '</option>').join('') + '</select></label>'; if (t === 'track') return '<label class="f">' + l + '<select id="ed_' + k + '">' + c.tracks.map(m => '<option value="' + m.id + '"' + (m.id === v ? ' selected' : '') + '>' + esc(m.name) + '</option>').join('') + '</select></label>'; if (t === 'area' || t === 'lines') return '<label class="f">' + l + '<textarea id="ed_' + k + '">' + esc(t === 'lines' ? String(v).split('|').join('\n') : v) + '</textarea></label>'; return '<label class="f">' + l + '<input type="' + (t === 'num' ? 'number' : 'text') + '" id="ed_' + k + '" value="' + esc(v) + '"' + (k === 'id' && !isNew ? ' readonly' : '') + '></label>'; };
  dlg((isNew ? 'New ' : 'Edit ') + table.replace(/s$/, ''), '<form class="form">' + FORMS[table].map(field).join('') + '<p class="alert bad" id="edErr" hidden></p></form>', '<button class="btn" data-close>Cancel</button><button class="btn red" id="edGo">Save</button>', () => {
    $('edGo').onclick = async () => { const r = {}; FORMS[table].forEach(([k, , t]) => { const v = $('ed_' + k).value; r[k] = t === 'lines' ? v.split('\n').map(x => x.trim()).filter(Boolean).join('|') : v; }); try { await api('trContentSave', { table, rec: r }); $('dlg').close(); toast('Saved'); render(); } catch (e) { $('edErr').hidden = false; $('edErr').textContent = e.message; } };
  });
}
VIEWS.content.after = () => { document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { const [t, id] = b.dataset.edit.split(':'); editDlg(t, S.content[t].find(x => x.id === id)); }); document.querySelectorAll('[data-new]').forEach(b => b.onclick = () => editDlg(b.dataset.new, null)); };
VIEWS.points = async () => {
  const j = await api('trAdjustments');
  return '<div class="ph"><div><h1>Points</h1><p>Points come from fixed rules and can never be awarded twice for the same thing. Manual adjustments need a reason and a platform administrator\'s approval.</p></div></div><div class="card"><h2>Manual adjustments</h2>' + (j.items.length ? '<div class="tablebox"><table><thead><tr><th>Agent</th><th>Points</th><th>Reason</th><th>Requested by</th><th>Status</th><th></th></tr></thead><tbody>' + j.items.map(x => '<tr><td>' + esc(x.agent) + '</td><td class="num">' + (x.points > 0 ? '+' : '') + x.points + '</td><td>' + esc(x.reason) + '</td><td class="small">' + esc(x.by) + '<div class="muted">' + fmtD(x.at) + '</div></td><td>' + esc(x.status) + (x.approved_by ? '<div class="small muted">' + esc(x.approved_by) + '</div>' : '') + '</td><td>' + (j.canApprove && x.status === 'pending' ? '<button class="btn sm red" data-adj="' + x.id + '" data-ok="1">Approve</button> <button class="btn sm" data-adj="' + x.id + '">Reject</button>' : '') + '</td></tr>').join('') + '</tbody></table></div>' : empty('No manual adjustments.')) + '</div>';
};
VIEWS.points.after = () => document.querySelectorAll('[data-adj]').forEach(b => b.onclick = async () => { try { await api('trAdjustDecide', { id: b.dataset.adj, approve: !!b.dataset.ok }); toast('Done'); render(); } catch (e) { toast(e.message); } });
VIEWS.platform = async () => {
  const c = await api('trContent'), s = c.settings, o = S.ov || await getOv();
  const inp = (k, l, t) => '<label class="f">' + l + '<input type="' + (t || 'text') + '" data-set="' + k + '" value="' + esc(s[k]) + '"></label>';
  return '<div class="ph"><div><h1>Settings and security</h1><p>Platform administrator only.</p></div><div class="row"><button class="btn" id="bk">Back up now</button><button class="btn" id="au">Audit log</button></div></div>'
    + '<div class="card"><h2>Email</h2><label class="f">Mode<select data-set="mail_mode"><option value="test"' + (s.mail_mode === 'test' ? ' selected' : '') + '>Test: every email goes to you, marked [TEST - TECH RACE]</option><option value="live"' + (s.mail_mode === 'live' ? ' selected' : '') + '>Live: emails go to agents</option></select></label></div>'
    + '<div class="card"><h2>Points rules</h2><div class="grid g4">' + inp('rule_lesson', 'Complete learning material', 'number') + inp('rule_check', 'Pass knowledge check', 'number') + inp('rule_submit', 'Submit practical assignment', 'number') + inp('rule_verify', 'MCTT verifies (default)', 'number') + inp('rule_attend', 'Attend training', 'number') + inp('rule_ontime', 'On-time bonus', 'number') + inp('rule_advanced', 'Advanced challenge', 'number') + inp('lesson_xp_week_cap', 'Weekly lesson XP limit', 'number') + inp('check_pass_pct', 'Knowledge check pass %', 'number') + '</div></div>'
    + '<div class="card"><h2>Booking and support links</h2><div class="grid g2">' + inp('support_url', 'Tech support ticket link', 'url') + inp('checkin_url', 'Tuesday Tech Check-In booking link', 'url') + inp('monday_link', 'Monday training joining link', 'url') + inp('monday_training', 'Monday training description') + inp('buddy_info', 'Lead Generation Buddy description') + inp('app_url', 'App address', 'url') + '</div><button class="btn red" id="saveSet" style="margin-top:12px">Save settings</button></div>'
    + '<div class="card"><h2>Roles</h2><p class="small muted">Nobody can change their own role. Changing roles signs the person out everywhere.</p><div class="tablebox"><table><thead><tr><th>Person</th><th>Agent</th><th>MCTT</th><th>Leadership</th><th>Platform</th><th></th></tr></thead><tbody>' + o.people.filter(a => a.status !== 'declined').map(a => '<tr><td>' + esc(a.name) + '<div class="small muted">' + esc(a.email) + '</div></td>' + ['agent', 'mctt', 'leader', 'platform'].map(r => '<td><input type="checkbox" data-role="' + a.id + '" value="' + r + '"' + (a.roles.includes(r) ? ' checked' : '') + '></td>').join('') + '<td><button class="btn sm" data-saverole="' + a.id + '">Save</button></td></tr>').join('') + '</tbody></table></div></div>';
};
VIEWS.platform.after = () => {
  $('saveSet').onclick = async () => { const s = {}; document.querySelectorAll('[data-set]').forEach(el => { s[el.dataset.set] = el.value; }); try { await api('trSettings', { settings: s }); toast('Settings saved'); } catch (e) { toast(e.message); } };
  $('bk').onclick = async () => { try { const j = await api('trBackup'); toast('Backup saved to Drive: ' + j.file); } catch (e) { toast(e.message); } };
  $('au').onclick = async () => { const j = await api('trAudit'); dlg('Audit log (latest 400)', '<ul class="trail">' + j.items.map(a => '<li><b>' + esc(a.action) + '</b> <span class="small muted">' + fmtDT(a.at) + ' · ' + esc(a.actor) + '</span><div class="small">' + esc(a.target) + ' ' + esc(a.detail) + '</div></li>').join('') + '</ul>'); };
  document.querySelectorAll('[data-saverole]').forEach(b => b.onclick = async () => { const id = b.dataset.saverole, roles = [...document.querySelectorAll('[data-role="' + id + '"]:checked')].map(x => x.value); try { await api('trRoles', { id, roles, leader_mc: roles.includes('leader') ? 'kw-edge' : '' }); toast('Roles saved'); } catch (e) { toast(e.message); } });
};

window.addEventListener('hashchange', () => { if (/^#(invite|verify|reset)=/.test(location.hash)) boot(); });
boot();
</script>
