<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MRET site admin</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Instrument+Serif&display=swap">
<style>[hidden] { display: none !important; }
:root { --bg: #f4f3ef; --card: #fff; --ink: #15171c; --ink-2: #4a4f5a; --ink-3: #7b808b; --line: #e2e0d9; --line-2: #cfccc2; --gold: #9a7a32; --gold-bg: #f6efdf; --navy: #0d1626; --ok: #1d6b45; --ok-bg: #e5f2ea; --warn: #8a5a00; --warn-bg: #fbf0d9; --bad: #a3271f; --bad-bg: #fbe7e5; --r: 6px; font-family: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif; color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 inherit; font-family: inherit; }
h1, h2, h3 { margin: 0; line-height: 1.2; }
h1 { font-size: 20px; } h2 { font-size: 18px; } h3 { font-size: 15px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; padding: 0 14px; border: 1px solid var(--line-2); background: #fff; border-radius: var(--r); cursor: pointer; font-weight: 600; font-size: 14px; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn.gold { background: #b48d3c; border-color: #b48d3c; color: #fff; }
.btn.danger { color: var(--bad); }
.btn.sm { min-height: 30px; padding: 0 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.muted { color: var(--ink-3); } .small { font-size: 13px; }
/* gate */
.gate { min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--navy); }
.gate form { background: #fff; padding: 32px; border-radius: 10px; width: 100%; max-width: 400px; display: grid; gap: 14px; }
.gate .logo { font: 400 30px 'Instrument Serif', serif; }
/* layout */
.top { position: sticky; top: 0; z-index: 20; background: var(--navy); color: #fff; display: flex; align-items: center; gap: 12px; padding: 10px 16px; flex-wrap: wrap; }
.top .logo { font: 400 24px 'Instrument Serif', serif; margin-right: 6px; }
.top .state { margin-right: auto; font-size: 13px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: 12.5px; font-weight: 600; background: rgba(255, 255, 255, .12); }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: #9aa; }
.pill.saved i { background: #5fc48d; } .pill.dirty i { background: #f0b443; } .pill.busy i { background: #7fb2ff; } .pill.err i { background: #ff7a6e; }
.top .btn { background: transparent; color: #fff; border-color: rgba(255, 255, 255, .3); }
.top .btn.gold { background: #b48d3c; border-color: #b48d3c; }
.shell { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: calc(100vh - 58px); }
.side { border-right: 1px solid var(--line); padding: 16px 10px; background: #fbfaf7; }
.side button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 9px 12px; border-radius: var(--r); cursor: pointer; font-weight: 500; }
.side button[aria-current="page"] { background: var(--gold-bg); color: #5d4615; font-weight: 700; }
.side .sep { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-3); padding: 14px 12px 6px; }
.main { padding: 24px clamp(16px, 3vw, 36px) 80px; max-width: 1100px; }
.ph { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.ph p { margin: 4px 0 0; color: var(--ink-2); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-bottom: 16px; }
.card > h2, .card > h3 { margin-bottom: 12px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid .full { grid-column: 1 / -1; }
label.f { display: grid; gap: 5px; font-weight: 600; font-size: 13.5px; }
label.f .hint { font-weight: 400; color: var(--ink-3); font-size: 12.5px; }
label.f .count { font-weight: 400; color: var(--ink-3); font-size: 12px; justify-self: end; margin-top: -2px; }
input[type=text], input[type=email], input[type=url], input[type=search], select, textarea { width: 100%; min-height: 40px; border: 1px solid var(--line-2); border-radius: var(--r); padding: 8px 10px; background: #fff; font-weight: 400; }
textarea { min-height: 92px; resize: vertical; }
input.bad, textarea.bad { border-color: var(--bad); background: var(--bad-bg); }
.check { display: inline-flex; gap: 8px; align-items: center; font-weight: 500; }
.alert { border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; font-size: 14px; }
.alert.ok { background: var(--ok-bg); color: var(--ok); } .alert.warn { background: var(--warn-bg); color: var(--warn); } .alert.bad { background: var(--bad-bg); color: var(--bad); }
.alert ul { margin: 6px 0 0; padding-left: 18px; }
/* section list */
.slist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.slist li { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.slist li.off { opacity: .6; }
.thumb { width: 64px; height: 48px; border-radius: 4px; background: #1a2338 center / cover no-repeat; display: grid; place-items: center; color: #9aa3b5; font-size: 10px; text-align: center; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.slist .t { font-weight: 700; } .slist .s { font-size: 12.5px; color: var(--ink-3); }
.row-acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
/* image field */
.imgf { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 14px; align-items: start; }
.imgf .pv { width: 180px; aspect-ratio: 4 / 3; border-radius: 6px; background: #1a2338; overflow: hidden; display: grid; place-items: center; color: #9aa3b5; font-size: 12px; }
.imgf .pv img { width: 100%; height: 100%; object-fit: cover; }
/* library */
.lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.lib .it { background: #fff; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: grid; text-align: left; padding: 0; cursor: pointer; }
.lib .it[aria-pressed="true"] { outline: 3px solid var(--gold); }
.lib .it .im { aspect-ratio: 4 / 3; background: #1a2338; display: grid; place-items: center; color: #9aa3b5; font-size: 12px; overflow: hidden; }
.lib .it .im img { width: 100%; height: 100%; object-fit: cover; }
.lib .it .meta { padding: 8px 10px; font-size: 12.5px; display: grid; gap: 2px; }
.lib .it .meta b { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 99px; background: #eee; color: var(--ink-2); }
.tag.warn { background: var(--warn-bg); color: var(--warn); } .tag.ok { background: var(--ok-bg); color: var(--ok); }
.drop { border: 2px dashed var(--line-2); border-radius: 10px; padding: 22px; text-align: center; background: #fbfaf7; }
.drop.on { border-color: var(--gold); background: var(--gold-bg); }
/* focal */
.focal { position: relative; display: inline-block; max-width: 100%; cursor: crosshair; border-radius: 6px; overflow: hidden; }
.focal img { display: block; max-width: 100%; max-height: 420px; }
.focal .dot { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 0 2px rgba(0, 0, 0, .5), inset 0 0 0 2px rgba(0, 0, 0, .3); pointer-events: none; }
.crops { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.crops div { background: #1a2338 center / cover no-repeat; border-radius: 4px; }
.crops span { display: block; font-size: 11.5px; color: var(--ink-3); margin-top: 3px; }
/* table */
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 700; }
/* dialog */
dialog { border: 0; border-radius: 12px; padding: 0; width: min(760px, calc(100vw - 24px)); max-height: calc(100vh - 32px); box-shadow: 0 30px 80px rgba(0, 0, 0, .35); }
dialog::backdrop { background: rgba(13, 22, 38, .55); }
dialog .dh { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; z-index: 2; }
dialog .db { padding: 18px; }
dialog .df { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: #fff; }
/* preview */
.pvw { position: fixed; inset: 0; z-index: 50; background: #1c2230; display: grid; grid-template-rows: auto minmax(0, 1fr); }
.pvw .bar { display: flex; gap: 8px; align-items: center; padding: 10px 14px; background: var(--navy); color: #fff; flex-wrap: wrap; }
.pvw .bar .btn { background: transparent; color: #fff; border-color: rgba(255, 255, 255, .3); }
.pvw .bar .btn[aria-pressed="true"] { background: #fff; color: var(--navy); }
.pvw .stage { display: grid; place-items: start center; overflow: auto; padding: 16px; }
.pvw iframe { border: 0; background: #07080b; width: 100%; height: 100%; min-height: 70vh; border-radius: 8px; box-shadow: 0 20px 60px rgba(0, 0, 0, .4); }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 8px; z-index: 80; font-size: 14px; max-width: calc(100vw - 32px); }
@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { border-right: 0; border-bottom: 1px solid var(--line); display: flex; overflow-x: auto; gap: 4px; padding: 8px; }
  .side button { width: auto; white-space: nowrap; } .side .sep { display: none; }
  .grid, .imgf { grid-template-columns: minmax(0, 1fr); }
  .top .state { order: 3; width: 100%; }
}
</style>
</head>
<body>
<form class="gate" id="gate" hidden>
  <div style="display:contents">
  <div style="background:#fff;padding:32px;border-radius:10px;width:100%;max-width:400px;display:grid;gap:14px">
    <div class="logo">MRET site admin</div>
    <p class="muted small" style="margin:0">Sign in with your administrator email. A one-time code is sent to that address.</p>
    <div id="emailStep" style="display:grid;gap:12px"><label class="f" for="gEmail">Email<input type="email" id="gEmail" autocomplete="email" required></label><button class="btn primary" id="gateGo">Send me a code</button></div>
    <div id="codeStep" hidden style="display:grid;gap:12px"><label class="f" for="gCode">6-digit code<input type="text" id="gCode" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]*" maxlength="7"></label><button class="btn primary">Sign in</button><button type="button" class="btn" id="gBack">Use a different email</button></div>
    <p class="small" id="gateMsg" role="status" style="margin:0;min-height:1em"></p>
  </div>
  </div>
</form>
<div id="app" hidden>
  <header class="top"><span class="logo">MRET</span><span class="small" id="who" style="opacity:.75"></span><div class="state" id="state"></div>
    <button type="button" class="btn" id="previewBtn">Preview</button><button type="button" class="btn" id="saveBtn" disabled>Save draft</button><button type="button" class="btn gold" id="pubBtn">Publish</button><button type="button" class="btn" id="outBtn">Sign out</button></header>
  <div class="shell"><nav class="side" id="side" aria-label="Admin sections"></nav><main class="main" id="main"></main></div>
</div>
<dialog id="dlg" aria-labelledby="dlgT"><div class="dh"><h2 id="dlgT"></h2><button type="button" class="btn sm" id="dlgX" aria-label="Close">Close</button></div><div class="db" id="dlgB"></div><div class="df" id="dlgF"></div></dialog>
<div class="pvw" id="pvw" hidden role="dialog" aria-label="Preview"><div class="bar"><b id="pvLabel" style="margin-right:auto">Preview</b><button type="button" class="btn sm" data-dev="390px">Phone</button><button type="button" class="btn sm" data-dev="820px">Tablet</button><button type="button" class="btn sm" data-dev="100%" aria-pressed="true">Desktop</button><button type="button" class="btn sm" id="pvTab">Open in a new tab</button><button type="button" class="btn sm" id="pvClose">Close preview</button></div><div class="stage"><iframe id="pvFrame" title="Site preview" style="width:100%"></iframe></div></div>
<div class="toast" id="toast" hidden role="status"></div>
<script>/* MRET site content: default content, validation and helpers.
 * The same file runs in the Apps Script server, the public site and the admin dashboard. */
var CMSX = (function () {
  var STATUS = ['live', 'beta', 'soon'];
  var ACCESS = ['public', 'members', 'owner'];
  var SECTION_TYPES = ['featured', 'pillar', 'directory', 'contact'];
  /** Account types people choose when they sign up. The owner (site admin) always sees everything. */
  var TYPES = [['agent', 'Estate agent'], ['client', 'Buying or selling a home'], ['community', 'New Creation member'], ['other', 'Something else']];
  var AUDIENCES = ['all'].concat(TYPES.map(function (t) { return t[0]; }));
  var LIMITS = { short: 120, text: 900, url: 600, services: 80, categories: 16, sections: 16, social: 12, links: 16 };

  var DEFAULT = null; // default content stays on the server; this page is public


  function str(v) { return typeof v === 'string'; }
  function urlOk(u) {
    if (u === '' || u == null) return true;
    if (!str(u) || u.length > LIMITS.url || /[\s<>"']/.test(u)) return false;
    return /^(https:\/\/|http:\/\/|\/(?!\/)|#[A-Za-z0-9_-]*$|mailto:[^@]+@[^@]+$|tel:\+?[0-9 ()-]{5,20}$)/.test(u);
  }
  function idOk(v) { return str(v) && /^[a-z0-9][a-z0-9-]{0,40}$/.test(v); }
  function imgOk(im) { return im == null || (typeof im === 'object' && idOk(String(im.id || '').toLowerCase()) && (im.alt == null || (str(im.alt) && im.alt.length <= 300))); }

  /** Returns a list of readable problems; empty means the content can be saved. strict = checks for publishing. */
  function validate(c, strict) {
    var e = [];
    function t(path, v, max, req) {
      if (v == null || v === '') { if (req) e.push(path + ' is required.'); return; }
      if (!str(v)) e.push(path + ' must be text.'); else if (v.length > max) e.push(path + ' is longer than ' + max + ' characters.');
    }
    function link(path, l, req) {
      if (l == null) { if (req) e.push(path + ' needs a button.'); return; }
      if (typeof l !== 'object') return e.push(path + ' is not a button.');
      t(path + ' label', l.label, 40, !!l.url);
      if (!urlOk(l.url)) e.push(path + ' link "' + String(l.url).slice(0, 60) + '" is not a valid link. Use https://..., /page/, #section, mailto: or tel:.');
      if (strict && l.label && !l.url) e.push(path + ' has a label but no link.');
    }
    if (!c || typeof c !== 'object') return ['Content is missing.'];
    c.meta = c.meta || {}; c.brand = c.brand || {}; c.hero = c.hero || {}; c.contact = c.contact || {}; c.footer = c.footer || {};
    t('Site title', c.meta.title, 70, true); t('Site description', c.meta.description, 300);
    t('Brand name', c.brand.name, 40, true); t('Tagline', c.brand.tagline, LIMITS.short);
    t('Hero eyebrow', c.hero.eyebrow, 60); t('Hero heading', c.hero.heading, 140, true); t('Hero text', c.hero.text, LIMITS.text);
    if (!imgOk(c.hero.image)) e.push('Hero image is invalid.');
    link('Hero primary button', c.hero.primary); link('Hero secondary button', c.hero.secondary);
    if (!Array.isArray(c.categories) || !c.categories.length) e.push('Add at least one category.');
    else if (c.categories.length > LIMITS.categories) e.push('Too many categories.');
    var cats = {};
    (c.categories || []).forEach(function (k, i) { if (!idOk(k.id)) e.push('Category ' + (i + 1) + ' has an invalid id.'); else if (cats[k.id]) e.push('Category id "' + k.id + '" is used twice.'); cats[k.id] = 1; t('Category ' + (i + 1) + ' name', k.name, 40, true); });
    if (!Array.isArray(c.services)) e.push('Services are missing.');
    else {
      if (c.services.length > LIMITS.services) e.push('Too many services.');
      var sids = {};
      c.services.forEach(function (s, i) {
        var p = 'Service "' + (s.title || i + 1) + '"';
        if (!idOk(s.id)) e.push(p + ' has an invalid id.'); else if (sids[s.id]) e.push(p + ': id "' + s.id + '" is used twice.'); sids[s.id] = 1;
        t(p + ' title', s.title, 80, true); t(p + ' description', s.desc, 300);
        if (!cats[s.cat]) e.push(p + ' is in a category that does not exist.');
        if (STATUS.indexOf(s.status) < 0) e.push(p + ' needs an availability.');
        if (ACCESS.indexOf(s.access) < 0) e.push(p + ' needs an access level.');
        if (!urlOk(s.url)) e.push(p + ' link is not valid.');
        if (strict && s.status !== 'soon' && !s.url) e.push(p + ' is marked available but has no link.');
        if (!imgOk(s.image)) e.push(p + ' image is invalid.');
        if (s.who != null && (!Array.isArray(s.who) || s.who.some(function (w) { return AUDIENCES.indexOf(w) < 0; }))) e.push(p + ' has an unknown audience.');
      });
    }
    if (!Array.isArray(c.sections) || !c.sections.length) e.push('Add at least one homepage section.');
    else {
      if (c.sections.length > LIMITS.sections) e.push('Too many sections.');
      var secIds = {};
      c.sections.forEach(function (s, i) {
        var p = 'Section "' + (s.heading || i + 1) + '"';
        if (!idOk(s.id)) e.push(p + ' has an invalid id.'); else if (secIds[s.id]) e.push(p + ': id "' + s.id + '" is used twice.'); secIds[s.id] = 1;
        if (SECTION_TYPES.indexOf(s.type) < 0) e.push(p + ' has an unknown type.');
        t(p + ' eyebrow', s.eyebrow, 60); t(p + ' heading', s.heading, 140, true); t(p + ' text', s.text, LIMITS.text);
        if (s.type === 'pillar' && s.cat && !cats[s.cat]) e.push(p + ' points to a category that does not exist.');
        if (!imgOk(s.image)) e.push(p + ' image is invalid.');
        link(p + ' primary button', s.primary); link(p + ' secondary button', s.secondary);
      });
    }
    ['email', 'phone', 'whatsapp', 'office', 'hours'].forEach(function (k) { t('Contact ' + k, c.contact[k], 160); });
    if (c.contact.email && !/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(c.contact.email)) e.push('Contact email is not a valid address.');
    if (c.contact.phone && !/^\+?[0-9 ()-]{6,20}$/.test(c.contact.phone)) e.push('Contact phone may only hold digits, spaces, brackets, dashes and a leading +.');
    if (c.contact.whatsapp && !/^\+?[0-9 ]{6,20}$/.test(c.contact.whatsapp)) e.push('WhatsApp number may only hold digits, spaces and a leading +.');
    if (!Array.isArray(c.social)) c.social = [];
    if (c.social.length > LIMITS.social) e.push('Too many social links.');
    c.social.forEach(function (s, i) { t('Social link ' + (i + 1) + ' label', s.label, 30, true); if (!s.url || !/^https:\/\//.test(s.url) || !urlOk(s.url)) e.push('Social link ' + (i + 1) + ' must start with https://.'); });
    t('Footer note', c.footer.note, 300);
    if (JSON.stringify(c).length > 200000) e.push('The content is too large.');
    return e;
  }
  /** Every image id the content refers to. */
  function imageIds(c) {
    var out = {};
    function add(im) { if (im && im.id) out[im.id] = 1; }
    if (!c) return [];
    add(c.hero && c.hero.image);
    (c.sections || []).forEach(function (s) { add(s.image); });
    (c.services || []).forEach(function (s) { add(s.image); });
    return Object.keys(out);
  }
  function counts(c, publicOnly) {
    var n = {}, total = 0;
    (c.services || []).forEach(function (s) { if (publicOnly && s.hidden) return; n[s.cat] = (n[s.cat] || 0) + 1; total++; });
    n._all = total; return n;
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  /** Who may see a service. Older content without "who" falls back to its access level. */
  function whoOf(s) { return Array.isArray(s.who) ? s.who : s.access === 'owner' ? [] : ['all']; }
  function canSee(s, type) { if (type === 'owner') return true; if (!type) return false; var w = whoOf(s); return w.indexOf('all') >= 0 || w.indexOf(type) >= 0; }
  /** The content one signed-in person receives: only services meant for their account type, and only sections that still have something to show. */
  function forViewer(content, type) {
    var c = clone(content);
    c.services = (c.services || []).filter(function (s) { return !s.hidden && canSee(s, type); });
    var has = {}; c.services.forEach(function (s) { has[s.cat] = 1; });
    var total = {}; (content.services || []).forEach(function (s) { if (!s.hidden) total[s.cat] = 1; });
    c.sections = (c.sections || []).filter(function (s) { return s.type !== 'pillar' || !s.cat || !total[s.cat] || has[s.cat]; });
    c.categories = (c.categories || []).filter(function (k) { return has[k.id] || !total[k.id]; });
    return c;
  }
  return { TYPES: TYPES, AUDIENCES: AUDIENCES, whoOf: whoOf, canSee: canSee, forViewer: forViewer, DEFAULT: DEFAULT, validate: validate, urlOk: urlOk, imageIds: imageIds, counts: counts, clone: clone, STATUS: STATUS, ACCESS: ACCESS, SECTION_TYPES: SECTION_TYPES };
})();
if (typeof module !== 'undefined') module.exports = CMSX;
</script>
<script>'use strict';
/* MRET site admin. All permissions are enforced by the server; this page only shows what the signed-in session is allowed to do. */
const CMS_API = 'https://script.google.com/macros/s/AKfycbyIZKYDOIrlrEJeg2eSRvXGwQ24q4yiWHNwRrIgNYWVQLRzCTdqSNE0bpZQbWU9y0_r/exec';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ss = { get: k => { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} } };
const A = { token: ss.get('mretcms.t'), email: ss.get('mretcms.e'), draft: null, rev: 0, savedAt: null, dirty: false, fresh: false, publishedNo: 0, publishedRev: 0, versions: [], images: [], view: 'home', state: '' };
const STATUS_LABEL = { live: 'Available', beta: 'Beta', soon: 'Coming soon' }, ACCESS_LABEL = { public: 'Everyone', members: 'Members sign in', owner: 'Owner only' };
const TYPE_LABEL = { featured: 'Featured services', pillar: 'Service area', directory: 'Searchable directory', contact: 'Contact' };

/* ---------- transport ---------- */
async function api(a, extra) {
  let j;
  try { const r = await fetch(CMS_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ a, token: A.token }, extra || {})) }); j = await r.json(); }
  catch (e) { throw new Error('Could not reach the site server. Check your connection and try again.'); }
  if (j.error === 'signin') { signedOut('Your session ended. Sign in again; unsaved changes in this window are kept until you reload.'); const e = new Error('Please sign in again.'); e.code = 'signin'; throw e; }
  if (!j.ok) { const e = new Error(j.message || 'Something went wrong.'); e.code = j.error; e.data = j; throw e; }
  return j;
}
let toastT;
function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 4200); }

/* ---------- sign in ---------- */
function showGate(msg) { $('gate').hidden = false; $('app').hidden = true; $('gateMsg').textContent = msg || ''; $('codeStep').hidden = true; $('emailStep').hidden = false; }
function signedOut(msg) { A.token = null; ss.set('mretcms.t', null); showGate(msg); }
$('gate').onsubmit = async e => {
  e.preventDefault(); const b = e.submitter || $('gateGo'); b.disabled = true; $('gateMsg').textContent = '';
  try {
    if (!$('codeStep').hidden) {
      const j = await api('cmsAuthVerify', { email: $('gEmail').value, code: $('gCode').value });
      A.token = j.token; A.email = j.email; ss.set('mretcms.t', j.token); ss.set('mretcms.e', j.email); $('gCode').value = ''; await boot();
    } else {
      const j = await api('cmsAuthStart', { email: $('gEmail').value });
      $('emailStep').hidden = true; $('codeStep').hidden = false; $('gateMsg').textContent = j.message; $('gCode').focus();
    }
  } catch (x) { $('gateMsg').textContent = x.message; } finally { b.disabled = false; }
};
$('gBack').onclick = () => showGate('');

/* ---------- load ---------- */
async function boot() {
  const j = await api('cmsLoad');
  A.email = j.me; A.publishedNo = j.publishedNo; A.publishedRev = j.publishedRev; A.versions = j.versions; A.images = j.images;
  if (j.draft) { A.draft = j.draft; A.rev = j.rev; A.savedAt = j.savedAt; A.dirty = false; A.fresh = false; }
  else { A.draft = CMSX.clone(j.starter); A.rev = 0; A.dirty = true; A.fresh = true; }
  $('gate').hidden = true; $('app').hidden = false; $('who').textContent = A.email;
  render();
}

/* ---------- paths ---------- */
function getP(path) { return path.split('.').reduce((o, k) => o == null ? o : o[k], A.draft); }
function setP(path, v) { const ks = path.split('.'), last = ks.pop(); let o = A.draft; ks.forEach(k => { if (o[k] == null) o[k] = {}; o = o[k]; }); o[last] = v; }
function markDirty() { A.dirty = true; topState(); }

/* ---------- state bar ---------- */
function topState(busy, err) {
  const st = $('state'); let cls = 'saved', txt = 'Draft saved' + (A.savedAt ? ' ' + new Date(A.savedAt).toLocaleTimeString('en-ZA', { hour: '2-digit', minute: '2-digit' }) : '');
  if (busy) { cls = 'busy'; txt = busy; } else if (err) { cls = 'err'; txt = err; } else if (A.dirty) { cls = 'dirty'; txt = 'Unsaved changes'; }
  const live = A.publishedNo ? (A.publishedRev === A.rev && !A.dirty ? 'Live: version ' + A.publishedNo + ', same as draft' : 'Live: version ' + A.publishedNo + ' · draft differs') : 'Nothing published yet';
  st.innerHTML = '<span class="pill ' + cls + '" role="status"><i></i>' + esc(txt) + '</span><span class="pill"><i style="background:#c9a55c"></i>' + esc(live) + '</span>';
  $('saveBtn').disabled = !A.dirty || !!busy;
}
async function save() {
  const errs = CMSX.validate(CMSX.clone(A.draft), false);
  if (errs.length) { showErrors('The draft was not saved', errs); return false; }
  topState('Saving...');
  try { const j = await api('cmsSave', { content: A.draft, rev: A.rev }); A.rev = j.rev; A.savedAt = j.savedAt; A.dirty = false; A.fresh = false; topState(); clearErrors(); return true; }
  catch (e) { topState(null, e.code === 'conflict' ? 'Changed in another window' : 'Not saved'); showErrors(e.code === 'conflict' ? 'Someone saved this draft elsewhere' : 'The draft was not saved', [e.message]); return false; }
}
function showErrors(title, list) { const b = $('errs'); b.hidden = false; b.innerHTML = '<b>' + esc(title) + '</b><ul>' + list.slice(0, 12).map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>'; b.scrollIntoView({ block: 'nearest' }); }
function clearErrors() { $('errs').hidden = true; }

/* ---------- navigation ---------- */
const NAV = [['home', 'Homepage sections'], ['hero', 'Hero'], ['services', 'Services'], ['categories', 'Categories'], ['contact', 'Contact & site details'], ['images', 'Images'], ['versions', 'Published versions'], ['members', 'Members']];
function render() {
  $('side').innerHTML = NAV.map(([k, l], i) => (i === 5 ? '<div class="sep">Library</div>' : i === 7 ? '<div class="sep">People</div>' : '') + '<button type="button" data-nav="' + k + '"' + (A.view === k || (k === 'home' && /^sec:/.test(A.view)) ? ' aria-current="page"' : '') + '>' + esc(l) + '</button>').join('');
  $('side').querySelectorAll('[data-nav]').forEach(b => b.onclick = () => { A.view = b.dataset.nav; render(); window.scrollTo(0, 0); });
  const v = A.view.startsWith('sec:') ? viewSection(A.view.slice(4)) : (VIEWS[A.view] || VIEWS.home)();
  $('main').innerHTML = (A.fresh ? '<div class="alert warn">This is the starting content, taken from the new design. Nothing is saved yet: review it, then press <b>Save draft</b>.</div>' : '') + '<div class="alert bad" id="errs" hidden></div>' + v;
  bind(); topState(); loadThumbs();
}
function field(path, label, opt) {
  opt = opt || {}; const v = getP(path), id = 'f_' + path.replace(/\./g, '_');
  const max = opt.max ? '<span class="count" data-count="' + id + '">' + String(v || '').length + ' / ' + opt.max + '</span>' : '';
  const ctl = opt.area ? '<textarea id="' + id + '" data-path="' + path + '"' + (opt.max ? ' maxlength="' + opt.max + '"' : '') + '>' + esc(v || '') + '</textarea>'
    : opt.select ? '<select id="' + id + '" data-path="' + path + '">' + opt.select.map(o => '<option value="' + esc(o[0]) + '"' + (String(v) === String(o[0]) ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join('') + '</select>'
    : opt.check ? '' : '<input type="text" id="' + id + '" data-path="' + path + '" value="' + esc(v || '') + '"' + (opt.max ? ' maxlength="' + opt.max + '"' : '') + (opt.ph ? ' placeholder="' + esc(opt.ph) + '"' : '') + (opt.link ? ' data-link="1" inputmode="url"' : '') + '>';
  if (opt.check) return '<label class="check' + (opt.full ? ' full' : '') + '"><input type="checkbox" id="' + id + '" data-path="' + path + '" data-bool="1"' + (v !== false && v ? ' checked' : '') + '> ' + esc(label) + '</label>';
  return '<label class="f' + (opt.full ? ' full' : '') + '" for="' + id + '">' + esc(label) + (opt.hint ? ' <span class="hint">' + esc(opt.hint) + '</span>' : '') + ctl + max + '</label>';
}
function linkFields(path, label) {
  if (!getP(path)) setP(path, { label: '', url: '' });
  return field(path + '.label', label + ': button text', { max: 40, ph: 'Leave empty for no button' }) + field(path + '.url', label + ': link', { link: true, ph: '/page/, #section, https://...', hint: 'Existing pages keep their addresses' });
}
function imageField(path, label) {
  const im = getP(path), meta = im && A.images.find(x => x.id === im.id);
  return '<div class="full"><div class="f" style="font-weight:600;font-size:13.5px;margin-bottom:6px">' + esc(label) + '</div><div class="imgf"><div class="pv">' + (meta ? '<img data-thumb="' + meta.id + '" alt="">' : im ? 'Image missing' : 'No image: a line composition is shown') + '</div><div>'
    + (meta ? '<div><b>' + esc(meta.name) + '</b> <span class="muted small">' + meta.w + ' x ' + meta.h + '</span></div><div class="small" style="margin:4px 0 10px">' + (meta.alt ? 'Description: ' + esc(meta.alt) : '<span class="tag warn">No description for screen readers</span>') + '</div>' : im ? '<p class="alert bad">This image was deleted. Choose another.</p>' : '<p class="small muted" style="margin-top:0">Choose a photograph from the library or upload a new one.</p>')
    + '<div class="row-acts" style="justify-content:flex-start"><button type="button" class="btn sm" data-pick="' + path + '">' + (im ? 'Change image' : 'Choose image') + '</button>' + (meta ? '<button type="button" class="btn sm" data-imgedit="' + meta.id + '">Description and focal point</button>' : '') + (im ? '<button type="button" class="btn sm danger" data-unpick="' + path + '">Remove</button>' : '') + '</div></div></div></div>';
}
function bind() {
  document.querySelectorAll('[data-path]').forEach(el => {
    const h = () => {
      const v = el.dataset.bool ? el.checked : el.value; setP(el.dataset.path, v); markDirty();
      const c = document.querySelector('[data-count="' + el.id + '"]'); if (c) c.textContent = String(v).length + ' / ' + el.maxLength;
      if (el.dataset.link) el.classList.toggle('bad', !CMSX.urlOk(el.value.trim()));
      if (el.dataset.rerender) render();
    };
    el.addEventListener(el.tagName === 'SELECT' || el.type === 'checkbox' ? 'change' : 'input', h);
    if (el.dataset.link) el.classList.toggle('bad', !CMSX.urlOk(el.value.trim()));
  });
  document.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => pickImage(id => { setP(b.dataset.pick, { id }); markDirty(); render(); }));
  document.querySelectorAll('[data-unpick]').forEach(b => b.onclick = () => { setP(b.dataset.unpick, null); markDirty(); render(); });
  document.querySelectorAll('[data-imgedit]').forEach(b => b.onclick = () => imageDetail(b.dataset.imgedit));
  document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => ACTS[b.dataset.act](b.dataset.arg, b));
  const dz = $('drop'); if (dz) wireDrop(dz, $('upFile'), () => render());
  document.querySelectorAll('[data-mtype]').forEach(sel => sel.onchange = async () => { try { const j = await api('cmsMemberSet', { id: sel.dataset.mtype, type: sel.value }); Object.assign(A.members.find(m => m.id === j.member.id), j.member); toast('Saved. ' + j.member.name + ' now sees what that type sees.'); } catch (e) { toast(e.message); } });
  document.querySelectorAll('[data-mblock]').forEach(b => b.onclick = async () => { const m = A.members.find(x => x.id === b.dataset.mblock); if (!m.blocked && !sure(b)) return; try { const j = await api('cmsMemberSet', { id: m.id, blocked: !m.blocked }); Object.assign(m, j.member); render(); toast(m.blocked ? 'Blocked and signed out everywhere.' : 'Unblocked.'); } catch (e) { toast(e.message); } });
}

/* ---------- views ---------- */
const VIEWS = {};
const WHO_LABEL = { all: 'Everyone signed in', agent: 'Estate agents', client: 'Buyers and sellers', community: 'New Creation members', other: 'Something else' };
const whoText = s => { const w = CMSX.whoOf(s); return !w.length ? 'Only me' : w.includes('all') ? 'Everyone signed in' : w.map(x => WHO_LABEL[x]).join(', '); };
const catOpts = () => A.draft.categories.map(c => [c.id, c.name]);
VIEWS.home = () => {
  const d = A.draft, h = d.hero;
  const heroRow = '<li><div class="thumb">' + (h.image && A.images.find(x => x.id === h.image.id) ? '<img data-thumb="' + h.image.id + '" alt="">' : 'line art') + '</div><div><div class="t">' + esc(h.heading) + '</div><div class="s">Hero · always first</div></div><div class="row-acts"><button type="button" class="btn sm" data-nav2="hero" data-act="go" data-arg="hero">Edit</button></div></li>';
  const rows = d.sections.map((s, i) => '<li class="' + (s.visible === false ? 'off' : '') + '"><div class="thumb">' + (s.image && A.images.find(x => x.id === s.image.id) ? '<img data-thumb="' + s.image.id + '" alt="">' : s.type === 'pillar' ? 'line art' : esc(TYPE_LABEL[s.type])) + '</div><div><div class="t">' + esc(s.eyebrow ? s.eyebrow + ': ' : '') + esc(s.heading) + '</div><div class="s">' + esc(TYPE_LABEL[s.type]) + (s.visible === false ? ' · hidden' : '') + '</div></div><div class="row-acts">'
    + '<button type="button" class="btn sm" data-act="up" data-arg="' + i + '"' + (i ? '' : ' disabled') + ' aria-label="Move ' + esc(s.heading) + ' up">Up</button><button type="button" class="btn sm" data-act="down" data-arg="' + i + '"' + (i < d.sections.length - 1 ? '' : ' disabled') + ' aria-label="Move ' + esc(s.heading) + ' down">Down</button>'
    + '<button type="button" class="btn sm" data-act="toggle" data-arg="' + i + '">' + (s.visible === false ? 'Show' : 'Hide') + '</button><button type="button" class="btn sm primary" data-act="go" data-arg="sec:' + esc(s.id) + '">Edit</button></div></li>').join('');
  return '<div class="ph"><div><h1>Homepage sections</h1><p>Edit any section, change the order, or hide one without deleting it.</p></div><button type="button" class="btn" data-act="addPillar">Add a service area</button></div><ul class="slist">' + heroRow + rows + '</ul>';
};
VIEWS.hero = () => '<div class="ph"><div><h1>Hero</h1><p>The first screen visitors see.</p></div></div><div class="card"><div class="grid">' + field('hero.eyebrow', 'Small line above the heading', { max: 60 }) + '<span></span>' + field('hero.heading', 'Heading', { max: 140, full: true }) + field('hero.text', 'Introduction', { area: true, max: 900, full: true }) + imageField('hero.image', 'Background image') + linkFields('hero.primary', 'Main button') + linkFields('hero.secondary', 'Second button') + '</div></div>';
function viewSection(id) {
  const i = A.draft.sections.findIndex(s => s.id === id); if (i < 0) { A.view = 'home'; return VIEWS.home(); }
  const s = A.draft.sections[i], p = 'sections.' + i;
  let extra = '';
  if (s.type === 'pillar') extra = field(p + '.cat', 'Services listed in this section', { select: catOpts(), hint: 'from this category' }) + '<span></span>' + imageField(p + '.image', 'Image') + linkFields(p + '.primary', 'Main button') + linkFields(p + '.secondary', 'Second button');
  if (s.type === 'featured') extra = '<p class="full small muted">Lists the services marked <b>Featured</b> on the Services page that are not coming soon. Each uses its own image, or the image of its service area.</p>';
  if (s.type === 'directory') extra = '<p class="full small muted">Lists every service that is not hidden. Category counts are worked out from the services, so they are always accurate.</p>';
  if (s.type === 'contact') extra = '<p class="full small muted">Shows the details on the Contact page. The section is left out if no contact details are filled in.</p>';
  return '<div class="ph"><div><h1>' + esc(s.heading) + '</h1><p>' + esc(TYPE_LABEL[s.type]) + ' · section ' + (i + 1) + ' of ' + A.draft.sections.length + '</p></div><div class="row-acts"><button type="button" class="btn" data-act="go" data-arg="home">Back to sections</button>' + (s.type === 'pillar' ? '<button type="button" class="btn danger" data-act="delSection" data-arg="' + i + '">Delete section</button>' : '') + '</div></div>'
    + '<div class="card"><div class="grid">' + field(p + '.eyebrow', 'Small line above the heading (also the menu label)', { max: 60 }) + field(p + '.visible', 'Show this section on the homepage', { check: true }) + field(p + '.heading', 'Heading', { max: 140, full: true }) + field(p + '.text', 'Text', { area: true, max: 900, full: true }) + extra + '</div></div>';
}
VIEWS.services = () => {
  const d = A.draft, counts = CMSX.counts(d);
  const rows = d.services.map((s, i) => '<tr><td><b>' + esc(s.title) + '</b><div class="small muted">' + esc(s.url || 'no link') + '</div></td><td>' + esc((d.categories.find(c => c.id === s.cat) || {}).name || 'Missing category') + '</td>'
    + '<td><select data-path="services.' + i + '.status" aria-label="Availability of ' + esc(s.title) + '">' + CMSX.STATUS.map(x => '<option value="' + x + '"' + (s.status === x ? ' selected' : '') + '>' + STATUS_LABEL[x] + '</option>').join('') + '</select></td>'
    + '<td class="small">' + esc(whoText(s)) + '</td><td><input type="checkbox" data-path="services.' + i + '.featured" data-bool="1" aria-label="Feature ' + esc(s.title) + '"' + (s.featured ? ' checked' : '') + '></td><td>' + (s.hidden ? '<span class="tag">hidden</span>' : '') + '</td>'
    + '<td><div class="row-acts"><button type="button" class="btn sm" data-act="svcUp" data-arg="' + i + '"' + (i ? '' : ' disabled') + ' aria-label="Move up">Up</button><button type="button" class="btn sm primary" data-act="svcEdit" data-arg="' + i + '">Edit</button></div></td></tr>').join('');
  return '<div class="ph"><div><h1>Services</h1><p>' + d.services.length + ' services. Availability and Featured change the homepage and directory.</p></div><button type="button" class="btn primary" data-act="svcAdd">Add service</button></div><div class="card" style="overflow-x:auto"><table><thead><tr><th>Service</th><th>Category</th><th>Availability</th><th>Who sees it</th><th>Featured</th><th></th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>'
    + '<p class="small muted">Counts by category: ' + d.categories.map(c => esc(c.name) + ' ' + (counts[c.id] || 0)).join(' · ') + '</p>';
};
VIEWS.categories = () => {
  const d = A.draft, counts = CMSX.counts(d);
  return '<div class="ph"><div><h1>Categories</h1><p>Directory filters. Counts come from the services in each.</p></div><button type="button" class="btn primary" data-act="catAdd">Add category</button></div><div class="card"><table><thead><tr><th>Name</th><th>Services</th><th></th></tr></thead><tbody>'
    + d.categories.map((c, i) => '<tr><td><input type="text" data-path="categories.' + i + '.name" value="' + esc(c.name) + '" maxlength="40" aria-label="Category name"></td><td>' + (counts[c.id] || 0) + '</td><td><div class="row-acts"><button type="button" class="btn sm" data-act="catUp" data-arg="' + i + '"' + (i ? '' : ' disabled') + '>Up</button><button type="button" class="btn sm danger" data-act="catDel" data-arg="' + i + '">Delete</button></div></td></tr>').join('') + '</tbody></table></div>';
};
VIEWS.contact = () => {
  const d = A.draft;
  const soc = (d.social || []).map((s, i) => '<div class="grid" style="margin-bottom:8px">' + field('social.' + i + '.label', 'Label', { max: 30, ph: 'Instagram' }) + '<label class="f">Link<div style="display:flex;gap:6px"><input type="text" data-path="social.' + i + '.url" data-link="1" value="' + esc(s.url) + '" placeholder="https://..."><button type="button" class="btn sm danger" data-act="socDel" data-arg="' + i + '">Remove</button></div></label></div>').join('');
  return '<div class="ph"><div><h1>Contact and site details</h1><p>Only filled-in details appear on the site.</p></div></div>'
    + '<div class="card"><h2>Contact</h2><div class="grid">' + field('contact.email', 'Email', { ph: 'name@example.com' }) + field('contact.phone', 'Phone', { ph: '+27 ...' }) + field('contact.whatsapp', 'WhatsApp number', { ph: '+27 ...' }) + field('contact.office', 'Office', { max: 160 }) + field('contact.hours', 'Hours', { max: 160 }) + '</div></div>'
    + '<div class="card"><h2>Social links</h2>' + (soc || '<p class="muted small">None yet.</p>') + '<button type="button" class="btn sm" data-act="socAdd">Add a social link</button></div>'
    + '<div class="card"><h2>Site details</h2><div class="grid">' + field('brand.name', 'Name in the header', { max: 40 }) + field('brand.tagline', 'Tagline', { max: 120 }) + field('meta.title', 'Browser tab and search title', { max: 70 }) + field('meta.description', 'Search description', { max: 300, area: true }) + field('footer.note', 'Footer note', { max: 300, area: true, full: true }) + '</div></div>';
};
VIEWS.images = () => {
  const used = usedInDraft();
  return '<div class="ph"><div><h1>Images</h1><p>' + A.images.length + ' images. Photos are resized for the web before they upload. Images stay private until a published page uses them.</p></div></div>'
    + '<div class="drop" id="drop"><b>Drop photos here</b> or <label class="btn sm" style="display:inline-flex">choose files<input type="file" id="upFile" accept="image/jpeg,image/png,image/webp" multiple hidden></label><div class="small muted" style="margin-top:6px">JPEG, PNG or WebP, up to 25 MB each. They are converted to WebP at 480, 960 and 1920 pixels wide.</div><div id="upMsg" class="small" style="margin-top:8px" aria-live="polite"></div></div>'
    + '<div class="lib" style="margin-top:16px">' + A.images.map(im => libItem(im, used)).join('') + '</div>';
};
function libItem(im, used, picking) {
  return '<button type="button" class="it" data-' + (picking ? 'choose' : 'imgedit') + '="' + im.id + '"><div class="im"><img data-thumb="' + im.id + '" alt=""></div><div class="meta"><b>' + esc(im.name) + '</b><span class="muted">' + im.w + ' x ' + im.h + '</span><span>' + (im.alt ? '<span class="tag ok">described</span>' : '<span class="tag warn">needs description</span>') + ' ' + (used[im.id] ? '<span class="tag">in draft</span>' : '') + ' ' + (im.shared ? '<span class="tag">published</span>' : '') + '</span></div></button>';
}
VIEWS.versions = () => '<div class="ph"><div><h1>Published versions</h1><p>Every publish is kept here (the latest 50). Restoring copies a version into the draft; it goes live only when you publish.</p></div></div><div class="card" style="overflow-x:auto">'

window.addEventListener('message', e => { if (e.origin === location.origin && e.data && e.data.type === 'mret-preview-ready' && pvContent) e.source.postMessage({ type: 'mret-preview', content: pvContent }, location.origin); });
$('pvClose').onclick = () => { $('pvw').hidden = true; document.body.style.overflow = ''; $('pvFrame').src = 'about:blank'; };
document.querySelectorAll('[data-dev]').forEach(b => b.onclick = () => { document.querySelectorAll('[data-dev]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); $('pvFrame').style.width = b.dataset.dev; });
$('pvTab').onclick = () => { pvWin = window.open('../?preview&t=' + Date.now(), '_blank'); };
$('previewBtn').onclick = async () => { $('previewBtn').disabled = true; try { openPreview(await resolveDraft(), 'Draft preview' + (A.dirty ? ' (includes unsaved changes)' : '')); } finally { $('previewBtn').disabled = false; } };
$('saveBtn').onclick = async () => { if (await save()) toast('Draft saved. Visitors still see the published version.'); };

/* ---------- publish ---------- */
$('pubBtn').onclick = () => {
  const errs = CMSX.validate(CMSX.clone(A.draft), true), ids = CMSX.imageIds(A.draft);
  const noAlt = ids.map(id => A.images.find(x => x.id === id)).filter(x => x && !x.alt);
  const missing = ids.filter(id => !A.images.find(x => x.id === id));
  const blockers = errs.concat(missing.length ? [missing.length + ' image(s) in the draft were deleted. Choose other images.'] : []);
  dlg('Publish to the public site', (blockers.length ? '<div class="alert bad"><b>Fix these first</b><ul>' + blockers.slice(0, 12).map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>' : '<p>Visitors will see this draft as soon as it is published. The current live version (' + (A.publishedNo ? 'version ' + A.publishedNo : 'none') + ') stays in the history, so you can restore it.</p>')
    + (noAlt.length ? '<div class="alert warn">' + noAlt.length + ' image(s) have no description for screen readers: ' + noAlt.map(x => esc(x.name)).join(', ') + '. You can still publish.</div>' : '')
    + (A.dirty ? '<div class="alert warn">You have unsaved changes. They will be saved first.</div>' : '')
    + '<label class="f">Note for the history (optional)<input type="text" id="pubNote" maxlength="200" placeholder="For example: new hero photo"></label><div id="pubOut" style="margin-top:12px" aria-live="polite"></div>',
    '<button type="button" class="btn" data-close>Cancel</button><button type="button" class="btn gold" id="pubGo"' + (blockers.length ? ' disabled' : '') + '>' + (A.dirty ? 'Save and publish' : 'Publish now') + '</button>',
    d => {
      $('pubGo').onclick = async () => {
        $('pubGo').disabled = true; const out = $('pubOut');
        if (A.dirty && !(await save())) { out.innerHTML = '<div class="alert bad">The draft could not be saved, so nothing was published.</div>'; $('pubGo').disabled = false; return; }
        topState('Publishing...');
        try {
          const j = await api('cmsPublish', { rev: A.rev, note: $('pubNote').value.trim() });
          A.publishedNo = j.no; A.publishedRev = A.rev; const v = await api('cmsLoad'); A.versions = v.versions; A.images = v.images; topState();
          out.innerHTML = '<div class="alert ok"><b>Version ' + j.no + ' is published.</b> Checking the public site...</div>';
          const check = await verifyPublic(j.no);
          out.innerHTML = '<div class="alert ' + (check ? 'ok' : 'warn') + '"><b>Version ' + j.no + ' is published.</b> ' + (check ? 'Confirmed: the public content service now returns version ' + j.no + '.' : 'The public content service did not confirm yet; it can take a few seconds. Open the site to check.') + ' <a href="../" target="_blank" rel="noopener">Open the public site</a></div>' + (j.warnings || []).map(w => '<div class="alert warn">' + esc(w) + '</div>').join('');
          $('pubGo').remove(); render();
        } catch (e) { topState(null, 'Not published'); out.innerHTML = '<div class="alert bad">' + esc(e.message) + '</div>'; $('pubGo').disabled = false; }
      };
    });
};
async function verifyPublic(no) {
  for (let i = 0; i < 4; i++) {
    try { const j = await api('cmsPubCheck'); if (j.no === no) return true; } catch (e) {}
    await new Promise(ok => setTimeout(ok, 1500));
  }
  return false;
}
$('outBtn').onclick = async () => { if (A.dirty && !confirmBox('You have unsaved changes. Sign out anyway?')) return; try { await api('cmsSignOut'); } catch (e) {} signedOut('Signed out.'); };
window.addEventListener('beforeunload', e => { if (A.dirty && !A.fresh) { e.preventDefault(); e.returnValue = ''; } });

if (A.token) boot().catch(e => { if (e.code !== 'signin') showGate(e.message); }); else showGate('');
</script>
</body>
</html>
