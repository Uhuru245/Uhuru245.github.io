<!doctype html>
<html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Elections hub admin</title>
<style>
:root { --bg: #f6f5f1; --card: #fff; --ink: #14171c; --ink-3: #737a85; --line: #e2e0d8; --accent: #1d4e89; --ok: #1f6b4a; --bad: #9b1c1c; --warn: #8a5a00; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #0f1216; --card: #1a1f26; --ink: #eef0f3; --ink-3: #8a919c; --line: #2a3039; --accent: #8ab4ee; --ok: #7fd1a8; --bad: #f19a9a; --warn: #f0c46b; color-scheme: dark; } }
* { box-sizing: border-box; } body { margin: 0; background: var(--bg); color: var(--ink); font: 14.5px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; } h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 16px; margin: 0 0 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 12px; } .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.k { font-size: 12px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; } .v { font-size: 22px; font-weight: 700; }
input, select, textarea { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; } button { font: 600 14px system-ui; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; } button.p { background: var(--accent); color: #fff; border-color: var(--accent); }
table { width: 100%; border-collapse: collapse; font-size: 13px; } td, th { border-bottom: 1px solid var(--line); padding: 6px; text-align: left; vertical-align: top; } .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); } .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; } .muted { color: var(--ink-3); }
</style></head><body><div class="wrap"><h1>SA Elections 2026 hub: admin</h1><p class="muted">Restricted. Every action is recorded in the audit log.</p><div id="app"></div></div>
<script>
'use strict';
const API = 'https://script.google.com/macros/s/AKfycby06Dzw3hTkEJGLXwTD9LkiGxPTsIDcVENg1_rFC9bceO66gkGYlNB348o3FaxDcTdBHQ/exec', $ = s => document.querySelector(s), esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sast = d => d ? new Date(d).toLocaleString('en-ZA', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Africa/Johannesburg' }) : 'never';
let T = null; try { T = sessionStorage.getItem('el.adm'); } catch (e) {}
async function post(b) { const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ token: T }, b)) }); return r.json(); }
function login(msg) {
  $('#app').innerHTML = '<div class="card" style="max-width:420px"><h2>Sign in</h2><p class="muted">A one-time code is emailed to administrator addresses.</p><p><input id="em" type="email" placeholder="Email" autocomplete="email"></p><p id="cw" hidden><input id="cd" inputmode="numeric" placeholder="6-digit code" autocomplete="one-time-code"></p><button class="p" id="go">Send code</button><p id="m" class="muted">' + esc(msg || '') + '</p></div>';
  let step = 0; $('#go').onclick = async () => { if (!step) { const j = await post({ a: 'adminStart', email: $('#em').value }); $('#m').textContent = j.message; $('#cw').hidden = false; $('#go').textContent = 'Sign in'; step = 1; } else { const j = await post({ a: 'adminVerify', email: $('#em').value, code: $('#cd').value }); if (!j.ok) return ($('#m').textContent = j.message); T = j.token; try { sessionStorage.setItem('el.adm', T); } catch (e) {} show(); } };
}
async function act(op, extra) { const j = await post(Object.assign({ a: 'adminAction', op }, extra || {})); if (!j.ok) alert(j.message); else if (j.message) alert(j.message); else if (j.csv) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([j.csv], { type: 'text/csv' })); a.download = 'election-subscribers.csv'; a.click(); } show(); }
async function show() {
  if (!T) return login(); const s = await post({ a: 'adminStatus' }); if (!s.ok) { T = null; return login(s.message); }
  const src = s.source || {}, cls = { live: 'ok', degraded: 'warn', unavailable: 'bad' }[src.state] || 'muted';
  $('#app').innerHTML = '<div class="grid">' + [['IEC connection', '<span class="' + cls + '">' + esc(src.state || 'not run') + '</span>', s.configured ? 'Credentials set' : 'IEC_USER / IEC_PASS missing in Script Properties'], ['Last successful ingestion', sast(s.last_ok), ''], ['Failed runs (last 30)', s.failed, ''], ['Mode', esc(s.mode), s.published ? 'Published' : 'Unpublished'], ['Subscribers', s.subscribers.active, s.subscribers.pending + ' pending, ' + s.subscribers.unsubscribed + ' unsubscribed, ' + s.subscribers.bouncing + ' bouncing'], ['Emails', s.deliveries.sent + ' sent', s.deliveries.failed + ' failed · provider: ' + esc(s.provider) + (s.alerts_paused ? ' · PAUSED' : '')]].map(c => '<div class="card"><div class="k">' + c[0] + '</div><div class="v">' + c[1] + '</div><div class="muted">' + c[2] + '</div></div>').join('') + '</div>'
    + '<div class="card"><h2>Controls</h2><div class="row"><button class="p" id="rf">Refresh from IEC now</button><select id="md" style="width:auto">' + ['pre', 'live', 'final', 'archive', 'off'].map(m => '<option' + (m === s.mode ? ' selected' : '') + '>' + m + '</option>').join('') + '</select><button id="mds">Set mode</button><button id="al">' + (s.alerts_paused ? 'Resume alerts' : 'Pause alerts') + '</button><button id="pb">' + (s.published ? 'Unpublish hub' : 'Publish hub') + '</button><button id="mg">' + (s.mail_via_google ? 'Stop sending via Google account' : 'Send via Google account') + '</button><button id="ex">Export subscribers</button></div>'
    + '<div class="row" style="margin-top:12px"><span class="muted">Public figures:</span><b class="' + (s.show_figures ? 'ok' : 'warn') + '">' + (s.show_figures ? 'shown' : 'hidden until IEC permission') + '</b><button id="sf">' + (s.show_figures ? 'Hide figures' : 'Show figures (IEC agreed)') + '</button><button id="sd" style="color:var(--bad)">' + (s.shutdown ? 'Reopen hub' : 'Shut down hub') + '</button></div>'
    + '<p style="margin-top:12px"><input id="bn" placeholder="Public banner (empty to remove)" value="' + esc(s.banner || '') + '"></p><button id="bns">Save banner</button>'
    + '<p class="row" style="margin-top:12px"><span class="muted">Load history:</span>' + ['2021', '2016', '2011', '2006', '2000'].map(y => '<button data-h="' + y + '">' + y + (s.coverage[y] && s.coverage[y].national ? ' (loaded)' : '') + '</button>').join('') + '</p></div>'
    + '<div class="card"><h2>Coverage</h2><table><tr><th>Year</th><th>National</th><th>Municipalities</th><th>Seat calculations</th></tr>' + Object.keys(s.coverage).sort().reverse().map(y => '<tr><td>' + y + '</td><td>' + (s.coverage[y].national ? 'yes' : 'no') + '</td><td>' + s.coverage[y].municipalities + '</td><td>' + s.coverage[y].seats + '</td></tr>').join('') + '</table></div>'
    + '<div class="card"><h2>Recent runs</h2><table><tr><th>Started</th><th>OK</th><th>Calls</th><th>Errors</th><th>Note</th></tr>' + s.runs.slice(0, 15).map(r => '<tr><td>' + sast(r.started_at) + '</td><td class="' + (+r.ok ? 'ok' : 'bad') + '">' + (+r.ok ? 'yes' : 'no') + '</td><td>' + esc(r.calls) + '</td><td>' + esc(r.errors) + '</td><td>' + esc(r.note) + '</td></tr>').join('') + '</table></div>'
    + '<div class="card"><h2>Validation issues</h2>' + (s.issues.length ? '<table>' + s.issues.slice(0, 20).map(i => '<tr><td>' + sast(i.at) + '</td><td>' + esc(i.geo_id) + '</td><td>' + esc(i.check) + '</td><td>' + esc(i.detail) + '</td></tr>').join('') + '</table>' : '<p class="muted">None.</p>') + '</div>'
    + '<div class="card"><h2>Notification history</h2>' + (s.deliveries.recent.length ? '<table>' + s.deliveries.recent.map(d => '<tr><td>' + sast(d.at) + '</td><td>' + esc(d.kind) + '</td><td>' + esc(d.events) + ' changes</td><td class="' + (+d.ok ? 'ok' : 'bad') + '">' + (+d.ok ? 'sent' : esc(d.error)) + '</td></tr>').join('') + '</table>' : '<p class="muted">None yet.</p>') + '</div>'
    + '<div class="card"><h2>Audit log</h2><table>' + s.audit.slice(0, 25).map(a => '<tr><td>' + sast(a.at) + '</td><td>' + esc(a.actor) + '</td><td>' + esc(a.action) + '</td><td>' + esc(a.detail) + '</td></tr>').join('') + '</table></div>';
  $('#rf').onclick = async () => { $('#rf').disabled = true; $('#rf').textContent = 'Refreshing...'; await act('refresh'); };
  $('#mds').onclick = () => act('mode', { value: $('#md').value, force: $('#md').value === 'off' || $('#md').value === 'archive' ? confirm('Official results may not be complete. Switch anyway?') : false });
  $('#al').onclick = () => act('alerts', { value: s.alerts_paused }); $('#pb').onclick = () => act('publish', { value: !s.published });
  $('#mg').onclick = () => { if (!s.mail_via_google && !confirm('Alerts would be sent from the Google account that owns this script. A verified mret.co.za sender (Resend) is recommended instead. Continue?')) return; act('mail_via_google', { value: !s.mail_via_google }); };
  $('#ex').onclick = () => { const c = prompt('Exports personal data. Type EXPORT to confirm.'); if (c) act('export', { confirm: c }); };
  $('#sf').onclick = () => { if (s.show_figures) return act('show_figures', { value: false }); const c = prompt('Only do this once the IEC has given written permission. Type PERMISSION to show results publicly.'); if (c) act('show_figures', { value: true, confirm: c }); };
  $('#sd').onclick = () => { if (s.shutdown) return act('reopen'); const c = prompt('Shuts the public hub, stops the 5-minute sync and permanently erases all alert subscribers. Type SHUT DOWN to confirm.'); if (c) act('shutdown', { confirm: c }); };
  $('#bns').onclick = () => act('banner', { value: $('#bn').value });
  document.querySelectorAll('[data-h]').forEach(b => b.onclick = () => { b.disabled = true; b.textContent = 'Loading ' + b.dataset.h + '...'; act('history', { year: +b.dataset.h }); });
}
show();
</script></body></html>
