<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · MRET Universe</title>
<meta name="description" content="Sign in to MRET Universe.">
<meta property="og:title" content="Sign in · MRET Universe"><meta property="og:description" content="Sign in to MRET Universe."><meta property="og:site_name" content="MRET Universe">
<meta name="theme-color" content="#0A0A0B">
<link rel="icon" href="/universe/assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/universe/assets/uv.css">
<script src="/universe/assets/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/universe/assets/uv.js"></script>
</head>
<body>
<main id="main" class="wrap app" style="max-width:520px">
  <div id="view"><div class="skel" style="height:300px"></div></div>
</main>
<script>
(async () => {
  const { $, esc, url, sb, qs, formData, busy, C } = UV;
  const m = await UV.page({ nav: '', track: false });
  const next = qs.get('next') && qs.get('next').startsWith('/universe/') ? qs.get('next') : null;
  const go = me => location.replace(next || url(me && me.role ? 'command/' : 'dashboard/'));
  async function afterSignIn() {
    const { data } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
    if (data && data.nextLevel === 'aal2' && data.currentLevel !== 'aal2') return mfaView();
    go(await UV.me(true));
  }
  function signIn() {
    $('#view').innerHTML = `<form class="card pad-lg form" id="f"><h1 style="font-size:40px">Sign in</h1>
      <label class="f">Email address<input name="email" type="email" required autocomplete="email"></label>
      <label class="f">Password<input name="password" type="password" required autocomplete="current-password"></label>
      <p class="err" id="e" role="alert"></p><button class="btn primary">Sign in</button>
      <p class="small muted" style="margin:0"><a href="#" id="fg">Forgot your password?</a> · New here? <a href="${url('join/')}">Join free</a></p></form>`;
    $('#fg').onclick = e => { e.preventDefault(); forgot(); };
    $('#f').onsubmit = async e => { e.preventDefault(); const d = formData(e.target); $('#e').textContent = '';
      await busy(e.submitter, async () => { const { error } = await sb.auth.signInWithPassword({ email: d.email, password: d.password });
        if (error) return $('#e').textContent = error.message === 'Email not confirmed' ? 'Please confirm your email address first.' : 'That email and password do not match.'; afterSignIn(); }); };
  }
  function forgot() {
    $('#view').innerHTML = `<form class="card pad-lg form" id="f"><h1 style="font-size:36px">Reset your password</h1><p class="muted">We will email you a link to choose a new password.</p>
      <label class="f">Email address<input name="email" type="email" required autocomplete="email"></label><p class="small" id="e" role="status"></p><button class="btn primary">Send reset link</button><a href="#" id="bk" class="small">Back to sign in</a></form>`;
    $('#bk').onclick = e => { e.preventDefault(); signIn(); };
    $('#f').onsubmit = async e => { e.preventDefault(); await busy(e.submitter, async () => { await sb.auth.resetPasswordForEmail(formData(e.target).email, { redirectTo: C.site + url('login/?reset=1') });
      $('#e').textContent = 'If an account uses that address, a reset link is on its way.'; }); };
  }
  function newPassword() {
    $('#view').innerHTML = `<form class="card pad-lg form" id="f"><h1 style="font-size:36px">Choose a new password</h1><label class="f">New password <span class="hint">At least 8 characters</span><input name="password" type="password" minlength="8" required autocomplete="new-password"></label><p class="err" id="e"></p><button class="btn primary">Save password</button></form>`;
    $('#f').onsubmit = async e => { e.preventDefault(); await busy(e.submitter, async () => { const { error } = await sb.auth.updateUser({ password: formData(e.target).password }); if (error) return $('#e').textContent = error.message; UV.toast('Password updated'); afterSignIn(); }); };
  }
  async function mfaView() {
    const { data } = await sb.auth.mfa.listFactors(); const f = (data.totp || []).find(x => x.status === 'verified');
    $('#view').innerHTML = `<form class="card pad-lg form" id="f"><h1 style="font-size:36px">Two-step verification</h1><p class="muted">Enter the 6-digit code from your authenticator app.</p>
      <label class="f">Code<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code"></label><p class="err" id="e"></p><button class="btn primary">Verify</button></form>`;
    $('#f').onsubmit = async e => { e.preventDefault(); await busy(e.submitter, async () => { const { error } = await sb.auth.mfa.challengeAndVerify({ factorId: f.id, code: formData(e.target).code });
      if (error) return $('#e').textContent = 'That code did not work. Try the newest code.'; go(await UV.me(true)); }); };
  }
  sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') newPassword(); });
  if (qs.get('reset')) return newPassword();
  if (qs.get('forgot')) return forgot();
  if (m) return afterSignIn();
  signIn();
})();
</script>
</body>
</html>
