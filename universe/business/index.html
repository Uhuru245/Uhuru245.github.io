<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business · MRET Universe</title>
<meta name="description" content="A business home on MRET Universe.">
<meta property="og:title" content="Business · MRET Universe"><meta property="og:description" content="A business home on MRET Universe."><meta property="og:site_name" content="MRET Universe">
<meta name="theme-color" content="#0A0A0B">
<link rel="icon" href="/universe/assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/universe/assets/uv.css">
<script src="/universe/assets/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/universe/assets/uv.js"></script>
</head>
<body>
<main id="main"><div class="wrap app"><div class="skel" style="height:280px"></div><div class="skel" style="height:24px;width:40%"></div></div></main>
<script>
(async () => {
  const { $, esc, num, url, rpc, qs, track, ICON, waLink, safeUrl, bizCard, founding, initials, date } = UV;
  const preview = qs.get('preview') === '1';
  const slug = qs.get('s') || decodeURIComponent((location.pathname.match(/\/universe\/business\/([^\/?#]+)/) || [])[1] || '');
  if (!preview) await UV.page({ nav: 'discover/', track: false }); else document.body.classList.add('preview');
  const DAYS = [['mon', 'Monday'], ['tue', 'Tuesday'], ['wed', 'Wednesday'], ['thu', 'Thursday'], ['fri', 'Friday'], ['sat', 'Saturday'], ['sun', 'Sunday'], ['pub', 'Public holidays']];
  const SOC = { facebook: 'Facebook', instagram: 'Instagram', tiktok: 'TikTok', linkedin: 'LinkedIn', youtube: 'YouTube', x: 'X' };
  const para = t => esc(t || '').split(/\n{2,}/).map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');

  function render(b) {
    const c = b.content || {}, order = (c.order && c.order.length ? c.order : ['about', 'services', 'products', 'gallery', 'team', 'faq', 'announcements']);
    document.body.className = 'tmpl-' + (b.template || 'classic') + (preview ? ' preview' : '');
    const brand = /^#[0-9a-f]{6}$/i.test(b.brand_color || '') ? b.brand_color : null;
    const loc = [b.suburb, b.city, b.province].filter(Boolean).join(', ');
    const sec = {
      about: () => (b.description || (c.founder && c.founder.name)) ? `<section><h2>About ${esc(b.name)}</h2>${para(b.description)}
        ${c.founder && c.founder.name ? `<div class="card flat row" style="margin-top:12px;align-items:flex-start">${c.founder.photo ? `<img src="${esc(c.founder.photo)}" alt="" style="width:72px;height:72px;border-radius:50%;object-fit:cover">` : ''}<div class="grow"><p class="eyebrow">Founder</p><h3>${esc(c.founder.name)}</h3>${para(c.founder.bio)}</div></div>` : ''}</section>` : '',
      services: () => (c.services || []).length ? `<section><h2>Services</h2><div class="card">${c.services.map(s => `<div class="svc"><div><strong>${esc(s.name)}</strong>${s.description ? `<div class="muted small">${esc(s.description)}</div>` : ''}</div>${s.price ? `<div class="chip gold">${esc(s.price)}</div>` : ''}</div>`).join('')}</div></section>` : '',
      products: () => (c.products || []).length ? `<section><h2>Products</h2><div class="grid g3">${c.products.map(p => `<div class="card">${p.image ? `<img src="${esc(p.image)}" alt="" style="border-radius:10px;aspect-ratio:4/3;object-fit:cover;margin-bottom:10px" loading="lazy">` : ''}<strong>${esc(p.name)}</strong>${p.description ? `<p class="muted small" style="margin:4px 0">${esc(p.description)}</p>` : ''}${p.price ? `<span class="chip gold">${esc(p.price)}</span>` : ''}</div>`).join('')}</div></section>` : '',
      gallery: () => (c.gallery || []).length ? `<section><h2>Portfolio</h2><div class="gallery">${c.gallery.map(g => `<a href="${esc(g.url)}" target="_blank" rel="noopener"><img src="${esc(g.url)}" alt="${esc(g.caption || '')}" loading="lazy"></a>`).join('')}</div></section>` : '',
      team: () => (c.team || []).length ? `<section><h2>Team</h2><div class="grid g3">${c.team.map(m => `<div class="card row" style="align-items:center">${m.photo ? `<img src="${esc(m.photo)}" alt="" style="width:56px;height:56px;border-radius:50%;object-fit:cover">` : `<span class="logo" style="width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--bg-2);font:400 22px var(--f-serif)">${initials(m.name)}</span>`}<div><strong>${esc(m.name)}</strong><div class="muted small">${esc(m.role || '')}</div></div></div>`).join('')}</div></section>` : '',
      faq: () => (c.faq || []).length ? `<section><h2>Questions</h2>${c.faq.map(f => `<details class="faq"><summary>${esc(f.q)}</summary>${para(f.a)}</details>`).join('')}</section>` : '',
      announcements: () => (c.announcements || []).length ? `<section><h2>News</h2>${c.announcements.map(a => `<div class="card" style="margin-bottom:10px"><p class="tiny muted">${esc(date(a.date))}</p><strong>${esc(a.title)}</strong>${para(a.body)}</div>`).join('')}</section>` : '',
      testimonials: () => (c.testimonials || []).length ? `<section><h2>What customers say</h2><p class="tiny muted">Shared by ${esc(b.name)}.</p><div class="grid g2">${c.testimonials.map(t => `<blockquote class="card" style="margin:0"><p class="serif" style="font-size:20px">“${esc(t.quote)}”</p><p class="small muted" style="margin:0">${esc(t.name)}</p></blockquote>`).join('')}</div></section>` : ''
    };
    const hours = b.hours && Object.keys(b.hours).length ? `<div class="card"><h3>Hours</h3><dl class="kv">${DAYS.filter(([k]) => b.hours[k]).map(([k, l]) => `<dt>${l}</dt><dd>${esc(b.hours[k])}</dd>`).join('')}</dl></div>` : '';
    const web = safeUrl(b.website || '');
    const socials = Object.entries(b.socials || {}).map(([k, v]) => [k, safeUrl(v)]).filter(([, v]) => v);
    $('#main').innerHTML = `<div class="bh"><div class="cover" ${brand && !b.cover_url ? `style="background:linear-gradient(135deg, ${brand}, #191B20)"` : ''}>${b.cover_url ? `<img src="${esc(b.cover_url)}" alt="">` : ''}</div>
      <div class="wrap"><div class="idrow"><div class="blogo">${b.logo_url ? `<img src="${esc(b.logo_url)}" alt="${esc(b.name)} logo">` : initials(b.name)}</div>
        <div class="grow" style="padding-bottom:6px;min-width:240px"><h1 style="font-size:clamp(34px,5vw,56px);margin:0">${esc(b.name)}</h1></div></div>
        ${b.tagline ? `<p class="lead muted" style="margin:10px 0 0;font-size:18px">${esc(b.tagline)}</p>` : ''}
        <div class="chips" style="margin-top:12px">${b.category ? `<a class="chip" href="${url('discover/?category=' + b.category.slug)}">${esc(b.category.name)}</a>` : ''}
          ${b.verified ? `<span class="chip ok" title="MRET has verified this business">${ICON.check} Verified</span>` : ''}${b.founding_no ? `<a class="chip gold" href="${url('founding-1000/?cert=' + encodeURIComponent(b.slug))}">${ICON.star} ${founding(b.founding_no)}</a>` : ''}</div></div></div>
      <div class="wrap bpage"><div class="stack">${loc ? `<p class="row muted small" style="gap:6px">${ICON.pin.replace('<svg', '<svg width="16" height="16"')} ${esc(loc)}${b.founded_year ? ' · Since ' + esc(b.founded_year) : ''}</p>` : ''}
        ${order.map(k => sec[k] ? sec[k]() : '').join('')}${!order.includes('testimonials') ? sec.testimonials() : ''}
        ${(b.service_areas || []).length ? `<section><h2>Areas served</h2><div class="chips">${b.service_areas.map(a => `<a class="chip" href="${url('discover/?city=' + encodeURIComponent(a))}">${esc(a)}</a>`).join('')}</div></section>` : ''}
        <div id="rel"></div></div>
      <aside><div class="card raised stack contact"><h3>Contact ${esc(b.name)}</h3>
        ${b.whatsapp ? `<a class="btn gold" data-ev="whatsapp_clicked" href="${waLink(b.whatsapp, 'Hi ' + b.name + ', I found you on MRET Universe.')}" target="_blank" rel="noopener">${ICON.wa} WhatsApp</a>` : ''}
        ${b.phone ? `<a class="btn" data-ev="phone_clicked" href="tel:${esc(b.phone.replace(/[^\d+]/g, ''))}">${ICON.phone} ${esc(b.phone)}</a>` : ''}
        ${b.email ? `<a class="btn" data-ev="email_clicked" href="mailto:${esc(b.email)}">${ICON.mail} Email</a>` : ''}
        ${web ? `<a class="btn" data-ev="website_clicked" href="${esc(web)}" target="_blank" rel="noopener nofollow">${ICON.globe} Website</a>` : ''}
        ${c.booking_url && safeUrl(c.booking_url) ? `<a class="btn primary" data-ev="website_clicked" href="${esc(safeUrl(c.booking_url))}" target="_blank" rel="noopener nofollow">Book now</a>` : ''}
        ${socials.length ? `<div class="chips">${socials.map(([k, v]) => `<a class="chip" href="${esc(v)}" target="_blank" rel="noopener nofollow">${SOC[k] || esc(k)}</a>`).join('')}</div>` : ''}</div>
        <form class="card form" id="enq"><h3>Send an enquiry</h3>
          <label class="f">Your name<input name="name" required maxlength="80" autocomplete="name"></label>
          <div class="two"><label class="f">Email<input name="email" type="email" autocomplete="email"></label><label class="f">Phone<input name="phone" type="tel" maxlength="20" autocomplete="tel"></label></div>
          <label class="f">Message<textarea name="message" required minlength="5" maxlength="2000"></textarea></label>
          <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
          <p class="tiny muted" style="margin:0">Your details go only to ${esc(b.name)} so they can reply. <a href="${url('privacy/')}">Privacy</a></p>
          <p class="err" id="enqErr" role="alert"></p><button class="btn primary" type="submit">Send enquiry</button></form>
        ${hours}
        <div class="card stack"><h3>Share</h3><div id="qr" style="display:grid;place-items:center;background:#fff;border-radius:10px;padding:10px"></div>
          <div class="row"><button class="btn sm" id="shareBtn">${ICON.share} Share</button><button class="btn sm" id="qrDl">Download QR</button><button class="btn sm ghost right" id="rep">${ICON.flag} Report</button></div></div></aside></div>`;
    // SEO
    document.title = b.name + (b.city ? ' · ' + b.city : '') + ' · MRET Universe';
    const desc = (b.tagline || b.description || '').slice(0, 155);
    const setMeta = (sel, attr, val) => { let m = document.querySelector(sel); if (m) m.setAttribute(attr, val); };
    setMeta('meta[name="description"]', 'content', desc); setMeta('meta[property="og:title"]', 'content', b.name); setMeta('meta[property="og:description"]', 'content', desc);
    if (!preview) {
      const ld = { '@context': 'https://schema.org', '@type': 'LocalBusiness', name: b.name, description: desc, url: UV.C.site + UV.bizUrl(b.slug), telephone: b.phone || undefined, image: b.cover_url || b.logo_url || undefined,
        address: { '@type': 'PostalAddress', addressLocality: b.city || undefined, addressRegion: b.province || undefined, addressCountry: 'ZA' } };
      const s = document.createElement('script'); s.type = 'application/ld+json'; s.textContent = JSON.stringify(ld); document.head.appendChild(s);
    }
    return b;
  }

  function wire(b) {
    const link = UV.C.site + UV.bizUrl(b.slug);
    UV.qr($('#qr'), link + '?utm_source=qr&utm_medium=print', 160).catch(() => $('#qr').remove());
    $('#shareBtn').onclick = () => UV.share(b.name + ' on MRET Universe', link + '?utm_source=share');
    $('#qrDl').onclick = () => { const img = $('#qr img') || $('#qr canvas'); if (!img) return; const a = document.createElement('a'); a.download = b.slug + '-qr.png'; a.href = img.src || img.toDataURL(); a.click(); track('qr_downloaded', {}, b.slug); };
    UV.$$('[data-ev]').forEach(a => a.addEventListener('click', () => track(a.dataset.ev, {}, b.slug)));
    $('#rep').onclick = () => { const d = UV.dialog('Report this page', `<form class="form" id="rf"><p class="muted small">Tell MRET what is misleading or wrong. Reports are reviewed by a moderator.</p><label class="f">What is wrong?<textarea name="reason" required minlength="3" maxlength="1000"></textarea></label><p class="err" id="rfe"></p><button class="btn primary">Send report</button></form>`);
      UV.$('#rf', d).onsubmit = async e => { e.preventDefault(); try { await rpc('uv_report', { p_type: 'business', p_target: b.id, p_reason: UV.formData(e.target).reason, p_anon: UV.anon() }); d.close(); UV.toast('Thank you. A moderator will review it.'); } catch (x) { UV.$('#rfe', d).textContent = x.message; } }; };
    $('#enq').onsubmit = async e => { e.preventDefault(); const d = UV.formData(e.target); $('#enqErr').textContent = '';
      await UV.busy(e.submitter, async () => { try { await rpc('uv_enquire', { p: Object.assign(d, { business: b.slug, anon_id: UV.anon() }) });
        e.target.innerHTML = `<h3>Enquiry sent</h3><p class="muted">${esc(b.name)} will reply to you directly.${b.whatsapp ? ' For a faster answer, message them on WhatsApp.' : ''}</p>`; } catch (x) { $('#enqErr').textContent = x.message; } }); };
    const rel = [...(b.complementary || []).map(x => Object.assign(x, { _k: 'c' })), ...(b.similar || [])];
    if (rel.length) $('#rel').innerHTML = `${(b.complementary || []).length ? `<section><h2>Works well with</h2><p class="muted small">Businesses whose services complement ${esc(b.name)}.</p><div class="grid g2">${b.complementary.map(bizCard).join('')}</div></section>` : ''}
      ${(b.similar || []).length ? `<section style="margin-top:24px"><h2>Similar businesses</h2><div class="grid g2">${b.similar.map(bizCard).join('')}</div></section>` : ''}`;
  }

  if (preview) {
    window.addEventListener('message', e => { if (e.origin !== location.origin || !e.data || e.data.type !== 'uv-preview') return; render(e.data.data); UV.$$('a').forEach(a => a.addEventListener('click', ev => ev.preventDefault())); UV.$$('form').forEach(f => f.onsubmit = ev => ev.preventDefault()); });
    parent.postMessage({ type: 'uv-preview-ready' }, location.origin);
    return;
  }
  if (!slug) { location.replace(url('discover/')); return; }
  const b = await rpc('uv_business_public', { p_slug: slug }).catch(() => null);
  if (!b) { $('#main').innerHTML = `<div class="wrap app"><div class="empty"><h3>This business home is not available.</h3><p>It may not be published yet, or the address may have changed.</p><a class="btn" href="${url('discover/')}">Discover businesses</a></div></div>`; document.title = 'Not found · MRET Universe'; return; }
  render(b); wire(b); track('profile_viewed', {}, b.slug);
})();
</script>
</body>
</html>
