<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discover businesses · MRET Universe</title>
<meta name="description" content="Search South African businesses by service, industry and location. Browse free, contact businesses directly.">
<meta property="og:title" content="Discover businesses · MRET Universe"><meta property="og:description" content="Search South African businesses by service, industry and location. Browse free, contact businesses directly."><meta property="og:site_name" content="MRET Universe">
<meta name="theme-color" content="#0A0A0B">
<link rel="icon" href="/universe/assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/universe/assets/uv.css">
<script src="/universe/assets/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/universe/assets/uv.js"></script>
</head>
<body>
<main id="main" class="wrap app">
  <div class="app-head"><div><p class="eyebrow">Universe Discover</p><h1 id="h">Discover businesses</h1></div></div>
  <form class="search" id="sf" role="search" autocomplete="off" style="box-shadow:none">
    <label class="sr" for="q">Search</label><input id="q" name="q" placeholder="Service, product or business name">
    <label class="sr" for="cat">Industry</label><select id="cat" name="category"><option value="">All industries</option></select>
    <button class="btn primary" type="submit">Search</button>
    <div class="suggest hide" id="sug"></div>
  </form>
  <div class="row small">
    <label class="sr" for="prov">Province</label><select id="prov" style="width:auto;min-height:38px"><option value="">All provinces</option></select>
    <label class="sr" for="city">City or area</label><input id="city" placeholder="City or area" style="width:180px;min-height:38px">
    <label class="check" style="align-items:center"><input type="checkbox" id="ver"> Verified only</label>
    <span class="muted right" id="count" aria-live="polite"></span>
  </div>
  <div id="note"></div>
  <div class="grid g3" id="res"></div>
  <div class="row" style="justify-content:center"><button class="btn hide" id="more">Show more</button></div>
  <div class="card" style="margin-top:12px"><div class="row"><div class="grow"><h3>Run a business?</h3><p class="muted small" style="margin:0">Create a free business home and be found by customers searching here.</p></div><a class="btn gold" href="/universe/join/">Join free</a></div></div>
</main>
<script>
(async () => {
  const { $, esc, num, url, rpc, qs, categories, bizCard, PROVINCES } = UV;
  await UV.page({ nav: 'discover/', flag: 'discover' });
  const cats = await categories().catch(() => []);
  $('#cat').innerHTML += cats.map(c => `<option value="${c.slug}">${esc(c.name)}</option>`).join('');
  $('#prov').innerHTML += PROVINCES.map(p => `<option>${p}</option>`).join('');
  $('#q').value = qs.get('q') || ''; $('#cat').value = qs.get('category') || ''; $('#prov').value = qs.get('province') || ''; $('#city').value = qs.get('city') || ''; $('#ver').checked = qs.get('verified') === '1';
  let page = 1, shown = 0;
  function title() {
    const c = cats.find(x => x.slug === $('#cat').value), city = $('#city').value.trim();
    const t = (c ? c.name : 'Businesses') + (city ? ' in ' + city : $('#prov').value ? ' in ' + $('#prov').value : '');
    $('#h').textContent = c || city || $('#prov').value ? t : 'Discover businesses';
    document.title = (c || city ? t + ' · ' : 'Discover businesses · ') + 'MRET Universe';
  }
  async function run(more) {
    page = more ? page + 1 : 1;
    const p = { p_q: $('#q').value.trim() || null, p_category: $('#cat').value || null, p_province: $('#prov').value || null, p_city: $('#city').value.trim() || null, p_verified: $('#ver').checked, p_page: page, p_anon: UV.anon() };
    if (!more) { $('#res').innerHTML = '<div class="skel" style="height:220px"></div>'.repeat(3); $('#note').innerHTML = ''; }
    const u = new URLSearchParams(); ['q', 'category', 'province', 'city'].forEach((k, i) => { const v = [p.p_q, p.p_category, p.p_province, p.p_city][i]; if (v) u.set(k, v); }); if (p.p_verified) u.set('verified', '1');
    history.replaceState(null, '', '?' + u.toString()); title();
    try {
      const r = await rpc('uv_search', p);
      if (!more) { $('#res').innerHTML = ''; shown = 0; }
      $('#res').insertAdjacentHTML('beforeend', r.results.map(bizCard).join('')); shown += r.results.length;
      $('#count').textContent = r.total ? `${num(r.total)} business${r.total === 1 ? '' : 'es'}` : '';
      $('#more').classList.toggle('hide', shown >= r.total);
      if (!r.total) {
        $('#res').innerHTML = `<div class="empty" style="grid-column:1/-1"><h3>No businesses match yet.</h3><p>${p.p_q ? `We have noted that people are looking for “${esc(p.p_q)}”${p.p_city ? ' in ' + esc(p.p_city) : ''}. It helps MRET see where businesses are needed.` : 'Try a different industry or area.'}</p>
          ${r.suggestion ? `<p>Did you mean <a href="?category=${esc(cats.find(c => c.name === r.suggestion)?.slug || '')}">${esc(r.suggestion)}</a>?</p>` : ''}<a class="btn" href="${url('join/')}">Know a business that should be here? Invite them</a></div>`;
      }
    } catch (e) { $('#res').innerHTML = `<div class="notice bad" style="grid-column:1/-1">${esc(e.message)}</div>`; }
  }
  $('#sf').onsubmit = e => { e.preventDefault(); $('#sug').classList.add('hide'); run(); };
  ['#cat', '#prov', '#ver'].forEach(s => $(s).onchange = () => run());
  $('#city').addEventListener('change', () => run());
  $('#more').onclick = () => run(true);
  let t; $('#q').addEventListener('input', () => { clearTimeout(t); t = setTimeout(async () => { const v = $('#q').value.trim(); if (v.length < 2) return $('#sug').classList.add('hide');
    const s = await rpc('uv_suggest', { p_q: v }).catch(() => []); $('#sug').innerHTML = s.map(x => `<button type="button" data-t="${x.type}" data-v="${esc(x.value)}">${esc(x.label)}<span class="k">${x.type === 'category' ? 'Industry' : 'Business'}</span></button>`).join(''); $('#sug').classList.toggle('hide', !s.length); }, 180); });
  $('#sug').onclick = e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.t === 'category') { $('#cat').value = b.dataset.v; $('#q').value = ''; $('#sug').classList.add('hide'); run(); } else location.href = UV.bizUrl(b.dataset.v); };
  document.addEventListener('click', e => { if (!e.target.closest('#sf')) $('#sug').classList.add('hide'); });
  run();
})();
</script>
</body>
</html>
