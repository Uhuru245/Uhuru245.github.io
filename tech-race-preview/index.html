/* KW EDGE TECH RACE · THE DIGITAL CHAMPIONSHIP · design system "Grid"
   Dark racing theme first, light theme second. Class names are shared with the app code: restyle, never rename. */
:root {
  --kw-red: #ba0c2f; --kw-red-2: #e0163f; --black: #08090b; --carbon: #202329; --surface-d: #14161a; --white: #f5f5f5;
  --gold: #d4af37; --silver: #bcc4cc; --bronze: #b88457; --pos: #35ce84; --neg: #f05252;
  --bg: #08090b; --bg-2: #0e1013; --card: #14161a; --card-2: #1a1d22; --ink: #f5f5f5; --ink-2: #c3c7cd; --ink-3: #8b9099; --line: #24272e; --line-2: #33373f;
  --char: #08090b; --char-2: #14161a; --red: #ba0c2f; --red-2: #e0163f; --red-bg: rgba(186, 12, 47, .16); --red-ink: #ff5a78;
  --ok: #35ce84; --ok-bg: rgba(53, 206, 132, .13); --warn: #f2b84b; --warn-bg: rgba(242, 184, 75, .13); --blue: #9cc3ff; --blue-bg: rgba(120, 170, 255, .12);
  --r: 4px; --cut: 14px;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; --race: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --carbon-tex: repeating-linear-gradient(45deg, rgba(255,255,255,.022) 0 2px, transparent 2px 4px), repeating-linear-gradient(-45deg, rgba(0,0,0,.25) 0 2px, transparent 2px 4px);
  --stripes: repeating-linear-gradient(-60deg, var(--red) 0 10px, transparent 10px 20px);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f4f4f2; --bg-2: #eceae6; --card: #ffffff; --card-2: #f7f7f5; --ink: #101114; --ink-2: #3c4048; --ink-3: #6f747d; --line: #e3e2de; --line-2: #cfcdc7;
  --char: #101114; --char-2: #202329; --red-bg: rgba(186, 12, 47, .08); --red-ink: #ba0c2f;
  --ok: #138a52; --ok-bg: rgba(19, 138, 82, .1); --warn: #8a5a00; --warn-bg: rgba(214, 150, 20, .14); --blue: #24507a; --blue-bg: rgba(36, 80, 122, .09);
  --carbon-tex: repeating-linear-gradient(45deg, rgba(0,0,0,.025) 0 2px, transparent 2px 4px);
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; line-height: 1.15; }
h1 { font: italic 800 34px/1 var(--race); letter-spacing: .01em; text-transform: uppercase; }
h2 { font: italic 700 21px/1.1 var(--race); letter-spacing: .03em; text-transform: uppercase; }
h3 { font: 700 15px/1.3 var(--sans); }
a { color: var(--red-ink); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--red-2); outline-offset: 2px; }
.muted { color: var(--ink-3); } .small { font-size: 13px; } .num { font-variant-numeric: tabular-nums; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 18px; border-radius: 2px; border: 1px solid var(--line-2); background: transparent; font: 700 13px/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; cursor: pointer; text-decoration: none; color: var(--ink); white-space: nowrap; transition: background .15s, border-color .15s, transform .1s; }
.btn:hover { border-color: var(--ink-3); background: var(--card-2); }
.btn:active { transform: translateY(1px); }
.btn.red { background: var(--red); border-color: var(--red); color: #fff; clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); padding: 0 24px; }
.btn.red:hover { background: var(--red-2); border-color: var(--red-2); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.sm { min-height: 32px; padding: 0 12px; font-size: 11.5px; }
.btn.red.sm { padding: 0 18px; }
.btn.big { min-height: 56px; font: italic 800 20px var(--race); letter-spacing: .08em; text-transform: uppercase; width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.link { border: 0; background: none; color: var(--red-ink); padding: 0; min-height: 0; text-transform: none; letter-spacing: 0; font-weight: 600; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; margin-bottom: 14px; position: relative; }
.card > h2 { margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
.card > h2::before { content: ''; width: 18px; height: 12px; background: var(--stripes); flex: none; transform: skewX(-20deg); }
.row { display: flex; align-items: center; gap: 10px; }
.grid { display: grid; gap: 12px; } .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px 15px; position: relative; overflow: hidden; }
.kpi::after { content: ''; position: absolute; right: -1px; top: -1px; width: 26px; height: 26px; background: linear-gradient(225deg, var(--red) 0 50%, transparent 50%); opacity: .9; }
.kpi .l { font: 700 11px/1.2 var(--sans); color: var(--ink-3); text-transform: uppercase; letter-spacing: .14em; padding-right: 22px; }
.kpi .v { font: italic 800 36px/1 var(--race); margin-top: 8px; letter-spacing: .01em; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; }
.tag { display: inline-flex; align-items: center; gap: 4px; font: 700 10.5px/1 var(--sans); padding: 5px 8px; border-radius: 2px; background: var(--card-2); color: var(--ink-2); white-space: nowrap; text-transform: uppercase; letter-spacing: .1em; border: 1px solid var(--line-2); }
.tag.not_started { } .tag.in_progress { background: var(--blue-bg); color: var(--blue); border-color: transparent; } .tag.submitted { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.tag.needs_improvement, .tag.overdue { background: var(--red-bg); color: var(--red-ink); border-color: transparent; } .tag.verified { background: var(--ok-bg); color: var(--ok); border-color: transparent; } .tag.locked { color: var(--ink-3); }
.alert { border-radius: 2px; padding: 12px 14px; margin-bottom: 12px; font-size: 14px; border-left: 3px solid currentColor; }
.alert.ok { background: var(--ok-bg); color: var(--ok); } .alert.bad { background: var(--red-bg); color: var(--red-ink); } .alert.warn { background: var(--warn-bg); color: var(--warn); } .alert.info { background: var(--blue-bg); color: var(--blue); }
label.f { display: grid; gap: 6px; font-weight: 600; font-size: 13px; color: var(--ink-2); }
label.f .hint { font-weight: 400; color: var(--ink-3); font-size: 12.5px; }
input[type=text], input[type=email], input[type=password], input[type=tel], input[type=date], input[type=number], input[type=url], select, textarea { width: 100%; min-height: 44px; border: 1px solid var(--line-2); border-radius: 2px; padding: 9px 12px; background: var(--bg-2); color: var(--ink); font-weight: 400; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--red-2); box-shadow: 0 0 0 3px var(--red-bg); }
textarea { min-height: 96px; resize: vertical; }
.check { display: flex; gap: 10px; align-items: flex-start; font-weight: 500; cursor: pointer; }
.check input { width: 20px; height: 20px; margin-top: 1px; accent-color: var(--red); flex: none; }
.form { display: grid; gap: 14px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font: 700 10.5px/1 var(--sans); text-transform: uppercase; letter-spacing: .14em; color: var(--ink-3); background: var(--card-2); }
td.num, th.num { text-align: right; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--card-2); }
.tablebox { overflow-x: auto; }
.empty { padding: 28px; text-align: center; color: var(--ink-3); border: 1px dashed var(--line-2); border-radius: 2px; }

/* brand lockup */
.brand { font: italic 800 30px/.9 var(--race); letter-spacing: .02em; text-transform: uppercase; color: var(--white); text-decoration: none; display: inline-flex; align-items: center; gap: 12px; }
.brand i { color: var(--red-2); font-style: italic; }
.brand .mk { width: 34px; height: 26px; flex: none; background: var(--red); clip-path: polygon(30% 0, 100% 0, 70% 100%, 0 100%); position: relative; }
.brand .mk::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 5px, rgba(0,0,0,.35) 5px 7px); }
.brand small { display: block; font: 700 9.5px/1 var(--sans); letter-spacing: .32em; color: var(--ink-3); font-style: normal; margin-top: 5px; }
.tagline { font: italic 700 26px/1.1 var(--race); text-transform: uppercase; letter-spacing: .04em; color: var(--white); max-width: 18ch; }

/* sign-in */
.auth { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); background: var(--bg); }
.auth-side { background: var(--carbon-tex), radial-gradient(70% 60% at 0% 0%, rgba(186, 12, 47, .35), transparent 60%), #08090b; color: var(--white); padding: 48px 52px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; border-right: 1px solid #24272e; }
.auth-side::before { content: ''; position: absolute; left: -10%; right: -10%; top: 50%; height: 80px; background: repeating-linear-gradient(-60deg, rgba(186, 12, 47, .9) 0 18px, transparent 18px 36px); transform: skewY(-8deg); opacity: .55; }
.auth-side::after { content: 'P1'; position: absolute; right: 24px; top: 30%; font: italic 800 220px/1 var(--race); color: rgba(255,255,255,.04); letter-spacing: -.02em; }
.auth-side > * { position: relative; z-index: 1; }
.auth-side .big-title { font: italic 800 clamp(56px, 7vw, 104px)/.86 var(--race); text-transform: uppercase; letter-spacing: -.005em; margin: 30px 0 14px; }
.auth-side .big-title i { color: var(--red-2); font-style: italic; display: block; }
.auth-side .champ { font: 700 12px/1 var(--sans); letter-spacing: .38em; color: #9aa0a8; text-transform: uppercase; }
.auth-main { display: grid; place-items: center; padding: 32px 18px; background: var(--bg); }
.auth-box { width: 100%; max-width: 400px; }
.auth-box h1 { margin-bottom: 8px; }
.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin: 18px 0; overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 11px 0; font: 700 12px var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--red); }

/* shell */
.top { position: sticky; top: 0; z-index: 30; background: #08090b; color: #fff; display: flex; align-items: center; gap: 14px; padding: 0 18px; height: 64px; border-bottom: 1px solid #24272e; }
.top::after { content: ''; position: absolute; left: 0; right: 0; bottom: -3px; height: 3px; background: linear-gradient(90deg, var(--red) 0 30%, transparent 30%); }
.top .brand { font-size: 24px; margin-right: auto; color: #fff; }
.top .bell, .top .tb { position: relative; background: none; border: 1px solid transparent; color: #fff; cursor: pointer; padding: 7px; border-radius: 2px; display: grid; place-items: center; }
.top .bell:hover, .top .tb:hover { border-color: #33373f; }
.top .bell b { position: absolute; top: 0; right: -2px; background: var(--red-2); color: #fff; font-size: 10.5px; min-width: 17px; height: 17px; border-radius: 2px; display: grid; place-items: center; }
.top .who { font: 600 13px var(--sans); color: #a8adb5; }
.top .tv { font: 700 11px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: #fff; background: none; border: 1px solid #33373f; padding: 9px 12px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.top .tv:hover { border-color: var(--red-2); }
.top .tv i { width: 7px; height: 7px; border-radius: 50%; background: var(--red-2); box-shadow: 0 0 0 3px rgba(224, 22, 63, .25); }
.shell { display: grid; grid-template-columns: 244px minmax(0, 1fr); min-height: calc(100vh - 64px); }
.side { background: var(--bg-2); border-right: 1px solid var(--line); padding: 16px 12px; }
.side button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; padding: 11px 12px; border-radius: 2px; cursor: pointer; font: 600 13.5px var(--sans); color: var(--ink-2); position: relative; }
.side button:hover { background: var(--card); color: var(--ink); }
.side button[aria-current="page"] { background: var(--card); color: var(--ink); }
.side button[aria-current="page"]::before { content: ''; position: absolute; left: -12px; top: 6px; bottom: 6px; width: 4px; background: var(--red); }
.side .sep { font: 700 10px/1 var(--sans); text-transform: uppercase; letter-spacing: .24em; color: var(--ink-3); padding: 20px 12px 8px; }
.main { padding: 26px clamp(14px, 3vw, 36px) 100px; max-width: 1240px; width: 100%; }
.ph { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; padding-bottom: 16px; border-bottom: 1px solid var(--line); position: relative; }
.ph::after { content: ''; position: absolute; left: 0; bottom: -2px; width: 64px; height: 3px; background: var(--red); }
.ph p { margin: 6px 0 0; color: var(--ink-2); max-width: 70ch; }
.bottom { display: none; }

/* driver hero (agent home) */
.hero { background: var(--carbon-tex), linear-gradient(105deg, #14161a 0 58%, #1b0a10 100%); color: #fff; border: 1px solid #24272e; border-radius: var(--r); padding: 26px 28px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 26px; align-items: center; position: relative; overflow: hidden; margin-bottom: 14px; }
.hero::before { content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 38%; background: repeating-linear-gradient(-60deg, rgba(186, 12, 47, .55) 0 14px, transparent 14px 28px); clip-path: polygon(30% 0, 100% 0, 100% 100%, 0 100%); opacity: .5; }
.hero > * { position: relative; z-index: 1; }
.hero h1 { color: #fff; font-size: 54px; }
.hero .lvl { display: inline-flex; gap: 10px; align-items: center; margin-top: 10px; font-size: 13px; color: #c3c7cd; }
.hero .lvl b { background: var(--red); color: #fff; padding: 4px 10px; font: 700 11px var(--sans); letter-spacing: .14em; text-transform: uppercase; clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%); }
.hero .pnum { text-align: right; font: italic 800 110px/.8 var(--race); color: #fff; letter-spacing: -.02em; }
.hero .pnum small { display: block; font: normal 700 11px/1 var(--sans); letter-spacing: .3em; text-transform: uppercase; color: #a8adb5; margin-bottom: 8px; }
.hero .pnum span { color: var(--red-2); font-size: .5em; vertical-align: top; }
.ring { width: 118px; height: 118px; position: relative; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .c { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ring .c b { font: italic 800 32px/1 var(--race); display: block; }
.ring .c span { font: 700 9.5px var(--sans); text-transform: uppercase; letter-spacing: .16em; color: #a8adb5; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.next { border: 1px solid var(--line-2); border-left: 4px solid var(--red); border-radius: var(--r); background: var(--card); padding: 18px 20px; margin-bottom: 14px; position: relative; overflow: hidden; }
.next::after { content: ''; position: absolute; right: 0; top: 0; width: 120px; height: 100%; background: repeating-linear-gradient(-60deg, var(--red-bg) 0 8px, transparent 8px 16px); }
.next > * { position: relative; z-index: 1; }
.next .k { font: italic 700 14px var(--race); color: var(--red-ink); letter-spacing: .2em; text-transform: uppercase; }
.next h2 { font-size: 26px; margin: 4px 0 6px; }
.path { list-style: none; margin: 0; padding: 0; position: relative; }
.path::before { content: ''; position: absolute; left: 19px; top: 18px; bottom: 18px; width: 3px; background: repeating-linear-gradient(var(--line-2) 0 8px, transparent 8px 14px); }
.path li { position: relative; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; cursor: pointer; }
.path .dot { width: 40px; height: 40px; display: grid; place-items: center; font: italic 800 17px var(--race); background: var(--line); border: 0; color: var(--ink-2); z-index: 1; clip-path: polygon(20% 0, 100% 0, 80% 100%, 0 100%); }
.path li.verified .dot { background: var(--ok); border-color: var(--ok); color: #08090b; }
.path li.submitted .dot { background: var(--warn); color: #08090b; }
.path li.in_progress .dot, .path li.needs_improvement .dot, .path li.overdue .dot { background: var(--red); border-color: var(--red); color: #fff; }
.path li.locked { cursor: default; opacity: .55; }
.path .t { font-weight: 700; } .path .d { font-size: 12.5px; color: var(--ink-3); }
.badges { display: flex; flex-wrap: wrap; gap: 10px; }
.badge { display: flex; gap: 12px; align-items: center; background: var(--card-2); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; min-width: 200px; flex: 1 1 200px; }
.badge .ic { width: 42px; height: 42px; background: linear-gradient(145deg, #f0d77a, var(--gold) 55%, #8e7220); color: #08090b; display: grid; place-items: center; font: italic 800 16px var(--race); flex: none; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
.badge.off { opacity: .45; } .badge.off .ic { background: var(--line-2); }
.bar { height: 6px; background: var(--line); border-radius: 0; overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--red), var(--red-2)); }
.steps { margin: 0; padding-left: 20px; } .steps li { margin: 4px 0; }
.lesson { border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 8px; background: var(--card-2); }
.lesson summary { padding: 13px 14px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; align-items: center; font-weight: 600; list-style: none; }
.lesson summary::-webkit-details-marker { display: none; }
.lesson .in { padding: 0 14px 14px; }
.q { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin-bottom: 10px; background: var(--card-2); }
.q .opts { display: grid; gap: 6px; margin-top: 8px; }
.q.right { border-color: var(--ok); } .q.wrong { border-color: var(--neg); }

/* standings */
.seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); padding: 3px; gap: 2px; border-radius: 2px; }
.seg button { border: 0; background: none; padding: 9px 14px; font: 700 11.5px var(--sans); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; color: var(--ink-3); border-radius: 2px; }
.seg button[aria-pressed="true"] { background: var(--red); color: #fff; }
.lb { list-style: none; margin: 0; padding: 0; }
.lb li { display: grid; grid-template-columns: 64px 46px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 10px 12px 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; position: relative; transition: background .15s; }
.lb li:hover { background: var(--card-2); }
.lb li::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; background: transparent; }
.lb li.r1::before { background: var(--gold); } .lb li.r2::before { background: var(--silver); } .lb li.r3::before { background: var(--bronze); }
.lb li.me { background: var(--red-bg); } .lb li.me::after { content: 'YOU'; position: absolute; right: 8px; top: 6px; font: 700 9px var(--sans); letter-spacing: .2em; color: var(--red-ink); }
.lb .rk { font: italic 800 34px/1 var(--race); text-align: center; color: var(--ink); font-variant-numeric: tabular-nums; }
.lb li.r1 .rk { color: var(--gold); } .lb li.r2 .rk { color: var(--silver); } .lb li.r3 .rk { color: var(--bronze); }
.lb li.pace { background: repeating-linear-gradient(-60deg, rgba(120, 170, 255, .06) 0 10px, transparent 10px 20px); outline: 1px dashed var(--blue); outline-offset: -1px; cursor: default; }
.lb li.pace::before { background: var(--blue); } .lb li.pace .rk { font-size: 15px; color: var(--blue); letter-spacing: .08em; } .lb li.pace .av { background: var(--blue); color: #08090b; }
.pacetag { display: inline-block; margin-left: 8px; padding: 3px 7px; font: 700 9.5px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; background: var(--blue); color: #08090b; vertical-align: 2px; }

    if (f1Pass.done || store.get('tr.sound') === 'off') return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ctx = f1Pass.ctx || (f1Pass.ctx = new AC());
    f1Unlock();
    const start = () => { if (f1Pass.done || ctx.state !== 'running') return; f1Pass.done = true; if (f1Arm.off) f1Arm.off();
      const comp = ctx.createDynamicsCompressor(); comp.connect(ctx.destination); f1Build(ctx, comp, ctx.currentTime + 0.05); };
    if (ctx.state === 'running') start(); else { const r = ctx.resume(); if (r && r.then) r.then(start).catch(() => {}); setTimeout(start, 120); }
  } catch (e) {}
}
/* Once every time the page loads: straight away if the browser allows sound, otherwise on the first tap, click or key press
   (pointerup, touchend and click are the events phones accept for starting sound). */
function f1Arm() {
  if (f1Pass.done || f1Arm.on || store.get('tr.sound') === 'off') return; f1Arm.on = true;
  const EV = ['pointerup', 'touchend', 'click', 'keydown'], go = () => f1Pass();
  f1Arm.off = () => EV.forEach(ev => removeEventListener(ev, go, true));
  EV.forEach(ev => addEventListener(ev, go, true));
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ctx = f1Pass.ctx || (f1Pass.ctx = new AC());
    if (ctx.state === 'running') return f1Pass();
    const r = ctx.resume(); if (r && r.then) r.then(() => { if (ctx.state === 'running') f1Pass(); }).catch(() => {});
  } catch (e) {}
}

/** Reads a CSV export such as MAPP's Associate Report. Only the columns needed for training are kept; birthdays and other fields are ignored. */
function parseCsv(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) { const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"' && f === '') q = true; else if (ch === ',' || ch === ';') { row.push(f); f = ''; } else if (ch === '\n') { row.push(f); rows.push(row); row = []; f = ''; } else if (ch !== '\r') f += ch; }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}
function rosterFrom(rows) {
  const h = rows[0].map(x => x.toLowerCase().replace(/^\ufeff/, '').trim()), col = re => h.findIndex(x => re.test(x));
  const c = { name: col(/associate$|^name|full name|associate name/), email: col(/mail/), mobile: col(/mobile|cell|phone/), team: col(/^team/), start: col(/kw start|start date|join/), role: col(/role/), status: col(/^status/) };
  if (c.name < 0 || c.email < 0) throw new Error('The file needs a name column and an email column (for example the MAPP Associate Report export).');
  return rows.slice(1).map(r => ({ name: (r[c.name] || '').trim(), email: (r[c.email] || '').trim(), mobile: c.mobile >= 0 ? (r[c.mobile] || '').trim() : '', team: c.team >= 0 ? (r[c.team] || '').trim() : '', kw_join_date: c.start >= 0 ? (r[c.start] || '').trim() : '', role: c.role >= 0 ? (r[c.role] || '') : 'Agent', status: c.status >= 0 ? (r[c.status] || '') : 'Active' }));
}

  return '<div class="ph"><div><h1>Challenges</h1><p>The six-week journey and the ongoing weekly race. Assign a challenge from an agent\'s record, or to several agents here.</p></div></div><div class="card"><div class="tablebox"><table><thead><tr><th>Week</th><th>Challenge</th><th>Difficulty</th><th>Points</th><th></th></tr></thead><tbody>' + o.challenges.map(c => '<tr><td>' + (c.week || 'race') + '</td><td><b>' + esc(c.title) + '</b></td><td>' + esc(c.difficulty) + '</td><td>' + c.points + '</td><td><button class="btn sm" data-bulk="' + c.id + '">Assign to agents</button></td></tr>').join('') + '</tbody></table></div><p class="small muted">Edit wording, activities and knowledge checks under Learning content.</p></div>';
};
VIEWS.challenges.after = () => document.querySelectorAll('[data-bulk]').forEach(b => b.onclick = () => {
  const ag = S.ov.agents.filter(a => a.status === 'active'), today = new Date().toLocaleDateString('en-CA', { timeZone: 'Africa/Johannesburg' });
  dlg('Assign to agents', '<form class="form"><div class="grid g2"><label class="f">Opens<input type="date" id="bS" value="' + today + '"></label><label class="f">Due <span class="hint">empty = 7 days</span><input type="date" id="bD"></label></div><div style="max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:10px">' + ag.map(a => '<label class="check"><input type="checkbox" value="' + a.id + '" name="bA"> ' + esc(a.name) + '</label>').join('') + '</div><p class="alert bad" id="bErr" hidden></p></form>', '<button class="btn" data-close>Cancel</button><button class="btn red" id="bGo">Assign</button>', () => {
    $('bGo').onclick = async () => { const ids = [...document.querySelectorAll('input[name="bA"]:checked')].map(x => x.value); if (!ids.length) return; let n = 0, errs = []; for (const id of ids) { try { await api('trAssign', { op: 'assign', user: id, challenge: b.dataset.bulk, start: $('bS').value, due: $('bD').value }); n++; } catch (e) { errs.push(e.message); } } $('dlg').close(); toast(n + ' assigned' + (errs.length ? '; ' + errs.length + ' skipped (' + errs[0] + ')' : '')); };
  });
});
VIEWS.content = async () => {
  const c = await api('trContent'); S.content = c;
  const lessonRow = l => '<tr><td>' + esc(l.title) + '<div class="small muted">' + esc((c.modules.find(m => m.id === l.module_id) || {}).title || '') + '</div></td><td class="small">' + (l.updated_at ? fmtD(l.updated_at) : '') + '</td><td><button class="btn sm" data-edit="lessons:' + l.id + '">Edit</button></td></tr>';
  return '<div class="ph"><div><h1>Learning content</h1><p>Update instructions when MAPP, Loom or Command change. Edits apply immediately; nobody\'s progress is lost.</p></div><div class="row"><button class="btn" data-new="lessons">New lesson</button><button class="btn" data-new="challenges">New challenge</button><button class="btn" data-new="questions">New question</button></div></div>'
    + '<div class="card"><h2>Challenges</h2><table><tbody>' + c.challenges.map(x => '<tr><td>' + esc(x.title) + '</td><td>' + (x.week || 'race') + '</td><td><button class="btn sm" data-edit="challenges:' + x.id + '">Edit</button></td></tr>').join('') + '</tbody></table></div>'
    + '<div class="card"><h2>Knowledge check questions</h2><table><tbody>' + c.questions.map(q => '<tr><td>' + esc(q.question) + '<div class="small muted">' + esc(q.challenge_id) + '</div></td><td><button class="btn sm" data-edit="questions:' + q.id + '">Edit</button></td></tr>').join('') + '</tbody></table></div>'
    + '<div class="card"><h2>Lessons</h2><div class="tablebox"><table><thead><tr><th>Lesson</th><th>Updated</th><th></th></tr></thead><tbody>' + c.lessons.slice().sort((a, b) => a.order - b.order).map(lessonRow).join('') + '</tbody></table></div></div>';
};
const FORMS = {
  lessons: [['id', 'Short id', 'text'], ['module_id', 'Module', 'module'], ['title', 'Title', 'text'], ['summary', 'Summary', 'area'], ['steps', 'Steps, one per line', 'lines'], ['order', 'Order', 'num']],
  challenges: [['id', 'Short id', 'text'], ['title', 'Title', 'text'], ['week', 'Onboarding week (empty = ongoing race)', 'num'], ['track_id', 'Track', 'track'], ['difficulty', 'Difficulty (core or advanced)', 'text'], ['points', 'Verification points', 'num'], ['required', 'Required for onboarding (1 or 0)', 'num'], ['badge_id', 'Badge id (optional)', 'text'], ['objective', 'Learning objective', 'area'], ['activities', 'Required activities, one per line', 'lines'], ['assignment', 'Practical assignment', 'area'], ['evidence', 'Evidence required', 'area'], ['lessons', 'Lesson ids, comma separated', 'text'], ['resources', 'Learning resources, one per line', 'lines'], ['active', 'Active (1 or 0)', 'num']],
  questions: [['id', 'Short id', 'text'], ['challenge_id', 'Challenge id', 'text'], ['question', 'Question', 'area'], ['options', 'Answer options, one per line', 'lines'], ['answer', 'Number of the correct option (first = 0)', 'num'], ['explanation', 'Explanation shown after answering', 'area']]
};
function editDlg(table, rec) {
  const c = S.content, isNew = !rec; rec = rec || {};
  const field = ([k, l, t]) => { const v = rec[k] == null ? '' : rec[k]; if (t === 'module') return '<label class="f">' + l + '<select id="ed_' + k + '">' + c.modules.map(m => '<option value="' + m.id + '"' + (m.id === v ? ' selected' : '') + '>' + esc(m.title) + '</option>').join('') + '</select></label>'; if (t === 'track') return '<label class="f">' + l + '<select id="ed_' + k + '">' + c.tracks.map(m => '<option value="' + m.id + '"' + (m.id === v ? ' selected' : '') + '>' + esc(m.name) + '</option>').join('') + '</select></label>'; if (t === 'area' || t === 'lines') return '<label class="f">' + l + '<textarea id="ed_' + k + '">' + esc(t === 'lines' ? String(v).split('|').join('\n') : v) + '</textarea></label>'; return '<label class="f">' + l + '<input type="' + (t === 'num' ? 'number' : 'text') + '" id="ed_' + k + '" value="' + esc(v) + '"' + (k === 'id' && !isNew ? ' readonly' : '') + '></label>'; };
  dlg((isNew ? 'New ' : 'Edit ') + table.replace(/s$/, ''), '<form class="form">' + FORMS[table].map(field).join('') + '<p class="alert bad" id="edErr" hidden></p></form>', '<button class="btn" data-close>Cancel</button><button class="btn red" id="edGo">Save</button>', () => {
    $('edGo').onclick = async () => { const r = {}; FORMS[table].forEach(([k, , t]) => { const v = $('ed_' + k).value; r[k] = t === 'lines' ? v.split('\n').map(x => x.trim()).filter(Boolean).join('|') : v; }); try { await api('trContentSave', { table, rec: r }); $('dlg').close(); toast('Saved'); render(); } catch (e) { $('edErr').hidden = false; $('edErr').textContent = e.message; } };
  });
}
VIEWS.content.after = () => { document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { const [t, id] = b.dataset.edit.split(':'); editDlg(t, S.content[t].find(x => x.id === id)); }); document.querySelectorAll('[data-new]').forEach(b => b.onclick = () => editDlg(b.dataset.new, null)); };
VIEWS.points = async () => {
  const j = await api('trAdjustments');
  return '<div class="ph"><div><h1>Points</h1><p>Points come from fixed rules and can never be awarded twice for the same thing. Manual adjustments need a reason and a platform administrator\'s approval.</p></div></div><div class="card"><h2>Manual adjustments</h2>' + (j.items.length ? '<div class="tablebox"><table><thead><tr><th>Agent</th><th>Points</th><th>Reason</th><th>Requested by</th><th>Status</th><th></th></tr></thead><tbody>' + j.items.map(x => '<tr><td>' + esc(x.agent) + '</td><td class="num">' + (x.points > 0 ? '+' : '') + x.points + '</td><td>' + esc(x.reason) + '</td><td class="small">' + esc(x.by) + '<div class="muted">' + fmtD(x.at) + '</div></td><td>' + esc(x.status) + (x.approved_by ? '<div class="small muted">' + esc(x.approved_by) + '</div>' : '') + '</td><td>' + (j.canApprove && x.status === 'pending' ? '<button class="btn sm red" data-adj="' + x.id + '" data-ok="1">Approve</button> <button class="btn sm" data-adj="' + x.id + '">Reject</button>' : '') + '</td></tr>').join('') + '</tbody></table></div>' : empty('No manual adjustments.')) + '</div>';
};
VIEWS.points.after = () => document.querySelectorAll('[data-adj]').forEach(b => b.onclick = async () => { try { await api('trAdjustDecide', { id: b.dataset.adj, approve: !!b.dataset.ok }); toast('Done'); render(); } catch (e) { toast(e.message); } });
VIEWS.platform = async () => {
  const c = await api('trContent'), s = c.settings, o = S.ov || await getOv();
  const inp = (k, l, t) => '<label class="f">' + l + '<input type="' + (t || 'text') + '" data-set="' + k + '" value="' + esc(s[k]) + '"></label>';
  return '<div class="ph"><div><h1>Settings and security</h1><p>Platform administrator only.</p></div><div class="row"><button class="btn" id="bk">Back up now</button><button class="btn" id="au">Audit log</button></div></div>'
    + '<div class="card"><h2>Your signature</h2><p class="small muted" style="margin-top:0">Used on every email, every verification sign-off and every certificate.</p><div class="grid g2">' + inp('signer_name', 'Name') + inp('signer_title', 'Title') + inp('signer_office', 'Office') + inp('signer_email', 'Email', 'email') + inp('signer_website', 'Website', 'url') + inp('signer_focus', 'Focus line') + inp('signer_tools', 'Tools line') + inp('signer_booking', 'One-on-one booking link', 'url') + inp('signer_support', 'Tech support link', 'url') + inp('signer_tagline', 'Closing line') + inp('signature_banner', 'Signature banner image', 'url') + '</div><div class="row" style="flex-wrap:wrap;margin-top:12px"><label class="btn">Upload handwritten signature (PNG)<input type="file" id="sigHand" accept="image/png" hidden></label><button class="btn" id="sigPrev">Preview email signature</button></div><p class="small muted">' + (s.signature_hand ? 'Handwritten signature uploaded.' : 'No handwritten signature yet: certificates show your name in a script style until you upload one.') + '</p></div>'
    + '<div class="card"><h2>Email</h2><label class="f">Mode<select data-set="mail_mode"><option value="test"' + (s.mail_mode === 'test' ? ' selected' : '') + '>Test: every email goes to you, marked [TEST - TECH RACE]</option><option value="live"' + (s.mail_mode === 'live' ? ' selected' : '') + '>Live: emails go to agents</option></select></label></div>'
    + '<div class="card"><h2>Points rules</h2><div class="grid g4">' + inp('rule_lesson', 'Complete learning material', 'number') + inp('rule_check', 'Pass knowledge check', 'number') + inp('rule_submit', 'Submit practical assignment', 'number') + inp('rule_verify', 'MCTT verifies (default)', 'number') + inp('rule_attend', 'Attend training', 'number') + inp('rule_ontime', 'On-time bonus', 'number') + inp('rule_advanced', 'Advanced challenge', 'number') + inp('lesson_xp_week_cap', 'Weekly lesson XP limit', 'number') + inp('check_pass_pct', 'Knowledge check pass %', 'number') + '</div></div>'
    + '<div class="card"><h2>Booking and support links</h2><div class="grid g2">' + inp('support_url', 'Tech support ticket link', 'url') + inp('checkin_url', 'Tuesday Tech Check-In booking link', 'url') + inp('monday_link', 'Monday training joining link', 'url') + inp('monday_training', 'Monday training description') + inp('buddy_info', 'Lead Generation Buddy description') + inp('app_url', 'App address', 'url') + '</div><button class="btn red" id="saveSet" style="margin-top:12px">Save settings</button></div>'
    + '<div class="card"><h2>Roles</h2><p class="small muted">Nobody can change their own role. Changing roles signs the person out everywhere.</p><div class="tablebox"><table><thead><tr><th>Person</th><th>Agent</th><th>MCTT</th><th>Leadership</th><th>Platform</th><th></th></tr></thead><tbody>' + o.people.filter(a => a.status !== 'declined').map(a => '<tr><td>' + esc(a.name) + '<div class="small muted">' + esc(a.email) + '</div></td>' + ['agent', 'mctt', 'leader', 'platform'].map(r => '<td><input type="checkbox" data-role="' + a.id + '" value="' + r + '"' + (a.roles.includes(r) ? ' checked' : '') + '></td>').join('') + '<td><button class="btn sm" data-saverole="' + a.id + '">Save</button></td></tr>').join('') + '</tbody></table></div></div>';
};
VIEWS.platform.after = () => {
  $('saveSet').onclick = async () => { const s = {}; document.querySelectorAll('[data-set]').forEach(el => { s[el.dataset.set] = el.value; }); try { await api('trSettings', { settings: s }); toast('Settings saved'); } catch (e) { toast(e.message); } };
  $('sigHand').onchange = async () => { const f = $('sigHand').files[0]; if (!f) return; try { const b64 = await new Promise(ok => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.readAsDataURL(f); }); await api('trSigUpload', { file: { mime: f.type, b64 } }); toast('Handwritten signature saved'); render(); } catch (e) { toast(e.message); } };
  $('sigPrev').onclick = async () => { const j = await api('trSigPreview'); dlg('Email signature preview', '<iframe title="Email preview" style="width:100%;height:380px;border:1px solid var(--line);border-radius:8px" srcdoc="' + esc('<body style=\'margin:16px\'>' + j.html + '</body>') + '"></iframe>'); };
  $('bk').onclick = async () => { try { const j = await api('trBackup'); toast('Backup saved to Drive: ' + j.file); } catch (e) { toast(e.message); } };
  $('au').onclick = async () => { const j = await api('trAudit'); dlg('Audit log (latest 400)', '<ul class="trail">' + j.items.map(a => '<li><b>' + esc(a.action) + '</b> <span class="small muted">' + fmtDT(a.at) + ' · ' + esc(a.actor) + '</span><div class="small">' + esc(a.target) + ' ' + esc(a.detail) + '</div></li>').join('') + '</ul>'); };
  document.querySelectorAll('[data-saverole]').forEach(b => b.onclick = async () => { const id = b.dataset.saverole, roles = [...document.querySelectorAll('[data-role="' + id + '"]:checked')].map(x => x.value); try { await api('trRoles', { id, roles, leader_mc: roles.includes('leader') ? 'kw-edge' : '' }); toast('Roles saved'); } catch (e) { toast(e.message); } });
};

window.addEventListener('hashchange', () => { if (/^#(invite|verify|reset)=/.test(location.hash)) boot(); });
boot();
</script>
